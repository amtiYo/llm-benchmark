function slotClick(name,i,btn,shift){
  SFX.play('click');
  if(name==='out'){doCraft(shift);updateCraftResult();refreshInvUI();return;}
  if(name==='creative'){
    const st=ui.creative[i];
    if(!st)return;
    if(shift){
      const s=player.inv[player.sel];
      if(!s||s.id!==st.id)player.inv[player.sel]=newStack(st.id,stackMax(st.id));
    }else if(ui.cursor){ui.cursor=null;}
    else ui.cursor=newStack(st.id,stackMax(st.id));
    ui.dirtyInv=true;return;
  }
  const arr=getCont(name);
  if(!arr)return;
  const idx=contIndex(name,i);
  const s=arr[idx];
  if(shift&&s){
    /* quick transfer */
    if(name==='inv'){
      const to=idx<9?player.inv.slice(9):player.inv.slice(0,9);
      const put=addItemToInv(to,s.id,s.count);
      if(put<s.count){
        s.count=put;
        if(put<=0)arr[idx]=null;
      }
    }else if(ui.chest&&name==='chest'){
      const put=addItemToInv(player.inv,s.id,s.count);
      s.count=put;if(put<=0)arr[idx]=null;
    }else{
      const put=addItemToInv(player.inv,s.id,s.count);
      s.count=put;if(put<=0)arr[idx]=null;
    }
    ui.dirtyInv=true;refreshInvUI();return;
  }
  if(ui.cursor){
    if(name==='fout')return;
    if(s&&sameStack(s,ui.cursor)&&s.count<stackMax(s.id)){
      const add=Math.min(stackMax(s.id)-s.count,ui.cursor.count);
      s.count+=add;ui.cursor.count-=add;
      if(ui.cursor.count<=0)ui.cursor=null;
    }else if(!s){
      if(name==='ffuel'&&fuelValue(ui.cursor.id)<=0)return;
      if(name==='fin'&&smeltResult(ui.cursor.id)<0)return;
      arr[idx]=ui.cursor;ui.cursor=null;
    }else{
      arr[idx]=ui.cursor;ui.cursor=s;
    }
  }else if(s){
    if(btn===2){
      const half=Math.ceil(s.count/2);
      ui.cursor=newStack(s.id,half);ui.cursor.dur=s.dur;
      s.count-=half;if(s.count<=0)arr[idx]=null;
    }else{ui.cursor=s;arr[idx]=null;}
  }
  ui.dirtyInv=true;
  updateCraftResult();
  refreshInvUI();
}
function doCraft(all){
  updateCraftResult();
  if(!ui.craftResult)return;
  let times=1;
  if(all){
    times=64;
    for(const s of ui.craft.slots)if(s)times=Math.min(times,s.count);
  }
  for(let n=0;n<times;n++){
    const g=ui.craft.slots.map(s=>s?s.id:null);
    const r=matchRecipe(g,ui.craft.cols,ui.craft.cols);
    if(!r||r.out!==ui.craftResult.id)break;
    if(all){
      const left=addItemToInv(player.inv,r.out,r.count);
      if(left>0)break;
    }else{
      if(ui.cursor){
        if(!sameStack(ui.cursor,{id:r.out,count:1}))break;
        if(ui.cursor.count+r.count>stackMax(r.out))break;
        ui.cursor.count+=r.count;
      }else ui.cursor=newStack(r.out,r.count);
    }
    for(let k=0;k<ui.craft.slots.length;k++){
      const s=ui.craft.slots[k];
      if(s){s.count--;if(s.count<=0)ui.craft.slots[k]=null;}
    }
    SFX.play('craft');
    if(!all)break;
  }
  updateCraftResult();
}

const SAVE_KEY='voxelcraft_save_v1';
function serStack(s){return s?[s.id,s.count,s.dur||0]:null;}
function deserStack(a){return a?{id:a[0],count:a[1],dur:a[2]||0}:null;}
function saveWorld(quiet){
  try{
    const d={v:1,seed:world.seed,time:worldTime,
      p:{x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch,
        hp:player.health,hunger:player.hunger,air:player.air,gm:player.gamemode,sel:player.sel},
      inv:player.inv.map(serStack),edits:{},ents:{},weather:weather.mode};
    for(const [k,m] of world.edits)d.edits[k]=[...m].map(([i,b])=>[i,b]);
    world.blockEnts.forEach((e,k)=>{
      if(e.type==='chest')d.ents[k]={t:'c',s:e.slots.map(serStack)};
      else if(e.type==='furnace')d.ents[k]={t:'f',i:serStack(e.in),f:serStack(e.fuel),
        o:serStack(e.out),b:e.burn,c:e.cook};
    });
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
    if(!quiet)toast('World saved');
    return true;
  }catch(e){console.warn(e);toast('Save failed (storage full?)');return false;}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function loadWorld(){
  let d;
  try{d=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return false;}
  if(!d||d.v!==1)return false;
  world=new World(d.seed);
  worldTime=d.time||6000;
  weather.mode=d.weather||'clear';
  player.x=d.p.x;player.y=d.p.y;player.z=d.p.z;
  player.yaw=d.p.yaw;player.pitch=d.p.pitch;
  player.health=d.p.hp;player.hunger=d.p.hunger;player.air=d.p.air;
  player.gamemode=d.p.gm||'survival';player.sel=d.p.sel||0;
  player.vx=player.vy=player.vz=0;player.dead=false;
  player.inv=d.inv.map(deserStack);
  for(const k in (d.edits||{})){
    const [cx,cz]=k.split(',').map(Number);
    const c=world.getChunk(cx,cz);
    for(const [i,b] of d.edits[k])c.blocks[i]=b;
    world.edits.set(k,new Map(d.edits[k].map(([i,b])=>[i,b])));
  }
  for(const k in (d.ents||{})){
    const e=d.ents[k];const [x,y,z]=k.split(',').map(Number);
    if(e.t==='c'){
      const c=getChest(x,y,z,true);
      c.slots=e.s.map(deserStack);
    }else if(e.t==='f'){
      const f=getFurnace(x,y,z,true);
      f.in=deserStack(e.i);f.fuel=deserStack(e.f);f.out=deserStack(e.o);
      f.burn=e.b||0;f.cook=e.c||0;
    }
  }
  /* rebuild heightmaps + lights for edited chunks */
  world.edits.forEach((m,k)=>{
    const [cx,cz]=k.split(',').map(Number);
    const c=world.peekChunk(cx,cz);
    if(!c)return;
    c.lights.length=0;
    for(let z=0;z<CZ;z++)for(let x=0;x<CX;x++)world.touchColumn(c,cx*CX+x,cz*CZ+z);
    for(let y=0;y<CY;y++)for(let z=0;z<CZ;z++)for(let x=0;x<CX;x++){
      const b=c.blocks[x+CX*z+CX*CZ*y];
      if(BLOCKS[b].light>0)c.addLight(cx*CX+x,y,cz*CZ+z,BLOCKS[b].light);
    }
  });
  return true;
}

const keys={};

function bindInput(){
  const canvas=R.canvas;
  addEventListener('keydown',e=>{
    SFX.init();SFX.resume();
    if(e.code==='F3'||e.code==='Tab'||e.code==='Space')e.preventDefault();
    if(e.repeat){return;}
    keys[e.code]=true;
    switch(e.code){
      case 'Escape':
        if(ui.screen==='inv')closeInv();
        else if(ui.screen==='settings'||ui.screen==='controls')setScreen(ui.prevScreen);
        else if(ui.screen==='game')pauseGame();
        else if(ui.screen==='pause')resumeGame();
        break;
      case 'KeyE':
        if(ui.screen==='game')openInventory('inv');
        else if(ui.screen==='inv')closeInv();
        break;
      case 'KeyQ':
        if(ui.screen==='game')dropHeld(false);
        break;
      case 'KeyF':
        if(ui.screen==='game'&&player.gamemode==='creative'){
          player.flying=!player.flying;toast(player.flying?'Flying: on':'Flying: off');
        }
        break;
      case 'F3':
        if(ui.screen==='game'||ui.screen==='inv'){
          SETTINGS.showFps=SETTINGS.showFps?0:1;saveSettings();
        }
        break;
      case 'F5':
        if(ui.screen==='game'){
          weather.mode=weather.mode==='clear'?'rain':(weather.mode==='rain'?'snow':'clear');
          weather.timer=60;toast('Weather: '+weather.mode);
        }
        break;
      case 'F1':
        if(ui.screen==='game'){ui.hudHidden=!ui.hudHidden;toast(ui.hudHidden?'HUD hidden':'HUD shown');}
        break;
    }
    if(e.code.startsWith('Digit')&&(ui.screen==='game'||ui.screen==='inv')){
      const n=+e.code.slice(5);
      if(n>=1&&n<=9){player.sel=n-1;ui.pickBlock=-1;showHeldName();ui.dirtyInv=true;}
    }

    }
    if(!st){tip.classList.add('hide');return;}
    const it=ITEMS[st.id];
    let txt=itemName(st.id);
    let sub='';
    if(it.tool)sub='tool · '+it.tool.kind+' · '+Math.round(st.dur)+'/'+it.tool.maxdur+' uses';
    else if(it.food)sub='food · +'+it.food.hunger+' hunger';
    else if(fuelValue(st.id)>0)sub='fuel · '+fuelValue(st.id)+'s';
    else if(smeltResult(st.id)>=0)sub='smelts into '+itemName(smeltResult(st.id));
    else sub='placeable block';
    tip.innerHTML='<div>'+txt+'</div><div class="tt">'+sub+'</div>';
    tip.classList.remove('hide');
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top=(e.clientY+16)+'px';
  });
  wrap.addEventListener('mouseleave',()=>{$('tip').classList.add('hide');});
  /* menu buttons */
  $('btnPlay').onclick=()=>{SFX.init();SFX.play('click');newGame();};
  $('btnLoad').onclick=()=>{SFX.init();SFX.play('click');continueGame();};
  $('btnSeedRand').onclick=()=>{$('seedIn').value=String(Math.floor(Math.random()*1e9));};
  $('btnSettingsT').onclick=()=>{ui.prevScreen='title';buildSettings();setScreen('settings');};
  $('btnControlsT').onclick=()=>{ui.prevScreen='title';buildControls();setScreen('controls');};
  $('btnResume').onclick=()=>{SFX.play('click');resumeGame();};
  $('btnSettingsP').onclick=()=>{ui.prevScreen='pause';buildSettings();setScreen('settings');};
  $('btnControlsP').onclick=()=>{ui.prevScreen='pause';buildControls();setScreen('controls');};
  $('btnSave').onclick=()=>{SFX.play('click');saveWorld();quitToTitle();};
  $('btnSettingsBack').onclick=()=>{SFX.play('click');setScreen(ui.prevScreen);};
  $('btnControlsBack').onclick=()=>{SFX.play('click');setScreen(ui.prevScreen);};
  $('btnRespawn').onclick=()=>{SFX.play('click');respawn();};
  $('btnDeathTitle').onclick=()=>{SFX.play('click');quitToTitle();};
}
function tryUse(){
  const p=player;
  if(p.useCd>0)return;
  p.useCd=0.22;
  const s=heldStack();
  if(s&&p.gamemode!=='creative'){
    if(s.id===IT_BUCKET&&target&&world.getBlock(target.x,target.y,target.z)===WATER){
      world.setBlock(target.x,target.y,target.z,AIR);
      s.count--;if(s.count<=0)p.inv[p.sel]=null;
      const left=addItemToInv(p.inv,IT_WBUCKET,1);
      SFX.play('splash');p.swingT=0.28;ui.dirtyInv=true;return;
    }
    if(s.id===IT_WBUCKET){
      if(target){
        const x=target.x+target.nx,y=target.y+target.ny,z=target.z+target.nz;
        if(canPlaceAt(x,y,z)){
          world.setBlock(x,y,z,WATER);
          s.count--;if(s.count<=0)p.inv[p.sel]=null;
          const left=addItemToInv(p.inv,IT_BUCKET,1);
          SFX.play('splash');p.swingT=0.28;ui.dirtyInv=true;
        }
      }
      return;
    }
  }
  if(!useItem())p.swingT=0.28;
}
function dropHeld(all){
  const s=heldStack();
  if(!s||player.gamemode==='creative')return;
  const n=all?s.count:1;
  const d=camDir();
  spawnDrop(player.x+d[0]*0.7,player.y+1.25,player.z+d[2]*0.7,s.id,n);
  s.count-=n;
  if(s.count<=0&&player.inv[player.sel])player.inv[player.sel]=null;
  SFX.play('drop');
  ui.dirtyInv=true;
}
function pickBlock(){
  if(!target)return;
  const b=target.block;
  const dropId=BLOCKS[b].drop>=0?BLOCKS[b].drop:b;
  if(player.gamemode==='creative'){
    ui.pickBlock=dropId;player.inv[player.sel]=newStack(dropId,64);
    showHeldName();ui.dirtyInv=true;return;
  }
  for(let i=0;i<9;i++){
    if(player.inv[i]&&player.inv[i].id===dropId){player.sel=i;showHeldName();ui.dirtyInv=true;return;}
  }
}

/* ============================= game flow ================================ */
let state='boot';
let loadProgress=0;
function findSpawn(){
  let sx=0,sz=0,found=false;
  for(let r=0;r<300&&!found;r+=6){
    for(let a=0;a<16;a++){
      const ang=(a/16)*TAU;
      const x=Math.round(Math.cos(ang)*r),z=Math.round(Math.sin(ang)*r);
      const h=world.heightAt(x,z);
      if(h>SEA&&h<CY-24&&(world.getBlock(x,h,z)===GRASS||world.getBlock(x,h,z)===SNOW)){
        sx=x;sz=z;found=true;break;
      }
    }
  }
  if(!found){sx=0;sz=0;}
  const h=world.heightAt(sx,sz);
  player.x=sx+0.5;player.z=sz+0.5;player.y=h+1.2;
  player.vx=player.vy=player.vz=0;
}
function newGame(){
  const raw=$('seedIn').value.trim();
  let seed;
  if(raw==='')seed=(Math.random()*1e9)|0;
  else if(/^\d+$/.test(raw))seed=(parseInt(raw,10)>>>0);
  else seed=hashStr(raw);
  world=new World(seed);
  worldTime=6000;
  weather.mode='clear';weather.rain=0;weather.snow=0;weather.overcast=0;weather.timer=90;
  player.inv.fill(null);
  player.health=20;player.hunger=20;player.sat=5;player.air=10;
  player.dead=false;player.gamemode=SETTINGS.gamemode;player.flying=false;
  player.sel=0;player.yaw=Math.random()*TAU;player.pitch=0;
  drops.length=0;falling.length=0;arrows.length=0;mobs.length=0;particles.length=0;
  chunkMgr.loaded.clear();chunkMgr.ccx=1e9;chunkMgr.rd=-1;
  findSpawn();
  toast('Seed: '+seed);
  beginLoad();
}
function continueGame(){
  if(!loadWorld()){toast('No saved world found');return;}
  drops.length=0;falling.length=0;arrows.length=0;mobs.length=0;particles.length=0;
  chunkMgr.loaded.clear();chunkMgr.ccx=1e9;chunkMgr.rd=-1;
  beginLoad();
}
function quitToTitle(){
  setScreen('title');
  state='title';
  player.dead=false;
  $('btnLoad').classList.toggle('hide',!hasSave());
}
function respawn(){
  player.dead=false;
  player.health=20;player.hunger=20;player.air=10;player.sat=5;
  player.flying=false;
  findSpawn();
  setScreen('game');
  state='game';
}
function beginLoad(){
  setScreen('loading');
  state='loading';
  chunkMgr.update(player.x,player.z,SETTINGS.renderDistance,4);
  loadProgress=0;
}
function updateLoading(dt){
  chunkMgr.update(player.x,player.z,SETTINGS.renderDistance,14);
  const tot=chunkMgr.pending.length;
  const done=chunkMgr.loaded.size;
  const p=clamp(done/Math.max(1,tot),0,1);
  loadProgress=lerp(loadProgress,p,0.25);
  $('loadBar').style.width=(loadProgress*100)+'%';
  $('loadTxt').textContent=Math.floor(loadProgress*100)+'%';
  $('loadSub').textContent='building terrain · '+done+'/'+tot+' chunks';
  if(p>=0.999&&loadProgress>0.98){
    setScreen('game');
    state='game';
  }
}
function caveAmbience(){
  const h=world.heightAt(Math.floor(player.x),Math.floor(player.z));
  return (player.y<h-6&&!player.headInWater)?clamp((h-6-player.y)/10,0,1):0;
}
function updateGame(dt){
  if(player.dead){updateParticles(dt);return;}
  const scale=24000/Math.max(30,SETTINGS.dayLength);
  worldTime=(worldTime+dt*scale)%24000;
  updatePlayer(dt);
  if(player.attackJust>0)player.attackJust-=dt;
  updateMining(dt);
  updateDrops(dt);
  updateFalling(dt);
  updateArrows(dt);
  updateMobs(dt);
  updateParticles(dt);
  updateFurnaces(dt);
  updateWeather(dt);
  updateRain(dt);
  if(mouse.right)tryUse();
  chunkMgr.update(player.x,player.z,SETTINGS.renderDistance,7);
  SFX.ambient(weather.rain*(player.y>world.heightAt(Math.floor(player.x),Math.floor(player.z))-2?1:0.15),
    caveAmbience());
  SFX.underwater(player.headInWater);
}
function updateTitle(dt){
  worldTime=(worldTime+dt*8)%24000;
  player.yaw+=dt*0.055;
  player.pitch=-0.12;
  chunkMgr.update(player.x,player.z,Math.min(5,SETTINGS.renderDistance),6);
  updateParticles(dt);
  weather.overcast=lerp(weather.overcast,0.15,dt);
  weather.rain=lerp(weather.rain,0,dt);
  weather.snow=lerp(weather.snow,0,dt);
}
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT)lastT=now;
  const dt=Math.min(0.06,(now-lastT)/1000);
  lastT=now;
  fpsSmooth=lerp(fpsSmooth,1/Math.max(0.0005,dt),0.08);
  fpsTimer+=dt;frameCount++;
  if(fpsTimer>0.35){fpsShown=fpsSmooth;fpsTimer=0;frameCount=0;}
  if(state==='boot')return;
  if(state==='title')updateTitle(dt);
  else if(state==='loading')updateLoading(dt);
  else if(state==='game'){
    if(ui.screen==='game'||ui.screen==='inv'){
      updateGame(dt);
    }else{
      updateParticles(dt);
      updateFurnaces(dt);
      chunkMgr.update(player.x,player.z,SETTINGS.renderDistance,6);
    }
  }
  try{renderScene(dt);}catch(e){console.error(e);}
  updateHUD(dt);
}
/* ================================ boot ================================== */
function boot(){
  loadSettings();
  const canvas=$('gl');
  try{
    R.init(canvas);
  }catch(e){
    $('splash').innerHTML='<div class="lg" style="color:#e0654f">WEBGL UNAVAILABLE</div>'+
      '<div class="sm">'+String(e.message||e)+'</div>';
    return;
  }
  ui.creative=ITEMS.map((it,i)=>newStack(i,stackMax(i)));
  buildHUD();
  bindInput();
  buildControls();
  /* a small world for the title screen backdrop */
  world=new World((Math.random()*1e9)|0);
  findSpawn();
  player.y+=6;
  player.gamemode='creative';
  $('btnLoad').classList.toggle('hide',!hasSave());
  $('splash').style.transition='opacity .5s';
  $('splash').style.opacity='0';
  setTimeout(()=>{$('splash').remove();},520);
  setScreen('title');
  state='title';
  requestAnimationFrame(frame);
  /* autosave */
  setInterval(()=>{if(state==='game'&&!player.dead)saveWorld(true);},60000);
  addEventListener('beforeunload',()=>{if(state==='game'&&!player.dead)saveWorld(true);});
}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',boot);
else boot();

/*__END__*/
