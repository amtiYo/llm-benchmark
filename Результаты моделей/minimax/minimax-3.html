  dropMeshTemplate = {};
  for (const id in blockIcons) {
    const tex = new THREE.CanvasTexture(blockIcons[id]);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    const mat = new THREE.MeshLambertMaterial({ map: tex, transparent: id == B.LEAVES || id == B.GLASS, side: THREE.DoubleSide });
    const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
    dropMeshTemplate[id] = { geo, mat };
  }
}

function updateDrops(dt) {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.age += dt;
    d.vy -= PHYS.gravity * dt;
    if (d.vy < -PHYS.terminalVel) d.vy = -PHYS.terminalVel;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;
    d.vx *= 0.95; d.vz *= 0.95;
    // Ground collision
    const bx = Math.floor(d.x), by = Math.floor(d.y), bz = Math.floor(d.z);
    const below = getBlock(bx, by, bz);
    if (by >= 0 && isSolidBlock(below)) {
      d.y = by + 1.0;
      d.vy = 0;
    }
    // Pickup
    if (d.age > 0.5) {
      const dx = player.x - d.x, dy = (player.y + player.eyeHeight) - d.y, dz = player.z - d.z;
      if (dx*dx + dy*dy + dz*dz < 2.5 * 2.5) {
        if (addToInventory(d.blockId, 1)) {
          drops.splice(i, 1);
          playSound('pickup');
          continue;
        }
      }
    }
    // Despawn after long time
    if (d.age > 120) { drops.splice(i, 1); continue; }
  }
}

let dropMeshes = []; // InstancedMesh per block
function rebuildDropMeshes() {
  for (const m of dropMeshes) {
    if (m.mesh) {
      scene.remove(m.mesh);
      m.mesh.dispose();
    }
  }
  dropMeshes = [];
  const counts = {};
  for (const d of drops) counts[d.blockId] = (counts[d.blockId] || 0) + 1;
  for (const id in counts) {
    if (!dropMeshTemplate[id]) continue;
    const tmpl = dropMeshTemplate[id];
    const im = new THREE.InstancedMesh(tmpl.geo, tmpl.mat, counts[id]);
    im.frustumCulled = false;
    scene.add(im);
    dropMeshes.push({ id: parseInt(id), mesh: im });
  }
}
let lastDropRebuild = 0;
function updateDropMeshPositions() {
  const time = performance.now() * 0.001;
  const groups = {};
  for (const m of dropMeshes) groups[m.id] = [];
  for (const d of drops) {
    if (groups[d.blockId]) {
      const bob = Math.sin(time * 2 + d.bobPhase) * 0.05 + 0.05;
      groups[d.blockId].push({ x: d.x, y: d.y + bob, z: d.z, ry: time * 1.5 + d.bobPhase });
    }
  }
  const dummy = new THREE.Object3D();
  for (const m of dropMeshes) {
    const arr = groups[m.id] || [];
    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      dummy.position.set(a.x, a.y, a.z);
      dummy.rotation.set(0, a.ry, 0);
      dummy.updateMatrix();
      m.mesh.setMatrixAt(i, dummy.matrix);
    }
    m.mesh.count = arr.length;
    m.mesh.instanceMatrix.needsUpdate = true;
  }
}

// =====================================================================
// PARTICLES
// =====================================================================
const particles = [];

function spawnParticles(x, y, z, blockId, count = 12) {
  const tex = blockIcons[blockId];
  if (!tex) return;
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, z,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 1,
      vz: (Math.random() - 0.5) * 3,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 1.0,
      size: 0.15 + Math.random() * 0.1,
      tex
    });
  }
}

let particleTextureCache = null;
function buildParticleTexture() {
  const c = makeCanvas(8, 8);
  const cc = ctx(c);
  cc.fillStyle = '#fff';
  cc.fillRect(0, 0, 8, 8);
  particleTextureCache = new THREE.CanvasTexture(c);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vy -= 12 * dt;
    p.vx *= 0.95; p.vz *= 0.95;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

let particleMesh = null;
function rebuildParticleMesh() {
  if (particleMesh) { scene.remove(particleMesh); particleMesh.geometry.dispose(); }
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(particles.length * 3);
  const uvs = new Float32Array(particles.length * 2);
  const sizes = new Float32Array(particles.length);
  for (let i = 0; i < particles.length; i++) {
    positions[i*3] = particles[i].x;
    positions[i*3+1] = particles[i].y;
    positions[i*3+2] = particles[i].z;
    uvs[i*2] = 0; uvs[i*2+1] = 0;
    sizes[i] = particles[i].size;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({
    map: particleTextureCache,
    size: 0.2,
    sizeAttenuation: true,
    transparent: true,
    depthWrite: false,
    color: 0xffffff
  });
  particleMesh = new THREE.Points(geo, mat);
  scene.add(particleMesh);
}
function updateParticleMesh() {
  if (!particleMesh) return;
  const positions = particleMesh.geometry.attributes.position.array;
  for (let i = 0; i < particles.length; i++) {
    positions[i*3] = particles[i].x;
    positions[i*3+1] = particles[i].y;
    positions[i*3+2] = particles[i].z;
  }
  particleMesh.geometry.attributes.position.needsUpdate = true;
  particleMesh.geometry.setDrawRange(0, particles.length);
}

// =====================================================================
// AUDIO (procedural via Web Audio)
// =====================================================================
let audioCtx = null;
let audioReady = false;

function initAudio() {
  if (audioReady) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioReady = true;
  } catch (e) {}
}

function playSound(type, params = {}) {
  if (!audioReady || SETTINGS.volume <= 0) return;
  const vol = SETTINGS.volume;
  const now = audioCtx.currentTime;
  const out = audioCtx.createGain();
  out.gain.value = vol;
  out.connect(audioCtx.destination);

  function tone(freq, dur, type = 'sine', vol0 = 1) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol0, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(out);
    o.start(now);
    o.stop(now + dur);
  }
  function noise(dur, vol0 = 1, filterFreq = 4000) {
    const bufSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = filterFreq;
    const g = audioCtx.createGain();
    g.gain.value = vol0;
    src.connect(f); f.connect(g); g.connect(out);
    src.start(now);
  }

  if (type === 'break') {
    noise(0.15, 0.6, 3000);
    tone(120, 0.1, 'square', 0.3);
  } else if (type === 'place') {
    tone(200, 0.05, 'square', 0.5);
    tone(300, 0.05, 'square', 0.4);
    noise(0.08, 0.4, 2000);
  } else if (type === 'step') {
    noise(0.08, 0.3, 1500);
  } else if (type === 'splash') {
    noise(0.2, 0.4, 4000);
  } else if (type === 'pickup') {
    tone(600, 0.05, 'sine', 0.4);
    tone(800, 0.05, 'sine', 0.3);
  } else if (type === 'hurt') {
    tone(150, 0.2, 'sawtooth', 0.6);
    noise(0.15, 0.4, 1500);
  } else if (type === 'jump') {
    tone(300, 0.1, 'sine', 0.3);
  } else if (type === 'fall') {
    noise(0.3, 0.5, 1500);
  }
}

// =====================================================================
// RAYCAST (DDA voxel)
// =====================================================================
function raycastBlock(maxDist) {
  const origin = camera.position;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  let x = Math.floor(origin.x);
  let y = Math.floor(origin.y);
  let z = Math.floor(origin.z);

  const stepX = dir.x > 0 ? 1 : (dir.x < 0 ? -1 : 0);
  const stepY = dir.y > 0 ? 1 : (dir.y < 0 ? -1 : 0);
  const stepZ = dir.z > 0 ? 1 : (dir.z < 0 ? -1 : 0);

  const tDeltaX = stepX !== 0 ? Math.abs(1 / dir.x) : Infinity;
  const tDeltaY = stepY !== 0 ? Math.abs(1 / dir.y) : Infinity;
  const tDeltaZ = stepZ !== 0 ? Math.abs(1 / dir.z) : Infinity;

  const next = (o, d, s) => s > 0 ? Math.ceil(o) - o : (s < 0 ? o - Math.floor(o) : Infinity);
  let tMaxX = stepX !== 0 ? next(origin.x, dir.x, stepX) / dir.x * stepX : Infinity;
  let tMaxY = stepY !== 0 ? next(origin.y, dir.y, stepY) / dir.y * stepY : Infinity;
  let tMaxZ = stepZ !== 0 ? next(origin.z, dir.z, stepZ) / dir.z * stepZ : Infinity;

  let face = { x: 0, y: 0, z: 0 };
  let t = 0;

  for (let i = 0; i < 200 && t < maxDist; i++) {
    const block = getBlock(x, y, z);
    if (isSolidBlock(block)) {
      return { x, y, z, block, face: { ...face }, t };
    }
    if (tMaxX < tMaxY && tMaxX < tMaxZ) {
      x += stepX; t = tMaxX; tMaxX += tDeltaX;
      face = { x: -stepX, y: 0, z: 0 };
    } else if (tMaxY < tMaxZ) {
      y += stepY; t = tMaxY; tMaxY += tDeltaY;
      face = { x: 0, y: -stepY, z: 0 };
    } else {
      z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ;
      face = { x: 0, y: 0, z: -stepZ };
    }
  }
  return null;
}

// =====================================================================
// MINING / PLACING
// =====================================================================
const mining = {
  target: null,
  progress: 0,
  totalTime: 0,
  active: false,
  crackStage: 0
};

function startMining(target) {
  if (mining.target && mining.target.x === target.x && mining.target.y === target.y && mining.target.z === target.z) {
    return;
  }
  mining.target = target;
  const hardness = HARDNESS[target.block] || 1;
  if (hardness < 0) {
    // Unbreakable
    mining.totalTime = Infinity;
  } else {
    mining.totalTime = hardness;
  }
  mining.progress = 0;
  mining.crackStage = 0;
}

function tickMining(dt) {
  if (!mining.target) return;
  const t = mining.target;
  const cur = getBlock(t.x, t.y, t.z);
  if (cur !== t.block) {
    mining.target = null;
    return;
  }
  if (mining.totalTime === Infinity) return;
  mining.progress += dt;
  const newStage = Math.min(4, Math.floor((mining.progress / mining.totalTime) * 5));
  if (newStage !== mining.crackStage) {
    mining.crackStage = newStage;
  }
  if (mining.progress >= mining.totalTime) {
    // Break the block
    const dropId = getDropForBlock(t.block);
    setBlock(t.x, t.y, t.z, B.AIR);
    if (dropId !== B.AIR) {
      spawnDrop(t.x + 0.5, t.y + 0.5, t.z + 0.5, dropId);
    }
    spawnParticles(t.x + 0.5, t.y + 0.5, t.z + 0.5, t.block, 16);
    playSound('break');
    mining.target = null;
    mining.progress = 0;
  }
}

function getDropForBlock(block) {
  // Most blocks drop themselves; special cases
  if (block === B.STONE) return B.COBBLESTONE;
  if (block === B.GRASS) return B.DIRT;
  if (block === B.LEAVES) return Math.random() < 0.1 ? B.LEAVES : B.AIR;
  if (block === B.GRAVEL) return Math.random() < 0.1 ? B.FLINT || B.AIR : B.GRAVEL;
  if (block === B.COAL) return B.COAL;
  if (block === B.DIAMOND) return B.DIAMOND;
  if (block === B.IRON) return B.IRON;
  if (block === B.GOLD) return B.GOLD;
  if (block === B.LAPIS) return B.LAPIS;
  if (block === B.EMERALD) return B.EMERALD;
  if (block === B.REDSTONE) return B.REDSTONE;
  if (block === B.COBBLESTONE_STAIRS) return B.COBBLESTONE;
  if (block === B.STONE_BRICKS) return B.STONE_BRICKS;
  if (block === B.WOOD) return B.WOOD;
  if (block === B.PLANKS) return B.PLANKS;
  if (block === B.GLASS) return B.AIR; // Glass shatters
  if (block === B.ICE) return B.AIR;
  if (block === B.FURNACE) return B.FURNACE;
  if (block === B.CRAFTING_TABLE) return B.CRAFTING_TABLE;
  return block;
}

function placeBlockAt(target) {
  if (!selectedSlot() || selectedSlot().count <= 0) return;
  const block = selectedSlot().id;
  if (block === B.AIR) return;
  if (!BLOCK_TEX[block]) return; // not a placeable block (e.g., stick)
  // Place at target + face
  const px = target.x + target.face.x;
  const py = target.y + target.face.y;
  const pz = target.z + target.face.z;
  // Don't place inside player
  if (collidesAtPos(px + 0.5, py, pz + 0.5)) return;
  // Don't replace existing
  if (isSolidBlock(getBlock(px, py, pz))) return;
  setBlock(px, py, pz, block);
  removeFromInventory(block, 1);
  updateHotbarUI();
  spawnParticles(px + 0.5, py + 0.5, pz + 0.5, block, 6);
  playSound('place');
}

function collidesAtPos(x, y, z) {
  const hw = player.width / 2;
  const minX = Math.floor(x - hw), maxX = Math.floor(x + hw);
  const minY = Math.floor(y), maxY = Math.floor(y + player.height);
  const minZ = Math.floor(z - hw), maxZ = Math.floor(z + hw);
  for (let bx = minX; bx <= maxX; bx++) for (let by = minY; by <= maxY; by++) for (let bz = minZ; bz <= maxZ; bz++) {
    if (isSolidBlock(getBlock(bx, by, bz))) return true;
  }
  return false;
}

// =====================================================================
// PHYSICS / MOVEMENT
// =====================================================================
function updatePlayer(dt) {
  // Get input direction
  const forward = (input.forward ? 1 : 0) - (input.back ? 1 : 0);
  const strafe = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const sprint = input.sprint && forward > 0 && !input.crouch;
  player.sprinting = sprint;
  player.crouching = input.crouch;
  const speed = player.crouching ? PHYS.crouchSpeed : (sprint ? PHYS.sprintSpeed : (player.inWater ? PHYS.swimSpeed : PHYS.walkSpeed));

  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  let dx = (cos * forward - sin * strafe) * speed;
  let dz = (sin * forward + cos * strafe) * speed;

  // Jump
  if (input.jump) {
    if (player.onGround && !player.inWater) {
      player.vy = PHYS.jumpV;
      player.onGround = false;
      playSound('jump');
    } else if (player.inWater) {
      player.vy = 5;
    }
    input.jump = false; // single press
  }

  // Gravity
  if (player.inWater) {
    player.vy -= PHYS.gravity * 0.3 * dt;
    player.vy *= Math.pow(0.92, dt * 60);
    if (player.vy < -2) player.vy = -2;
  } else {
    player.vy -= PHYS.gravity * dt;
    if (player.vy < -PHYS.terminalVel) player.vy = -PHYS.terminalVel;
  }

  // Apply velocity, with collision
  // X axis
  let newX = player.x + dx * dt;
  if (!collidesAtPos(newX, player.y, player.z)) {
    player.x = newX;
  } else {
    player.vx = 0;
  }
  // Z axis
  let newZ = player.z + dz * dt;
  if (!collidesAtPos(player.x, player.y, newZ)) {
    player.z = newZ;
  } else {
    player.vz = 0;
  }
  // Y axis
  let newY = player.y + player.vy * dt;
  if (!collidesAtPos(player.x, newY, player.z)) {
    player.y = newY;
    player.onGround = false;
  } else {
    if (player.vy < 0) {
      // Hit ground
      const fell = player.y - player.fallStart;
      if (fell > 3 && !player.crouching) {
        const damage = Math.floor(fell - 3);
        if (damage > 0) {
          damagePlayer(damage, 'Hit the ground too hard');
        }
      }
      player.onGround = true;
    }
    player.vy = 0;
  }

  // Check water
  const headBlock = getBlock(Math.floor(player.x), Math.floor(player.y + 0.5), Math.floor(player.z));
  player.inWater = headBlock === B.WATER;
  if (player.inWater && Math.random() < 0.02) {
    playSound('splash');
  }

  // Step sound
  if (player.onGround && (Math.abs(dx) > 0.5 || Math.abs(dz) > 0.5) && !player.inWater) {
    if (Math.random() < 0.04) playSound('step');
  }

  // Hunger drain
  player.hungerTimer += dt;
  if (player.hungerTimer > 8) {
    player.hungerTimer = 0;
    if (player.hunger > 0) player.hunger -= 1;
  }
  // Health regen when hunger high
  if (player.hunger >= 18 && player.health < player.maxHealth) {
    player.healthRegenTimer += dt;
    if (player.healthRegenTimer > 4) {
      player.healthRegenTimer = 0;
      player.health = Math.min(player.maxHealth, player.health + 1);
      updateStatusUI();
    }
  }

  // Fall start tracking
  if (player.vy < -0.5 && !player.onGround) {
    if (player.fallStart === 0 || player.y < player.fallStart) {
      player.fallStart = player.y;
    }
  } else if (player.onGround) {
    player.fallStart = player.y;
  }

  // Out of world
  if (player.y < -10) {
    damagePlayer(player.maxHealth, 'Fell out of the world');
  }

  updateStatusUI();

  // Camera position with bobbing
  const bobAmount = (player.onGround && (Math.abs(dx) > 0.5 || Math.abs(dz) > 0.5)) ?
    Math.sin(performance.now() * 0.012) * 0.05 * (sprint ? 2 : 1) : 0;
  const crouchOffset = player.crouching ? -0.3 : 0;
  camera.position.set(
    player.x,
    player.y + player.eyeHeight + bobAmount + crouchOffset,
    player.z
  );
  camera.rotation.set(0, 0, 0, 'YXZ');
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

function damagePlayer(amount, reason) {
  player.health -= amount;
  document.getElementById('damage-vignette').classList.add('show');
  setTimeout(() => document.getElementById('damage-vignette').classList.remove('show'), 300);
  playSound('hurt');
  if (player.health <= 0) {
    die(reason);
  }
  updateStatusUI();
}

function die(reason) {
  gameState = 'dead';
  document.getElementById('death-reason').textContent = reason || '';
  document.getElementById('death-screen').classList.remove('hidden');
  document.exitPointerLock();
  // Drop all items
  for (const s of inventory.slots) {
    if (s) {
      for (let i = 0; i < s.count; i++) {
        spawnDrop(player.x, player.y + 1, player.z, s.id);
      }
    }
  }
  inventory.slots = [];
  for (let i = 0; i < 36; i++) inventory.slots.push(null);
  updateHotbarUI();
  updateInventoryUI();
}

function respawn() {
  player.x = player.spawnPoint.x;
  player.y = player.spawnPoint.y;
  player.z = player.spawnPoint.z;
  player.vx = player.vy = player.vz = 0;
  player.health = player.maxHealth;
  player.hunger = player.maxHunger;
  document.getElementById('death-screen').classList.add('hidden');
  giveStartingItems();
  updateHotbarUI();
  gameState = 'playing';
  canvas.requestPointerLock();
}

// =====================================================================
// UI
// =====================================================================
function updateHotbarUI() {
  const hb = document.getElementById('hotbar');
  hb.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (i === inventory.selected ? ' active' : '');
    const num = document.createElement('div');
    num.className = 'slot-num';
    num.textContent = (i + 1).toString();
    slot.appendChild(num);
    const item = inventory.slots[i];
    if (item) {
      const img = document.createElement('canvas');
      img.className = 'item-icon';
      img.width = 36; img.height = 36;
      const ic = ctx(img);
      ic.imageSmoothingEnabled = false;
      if (blockIcons[item.id]) {
        ic.drawImage(blockIcons[item.id], 0, 0, 36, 36);
      }
      slot.appendChild(img);
      if (item.count > 1) {
        const ct = document.createElement('div');
        ct.className = 'item-count';
        ct.textContent = item.count;
        slot.appendChild(ct);
      }
    }
    hb.appendChild(slot);
  }
}

function updateInventoryUI() {
  const main = document.getElementById('inv-main');
  main.innerHTML = '';
  for (let i = 0; i < 36; i++) {
    main.appendChild(makeInvSlot(i, inventory.slots[i]));
  }
}

function makeInvSlot(idx, item) {
  const slot = document.createElement('div');
  slot.className = 'inv-slot';
  slot.dataset.idx = idx;
  if (item) {
    const img = document.createElement('canvas');
    img.className = 'item-icon';
    img.width = 28; img.height = 28;
    const ic = ctx(img);
    ic.imageSmoothingEnabled = false;
    if (blockIcons[item.id]) {
      ic.drawImage(blockIcons[item.id], 0, 0, 28, 28);
    }
    slot.appendChild(img);
    if (item.count > 1) {
      const ct = document.createElement('div');
      ct.className = 'item-count';
      ct.textContent = item.count;
      slot.appendChild(ct);
    }
  }
  slot.addEventListener('mousedown', (e) => onSlotClick(e, idx, item));
  return slot;
}

function onSlotClick(e, idx, item) {
  if (e.button === 0) {
    // Left click: pick up or place
    if (cursorItem) {
      // Place
      if (item && item.id === cursorItem.id && item.count < inventory.maxStack) {
        const can = Math.min(cursorItem.count, inventory.maxStack - item.count);
        item.count += can;
        cursorItem.count -= can;
        if (cursorItem.count <= 0) cursorItem = null;
      } else if (!item) {
        inventory.slots[idx] = cursorItem;
        cursorItem = null;
      } else {
        const tmp = inventory.slots[idx];
        inventory.slots[idx] = cursorItem;
        cursorItem = tmp;
      }
    } else {
      // Pick up
      if (item) {
        cursorItem = inventory.slots[idx];
        inventory.slots[idx] = null;
      }
    }
  } else if (e.button === 2) {
    // Right click: place one
    if (cursorItem) {
      if (!item) {
        inventory.slots[idx] = { id: cursorItem.id, count: 1 };
        cursorItem.count -= 1;
        if (cursorItem.count <= 0) cursorItem = null;
      } else if (item.id === cursorItem.id && item.count < inventory.maxStack) {
        item.count += 1;
        cursorItem.count -= 1;
        if (cursorItem.count <= 0) cursorItem = null;
      }
    } else if (item) {
      // Split stack
      const half = Math.floor(item.count / 2);
      if (half > 0) {
        cursorItem = { id: item.id, count: half };
        item.count -= half;
      }
    }
  }
  updateHotbarUI();
  updateInventoryUI();
  updateCursorUI();
}

}

// recipes: array of { pattern: 2D array, result: id, count: n }
const RECIPES = [
  // 4 wood -> 4 planks
  { pattern: [[6,6],[6,6]], result: B.PLANKS, count: 4 },
  // 2 planks -> 4 sticks
  { pattern: [[8],[8]], result: 50, count: 4 }, // 50 = stick
  // 4 planks -> crafting table
  { pattern: [[8,8],[8,8]], result: B.CRAFTING_TABLE, count: 1 },
  // 4 planks + 1 stick vertical middle -> stick (3x3, but we only have 2x2 - skip)
  // 4 cobblestone -> 4 cobblestone stairs (decor)
  { pattern: [[9,9],[9,9]], result: B.COBBLESTONE_STAIRS, count: 4 },
];

// Add stick as a fake block for crafting
BLOCK_NAMES[50] = 'Stick';
B.STICK = 50;
const stickIcon = (() => {
  const c = makeCanvas(16, 16);
  const cc = ctx(c);
  cc.fillStyle = '#a07040';
  cc.fillRect(7, 2, 2, 12);
  cc.fillStyle = '#7a5530';
  cc.fillRect(7, 2, 1, 12);
  return c;
})();
blockIcons[50] = stickIcon;

const craftingGrid = [null, null, null, null]; // 2x2

function getCraftResult() {
  if (craftingGrid.every(x => !x)) return null;
  for (const r of RECIPES) {
    if (r.pattern.length === 2 && r.pattern[0].length === 2) {
      // 2x2
      const m = [
        [craftingGrid[0] ? craftingGrid[0].id : 0, craftingGrid[1] ? craftingGrid[1].id : 0],
        [craftingGrid[2] ? craftingGrid[2].id : 0, craftingGrid[3] ? craftingGrid[3].id : 0]
      ];
      const p = r.pattern;
      // Try all 1x1 / 2x2 orientations... too complex. Just exact match.
      let match = true;
      let used = [[0,0],[0,0]];
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        if (p[i][j] && p[i][j] !== m[i][j]) { match = false; }
      }
      if (match) return r;
    } else if (r.pattern.length === 2 && r.pattern[0].length === 1) {
      // 2x1 vertical
      const m = [
        [craftingGrid[0] ? craftingGrid[0].id : 0],
        [craftingGrid[1] ? craftingGrid[1].id : 0]
      ];
      const p = r.pattern;
      let match = true;
      for (let i = 0; i < 2; i++) {
        if (p[i][0] && p[i][0] !== m[i][0]) { match = false; }
      }
      if (match) return r;
    }
  }
  return null;
}

function updateCraftingUI() {
  const c = document.getElementById('crafting-2x2');

  for (let i = 0; i < 4; i++) {

function onCraftSlotClick(e, idx) {
  if (e.button === 0) {

        craftingGrid[idx] = { id: cursorItem.id, count: 1 };

        if (cursorItem.count <= 0) cursorItem = null;
      } else if (craftingGrid[idx].id === cursorItem.id) {
        craftingGrid[idx].count += 1;
        cursorItem.count -= 1;
        if (cursorItem.count <= 0) cursorItem = null;
      }
    } else if (craftingGrid[idx]) {
      cursorItem = craftingGrid[idx];
      craftingGrid[idx] = null;
    }
  } else if (e.button === 2) {
    if (cursorItem) {
      if (!craftingGrid[idx]) {
        craftingGrid[idx] = { id: cursorItem.id, count: 1 };
        cursorItem.count -= 1;
        if (cursorItem.count <= 0) cursorItem = null;
      }
    } else if (craftingGrid[idx]) {
      const half = Math.floor(craftingGrid[idx].count / 2);
      if (half > 0) {
        cursorItem = { id: craftingGrid[idx].id, count: half };
        craftingGrid[idx].count -= half;
      }
    }

// =====================================================================
function loadChunksAroundPlayer() {
  const cx = Math.floor(player.x / CHUNK_SIZE);
  const cz = Math.floor(player.z / CHUNK_SIZE);
  const rd = SETTINGS.renderDistance;
  // Mark visible chunks
  const visible = new Set();
  for (let x = -rd; x <= rd; x++) {
    for (let z = -rd; z <= rd; z++) {
      if (x*x + z*z > rd*rd + 2) continue;
      visible.add(chunkKey(cx + x, cz + z));
      if (!chunks.has(chunkKey(cx + x, cz + z))) {
        getOrGenerateChunk(cx + x, cz + z);
      }
    }
  }
  // Unload far chunks
  for (const [key, chunk] of chunks) {
    if (!visible.has(key)) {
      const ccx = chunk.cx, ccz = chunk.cz;
      if ((ccx - cx) * (ccx - cx) + (ccz - cz) * (ccz - cz) > (rd + 2) * (rd + 2)) {
        if (chunk.mesh) { scene.remove(chunk.mesh); chunk.mesh.geometry.dispose(); }
        if (chunk.transparentMesh) { scene.remove(chunk.transparentMesh); chunk.transparentMesh.geometry.dispose(); }
        chunks.delete(key);
      }
    }
  }
}

let rebuildQueue = [];
function processChunkRebuilds(maxPerFrame) {
  let count = 0;
  while (rebuildQueue.length > 0 && count < maxPerFrame) {
    const key = rebuildQueue.shift();
    const chunk = chunks.get(key);
    if (chunk && chunk.dirty) {
      buildChunkMesh(chunk);
      count++;
    }
  }
}

function scheduleChunkRebuilds() {
  rebuildQueue = [];
  for (const [key, chunk] of chunks) {
    if (chunk.dirty) rebuildQueue.push(key);
  }
}

// =====================================================================
// DAY/NIGHT
// =====================================================================
let gameTime = 600; // start at 8:00 AM (0-1200, where 0 is 6AM? or 12AM)
// Let: 0 = midnight, 600 = noon, 1200 = midnight again. 24h day in 1200s = 20min
const DAY_LENGTH = 1200;
let timeOfDay = 0.3; // 0-1

function updateDayNight(dt) {
  gameTime += dt;
  if (gameTime > DAY_LENGTH) gameTime -= DAY_LENGTH;
  timeOfDay = gameTime / DAY_LENGTH;
  // Sun position (rises in east, sets in west)
  const sunAngle = (timeOfDay - 0.25) * Math.PI * 2;
  const sunX = Math.cos(sunAngle) * 200;
  const sunY = Math.sin(sunAngle) * 200;
  sunSprite.position.set(player.x + sunX, sunY, player.z - 50);
  // Moon opposite
  const moonAngle = sunAngle + Math.PI;
  const moonX = Math.cos(moonAngle) * 200;
  const moonY = Math.sin(moonAngle) * 200;
  moonSprite.position.set(player.x + moonX, moonY, player.z - 50);

  // Sky colors based on time
  let topColor, bottomColor, sunColor, ambIntensity, sunIntensity, fogColor, starOpacity;
  if (timeOfDay < 0.2 || timeOfDay > 0.8) {
    // Night
    topColor = new THREE.Color(0x0a1a3a);
    bottomColor = new THREE.Color(0x223355);
    sunColor = 0x6688aa;
    ambIntensity = 0.15;
    sunIntensity = 0.05;
    fogColor = 0x223355;
    starOpacity = 0.9;
  } else if (timeOfDay < 0.3) {
    // Dawn
    const t = (timeOfDay - 0.2) / 0.1;
    topColor = new THREE.Color(0x0a1a3a).lerp(new THREE.Color(0x4488cc), t);
    bottomColor = new THREE.Color(0x223355).lerp(new THREE.Color(0xff9966), t);
    sunColor = 0xffeecc;
    ambIntensity = 0.15 + t * 0.3;
    sunIntensity = 0.05 + t * 0.6;
    fogColor = new THREE.Color(0x223355).lerp(new THREE.Color(0xffaa88), t);
    starOpacity = 0.9 - t * 0.9;
  } else if (timeOfDay < 0.7) {
    // Day
    topColor = new THREE.Color(0x4488cc);
    bottomColor = new THREE.Color(0xc8e8f4);
    sunColor = 0xffffea;
    ambIntensity = 0.45;
    sunIntensity = 1.0;
    fogColor = 0x87ceeb;
    starOpacity = 0;
  } else {
    // Dusk
    const t = (timeOfDay - 0.7) / 0.1;
    topColor = new THREE.Color(0x4488cc).lerp(new THREE.Color(0x0a1a3a), t);
    bottomColor = new THREE.Color(0xc8e8f4).lerp(new THREE.Color(0x223355), t);
    sunColor = 0xffcc88;
    ambIntensity = 0.45 - t * 0.3;
    sunIntensity = 1.0 - t * 0.95;
    fogColor = new THREE.Color(0x87ceeb).lerp(new THREE.Color(0x223355), t);
    starOpacity = t * 0.9;
  }

  // Update sky shader
  if (skyMesh) {
    skyMesh.material.uniforms.topColor.value = topColor;
    skyMesh.material.uniforms.bottomColor.value = bottomColor;
  }
  if (scene.userData.starsMat) {
    scene.userData.starsMat.opacity = starOpacity;
  }
  scene.fog.color = fogColor;
  renderer.setClearColor(fogColor);
  sunLight.intensity = sunIntensity;
  sunLight.color = new THREE.Color(sunColor);
  sunLight.position.set(sunX, sunY, -50);
  ambientLight.intensity = ambIntensity;
  hemiLight.intensity = ambIntensity * 0.8;
}

// =====================================================================
// GAME LOOP
// =====================================================================
let gameState = 'menu'; // menu, loading, playing, paused, dead
let lastTime = 0;
let timeAccum = 0;
let fps = 60;

function animate(time) {
  requestAnimationFrame(animate);
  const t = time / 1000;
  if (lastTime === 0) lastTime = t;
  const rawDt = Math.min(t - lastTime, 0.1);
  lastTime = t;
  const dt = rawDt;
  fps = fps * 0.9 + (1 / Math.max(rawDt, 0.001)) * 0.1;

  if (gameState === 'playing') {
    updatePlayer(dt);
    updateDrops(dt);
    updateParticles(dt);
    // Raycast for mining/placing
    const target = raycastBlock(6);
    if (target) {
      blockHighlight.visible = true;
      blockHighlight.position.set(target.x, target.y, target.z);
      updateBlockInfo(target);
      if (input.mouseDown) {
        startMining(target);
        tickMining(dt);
      } else if (mining.target) {
        mining.target = null;
        mining.progress = 0;
        mining.crackStage = 0;
      }
      if (input.rightMouseDown) {
        placeBlockAt(target);
        input.rightMouseDown = false;
      }
    } else {
      blockHighlight.visible = false;
      updateBlockInfo(null);
      if (mining.target) {
        mining.target = null;
        mining.progress = 0;
        mining.crackStage = 0;
      }
    }

    // Update crack overlay
    const overlay = document.getElementById('break-overlay');
    if (mining.target && mining.crackStage > 0) {
      overlay.classList.add('show');
      overlay.innerHTML = `<canvas class="crack" width="80" height="80"></canvas>`;
      const c = overlay.querySelector('canvas');
      const cc = ctx(c);
      const slot = TEX_SLOT.CRACK_1 + (mining.crackStage - 1);
      const col = slot % ATLAS_COLS;
      const row = Math.floor(slot / ATLAS_COLS);
      cc.imageSmoothingEnabled = false;
      const texCanvas = makeCanvas(TEXTURE_RES, TEXTURE_RES);
      const atlas = atlasTexture.image;
      const tctx = ctx(texCanvas);
      tctx.drawImage(atlas, col * TEXTURE_RES, row * TEXTURE_RES, TEXTURE_RES, TEXTURE_RES, 0, 0, TEXTURE_RES, TEXTURE_RES);
      cc.imageSmoothingEnabled = false;
      cc.drawImage(texCanvas, 0, 0, 80, 80);
      // Center on screen
      const cs = overlay.querySelector('.crack');
      cs.style.left = '50%';
      cs.style.top = '50%';
    } else {
      overlay.classList.remove('show');
    }

    // Day/night
    updateDayNight(dt);

    // Load chunks
    timeAccum += dt;
    if (timeAccum > 0.3) {
      timeAccum = 0;
      loadChunksAroundPlayer();
      scheduleChunkRebuilds();
    }
    processChunkRebuilds(2);

    // Update drop meshes periodically
    if (Math.floor(t * 2) !== lastDropRebuild) {
      lastDropRebuild = Math.floor(t * 2);
      rebuildDropMeshes();
    }
    updateDropMeshPositions();
    if (particles.length > 0) {
      rebuildParticleMesh();
      updateParticleMesh();
    }

    // Move clouds
    if (cloudGroup) {
      for (const c of cloudGroup.children) {
        c.position.x += c.userData.speed * dt;
        if (c.position.x > player.x + 200) c.position.x = player.x - 200;
        c.position.z = c.position.z; // keep z
        c.position.y = 60 + Math.sin(t * 0.1 + c.position.x * 0.01) * 3;
      }
    }

    // Camera FOV punch when sprinting
    const targetFov = SETTINGS.fov + (player.sprinting ? 5 : 0);
    camera.fov += (targetFov - camera.fov) * 0.1;
    camera.updateProjectionMatrix();

    updateDebug();
  }

  renderer.render(scene, camera);
}

// =====================================================================
// SAVE / LOAD
// =====================================================================
function saveGame() {
  const data = {
    player: { x: player.x, y: player.y, z: player.z, yaw: player.yaw, pitch: player.pitch, spawn: player.spawnPoint },
    inventory: inventory.slots,
    time: gameTime,
    chunks: {}
  };
  for (const [key, chunk] of chunks) {
    data.chunks[key] = Array.from(chunk.data);
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showMessage('Game saved!');
  } catch (e) {
    showMessage('Save failed (storage full?)');
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.player) return false;
    player.x = data.player.x;
    player.y = data.player.y;
    player.z = data.player.z;
    player.yaw = data.player.yaw || 0;
    player.pitch = data.player.pitch || 0;
    player.spawnPoint = data.player.spawn || { x: 0.5, y: 50, z: 0.5 };
    inventory.slots = data.inventory || [];
    while (inventory.slots.length < 36) inventory.slots.push(null);
    gameTime = data.time || 600;
    for (const key in data.chunks) {
      const [cx, cz] = key.split(',').map(Number);
      const arr = new Uint8Array(data.chunks[key]);
      const chunk = { cx, cz, data: arr, mesh: null, transparentMesh: null, dirty: true, loaded: true };
      chunks.set(key, chunk);
    }
    return true;
  } catch (e) {
    return false;
  }
}

// GAME STATE / MENU
// =====================================================================
function showScreen(id) {
  ['title-screen','loading-screen','hud','inventory-screen','pause-menu','settings-screen','death-screen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function startGame(loadExisting) {
  initAudio();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('loading-screen').classList.remove('hidden');

  const fill = document.getElementById('loading-fill');
  const status = document.getElementById('loading-status');

  setTimeout(() => {
    fill.style.width = '10%';
    status.textContent = 'Loading textures...';
    setTimeout(() => {
      fill.style.width = '40%';
      status.textContent = 'Generating terrain...';
      if (!loadExisting || !loadGame()) {
        // Generate initial chunks
        const cx = 0, cz = 0;
        // Find spawn height
        const h = getSurfaceHeight(0, 0);
        player.x = 0.5;
        player.y = h + 2;
        player.z = 0.5;
        player.spawnPoint = { x: 0.5, y: h + 2, z: 0.5 };
        // Pre-generate spawn area
        for (let x = -2; x <= 2; x++) {
          for (let z = -2; z <= 2; z++) {
            getOrGenerateChunk(x, z);
          }
        }
      } else {
        // Find safe spawn
        if (player.y < 0) player.y = 50;
      }
      giveStartingItems();
      setTimeout(() => {
        fill.style.width = '80%';
        status.textContent = 'Building meshes...';
        setTimeout(() => {
          // Build initial chunks
          for (const [key, chunk] of chunks) buildChunkMesh(chunk);
          fill.style.width = '100%';
          status.textContent = 'Ready!';
          setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'playing';
            updateHotbarUI();
            updateStatusUI();
            canvas.requestPointerLock();
          }, 200);
        }, 100);
      }, 100);
    }, 50);
  }, 50);
}

function toggleInventory() {
  if (gameState === 'dead' || gameState === 'menu' || gameState === 'loading') return;
  const invOpen = !document.getElementById('inventory-screen').classList.contains('hidden');
  if (invOpen) {
    closeAllMenus();
    return;
  }
  // If pause menu is open, close it first
  if (!document.getElementById('pause-menu').classList.contains('hidden') ||
      !document.getElementById('settings-screen').classList.contains('hidden')) {
    document.getElementById('pause-menu').classList.add('hidden');
    document.getElementById('settings-screen').classList.add('hidden');
  }
  if (gameState === 'playing') {
    gameState = 'paused';
    document.getElementById('inventory-screen').classList.remove('hidden');
    document.body.classList.remove('no-pointer');
    document.body.classList.add('menu-open');
    document.exitPointerLock();
    updateInventoryUI();
    updateCraftingUI();
  }
}

function togglePause() {
  if (gameState === 'dead') return;
  // If a menu is open, close it (Escape always backs out of any menu)
  if (gameState === 'paused') {
    if (!document.getElementById('settings-screen').classList.contains('hidden')) {
      closeSettings();
      return;
    }
    closeAllMenus();
    return;
  }
  // Open pause menu
  gameState = 'paused';
  document.getElementById('pause-menu').classList.remove('hidden');
  document.body.classList.remove('no-pointer');
  document.body.classList.add('menu-open');
  document.exitPointerLock();
}

function closeAllMenus() {
  gameState = 'playing';
  document.getElementById('pause-menu').classList.add('hidden');
  document.getElementById('inventory-screen').classList.add('hidden');
  document.getElementById('settings-screen').classList.add('hidden');
  document.body.classList.add('no-pointer');
  document.body.classList.remove('menu-open');
  canvas.requestPointerLock();
}

function openSettings() {
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('pause-menu').classList.add('hidden');
  document.getElementById('settings-screen').classList.remove('hidden');
  // Sync UI
  document.getElementById('opt-render').value = SETTINGS.renderDistance;
  document.getElementById('val-render').textContent = SETTINGS.renderDistance;
  document.getElementById('opt-sens').value = SETTINGS.sensitivity;
  document.getElementById('val-sens').textContent = SETTINGS.sensitivity.toFixed(2);
  document.getElementById('opt-fov').value = SETTINGS.fov;
  document.getElementById('val-fov').textContent = SETTINGS.fov;
  document.getElementById('opt-vol').value = SETTINGS.volume;
  document.getElementById('val-vol').textContent = Math.round(SETTINGS.volume * 100) + '%';
  document.getElementById('opt-fullscreen').checked = SETTINGS.fullscreen;
  document.getElementById('opt-bobbing').checked = SETTINGS.bobbing;
}

function closeSettings() {
  saveSettings();
  if (gameState === 'menu' || gameState === 'dead') {
    document.getElementById('settings-screen').classList.add('hidden');
    document.getElementById('title-screen').classList.remove('hidden');
  } else {
    document.getElementById('settings-screen').classList.add('hidden');
    document.getElementById('pause-menu').classList.remove('hidden');
  }
}

// =====================================================================
// BUTTONS / EVENTS
// =====================================================================
document.getElementById('play-btn').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  startGame(false);
});
document.getElementById('continue-btn').addEventListener('click', () => {
  startGame(true);
});
document.getElementById('settings-btn-title').addEventListener('click', openSettings);
document.getElementById('settings-btn-pause').addEventListener('click', openSettings);
document.getElementById('resume-btn').addEventListener('click', () => {
  gameState = 'playing';
  document.getElementById('pause-menu').classList.add('hidden');
  document.body.classList.add('no-pointer');
  document.body.classList.remove('menu-open');
  canvas.requestPointerLock();
});
document.getElementById('save-btn').addEventListener('click', saveGame);
document.getElementById('quit-btn').addEventListener('click', () => {
  saveGame();
  location.reload();
});
document.getElementById('respawn-btn').addEventListener('click', respawn);
document.getElementById('quit-after-death-btn').addEventListener('click', () => location.reload());

// Settings controls
function bindSetting(id, key, format) {
  const el = document.getElementById(id);
  const valEl = document.getElementById('val-' + id.split('-')[1]);
  el.value = SETTINGS[key];
  if (valEl) valEl.textContent = format ? format(SETTINGS[key]) : SETTINGS[key];
  el.addEventListener('input', () => {
    SETTINGS[key] = parseFloat(el.value);
    if (valEl) valEl.textContent = format ? format(SETTINGS[key]) : SETTINGS[key];
  });
  el.addEventListener('change', () => saveSettings());
}
bindSetting('opt-render', 'renderDistance', v => v);
bindSetting('opt-sens', 'sensitivity', v => v.toFixed(2));
bindSetting('opt-fov', 'fov', v => v);
bindSetting('opt-vol', 'volume', v => Math.round(v * 100) + '%');
document.getElementById('opt-fullscreen').addEventListener('change', (e) => {
  SETTINGS.fullscreen = e.target.checked;
  if (SETTINGS.fullscreen && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  } else if (!SETTINGS.fullscreen && document.exitFullscreen) {
    document.exitFullscreen();
  }
  saveSettings();
});
document.getElementById('opt-bobbing').addEventListener('change', (e) => {
  SETTINGS.bobbing = e.target.checked;
  saveSettings();
});
document.getElementById('settings-back').addEventListener('click', closeSettings);

// Cursor item click
document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && cursorItem) {
    // Drop on ground if click outside slots
    const tgt = e.target;
    if (!tgt.closest('.inv-slot, #crafting-2x2, #craft-result, #inventory-panel')) {
      // Drop into world
      if (gameState === 'paused' && !document.getElementById('inventory-screen').classList.contains('hidden')) {
        // In inventory, drop
        spawnDrop(player.x, player.y + 1, player.z, cursorItem.id);
        cursorItem = null;
        updateCursorUI();
      }
    }
  }
});

// =====================================================================
// INIT
// =====================================================================
function init() {
  loadSettings();
  buildTextures();
  buildMaterials();
  buildSky();
  buildCelestials();
  buildClouds();
  buildBlockHighlight();
  buildDropMesh();
  buildParticleTexture();

  // Show Continue button if save exists
  if (localStorage.getItem(STORAGE_KEY)) {
    document.getElementById('continue-btn').style.display = '';
  }

  // Initial UI
  document.getElementById('opt-render').value = SETTINGS.renderDistance;
  document.getElementById('val-render').textContent = SETTINGS.renderDistance;
  document.getElementById('opt-sens').value = SETTINGS.sensitivity;
  document.getElementById('val-sens').textContent = SETTINGS.sensitivity.toFixed(2);
  document.getElementById('opt-fov').value = SETTINGS.fov;
  document.getElementById('val-fov').textContent = SETTINGS.fov;
  document.getElementById('opt-vol').value = SETTINGS.volume;
  document.getElementById('val-vol').textContent = Math.round(SETTINGS.volume * 100) + '%';

  requestAnimationFrame(animate);
}

init();
</script>
