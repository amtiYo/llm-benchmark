<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voxelcraft</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87b6e8; font-family:'Segoe UI',Tahoma,sans-serif; -webkit-user-select:none; user-select:none; }
  #game { display:block; width:100%; height:100%; }

  /* Crosshair */
  #crosshair { position:fixed; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); pointer-events:none; z-index:20; mix-blend-mode:difference; }
  #crosshair:before, #crosshair:after { content:''; position:absolute; background:#fff; }
  #crosshair:before { left:10px; top:2px; width:2px; height:18px; }
  #crosshair:after  { top:10px; left:2px; height:2px; width:18px; }

  /* Hotbar */
  #hotbar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:4px; padding:4px; background:rgba(0,0,0,0.35); border:2px solid rgba(0,0,0,0.5); border-radius:4px; z-index:20; }
  .slot { position:relative; width:52px; height:52px; background:rgba(120,120,120,0.45); border:2px solid rgba(30,30,30,0.55); display:flex; align-items:center; justify-content:center; image-rendering:pixelated; transition:transform .06s; }
  .slot.active { border-color:#fff; box-shadow:0 0 0 2px #fff, 0 0 8px rgba(255,255,255,0.5); transform:scale(1.06); z-index:2; }
  .slot canvas { width:40px; height:40px; image-rendering:pixelated; filter:drop-shadow(2px 3px 1px rgba(0,0,0,0.35)); }
  .slot .count { position:absolute; right:3px; bottom:1px; font-size:15px; font-weight:bold; color:#fff; text-shadow:2px 2px 0 #3a3a3a; }
  .slot .key { position:absolute; left:3px; top:1px; font-size:10px; color:#e8e8e8; text-shadow:1px 1px 0 #000; opacity:.7; }

  #selname { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); color:#fff; font-size:15px; text-shadow:2px 2px 0 rgba(0,0,0,0.6); z-index:20; pointer-events:none; opacity:0; transition:opacity .4s; }
  #selname.show { opacity:1; }

  /* Debug */
  #debug { position:fixed; left:8px; top:8px; color:#fff; font:12px/1.5 'Courier New',monospace; text-shadow:1px 1px 0 #000; z-index:20; display:none; white-space:pre; pointer-events:none; }

  /* Overlay */
  #overlay { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
             background:radial-gradient(circle at 50% 40%, rgba(30,50,80,0.75), rgba(10,15,25,0.94)); color:#fff; cursor:pointer; }
  #overlay h1 { font-size:58px; letter-spacing:2px; margin-bottom:6px; text-shadow:4px 4px 0 rgba(0,0,0,0.5); color:#eafff0; }
  #overlay h1 span { color:#7ec850; }
  #overlay .sub { font-size:16px; opacity:.85; margin-bottom:34px; }
  #overlay .play { font-size:22px; font-weight:bold; padding:14px 40px; background:#5a9e3a; border:3px solid #3c6f24; border-bottom-width:6px; border-radius:6px; text-shadow:2px 2px 0 rgba(0,0,0,0.4); }
  #overlay .play:active { border-bottom-width:3px; transform:translateY(3px); }
  #overlay .controls { margin-top:36px; display:grid; grid-template-columns:auto auto; gap:6px 22px; font-size:14px; opacity:.9; text-align:left; }
  #overlay .controls b { color:#ffd76a; font-family:'Courier New',monospace; }
  #overlay.hidden { display:none; }
  #loading { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:#87b6e8; color:#2a3a4a; font-size:20px; }

  #hurt { position:fixed; inset:0; z-index:15; pointer-events:none; box-shadow:inset 0 0 120px rgba(120,0,0,0); transition:box-shadow .1s; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="hurt"></div>
  <div id="selname"></div>
  <div id="hotbar"></div>
  <div id="debug"></div>

  <div id="loading">Generating world…</div>

  <div id="overlay" class="hidden">
    <h1>VOXEL<span>CRAFT</span></h1>
    <div class="sub">A tiny sandbox — mine, gather, build.</div>
    <div class="play">▶ Click to Play</div>
    <div class="controls">
      <span>Move</span><b>W A S D</b>
      <span>Jump</span><b>Space</b>
      <span>Sprint</span><b>Shift</b>
      <span>Break block</span><b>Left Mouse (hold)</b>
      <span>Place block</span><b>Right Mouse</b>
      <span>Select slot</span><b>1–9 / Scroll</b>
      <span>Debug info</span><b>F3</b>
      <span>Release mouse</span><b>Esc</b>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
