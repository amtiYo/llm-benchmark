// ------------------------------------------------------------ hotbar
function makeSlotDOM(cls){
  const d=document.createElement('div');
  d.className='slot'+(cls?' '+cls:'');
  const i=document.createElement('div'); i.className='ico'; d.appendChild(i);
  const c=document.createElement('div'); c.className='cnt'; d.appendChild(c);
  const b=document.createElement('div'); b.className='dur'; b.innerHTML='<i></i>'; b.style.display='none'; d.appendChild(b);
  return d;
}
function paintSlot(el, st){
  const ico=el.querySelector('.ico'), cnt=el.querySelector('.cnt'), dur=el.querySelector('.dur');
  if(!st){ ico.style.backgroundImage='none'; cnt.textContent=''; dur.style.display='none'; return; }
  ico.style.backgroundImage='url('+itemIcon(st.id)+')';
  cnt.textContent = st.count>1 ? st.count : '';
  const it=ITEMS[st.id];
  if(it && it.dur && st.dmg>0){
    dur.style.display='block';
    const f=1-st.dmg/it.dur;
    dur.firstChild.style.width=(f*100)+'%';
    dur.firstChild.style.background = f>0.5?'#5fe04a':(f>0.25?'#e0c93a':'#e04a3a');
  } else dur.style.display='none';
}
let hotbarEls=[];
function buildHotbar(){
  const hb=document.getElementById('hotbar');
  hotbarEls=[];
  for(let i=0;i<9;i++){
    const d=makeSlotDOM();
    d.addEventListener('mousedown', e=>{ hotbarSel=i; updateHotbar(); e.preventDefault(); });
    hb.appendChild(d); hotbarEls.push(d);
  }
}
function updateHotbar(){
  for(let i=0;i<9;i++) paintSlot(hotbarEls[i], inv.slots[i]);
  document.getElementById('hotsel').style.transform='translateX('+(hotbarSel*46)+'px)';
  const s=inv.slots[hotbarSel];
  if(s && (!updateHotbar.last || updateHotbar.last!==s.id)){ showItemName(ITEMS[s.id].name); }
  updateHotbar.last = s?s.id:null;
  if(uiOpen()) refreshUI();
}
function updateBars(){
  const hearts=document.getElementById('hearts'), food=document.getElementById('food'), breath=document.getElementById('breath');
  const need=xpNeeded(player.level);
  const xb=document.getElementById('xpbar'), xl=document.getElementById('xplvl');
  if(xb){ xb.firstChild.style.width=Math.min(100, player.xp/need*100)+'%'; }
  if(xl){ xl.textContent = player.level>0 ? player.level : ''; }
  if(player.mode===GM.CREATIVE){
    hearts.innerHTML=''; food.innerHTML=''; breath.innerHTML='';
    if(xb) xb.parentElement.style.visibility='hidden';
    return;
  }
  if(xb) xb.parentElement.style.visibility='visible';
  let h='';
  for(let i=0;i<10;i++){
    const v=player.health-i*2;
    const f=v>=2?1:(v>=1?0.5:0);
    h+=heartSVG(f, i);
  }
  hearts.innerHTML=h;
  let fo='';
  for(let i=0;i<10;i++){
    const v=player.food-i*2;
    fo+=foodSVG(v>=2?1:(v>=1?0.5:0));
  }
  food.innerHTML=fo;
  let br='';
  if(player.breath<player.maxBreath){
    const n=Math.ceil(player.breath/player.maxBreath*10);
    for(let i=0;i<10;i++) br+= i<n ? bubbleSVG() : '<div class="icon"></div>';
  }
  breath.innerHTML=br;
}
function heartSVG(f){
  const path='M9 16.5 C3 12 1 9.5 1 6.8 C1 4.4 2.9 2.6 5.2 2.6 C6.7 2.6 8.1 3.4 9 4.7 C9.9 3.4 11.3 2.6 12.8 2.6 C15.1 2.6 17 4.4 17 6.8 C17 9.5 15 12 9 16.5 Z';
  const bg='<path d="'+path+'" fill="#2b0b0b" stroke="#000" stroke-width="1.4"/>';
  if(f===0) return '<div class="icon"><svg viewBox="0 0 18 18" width="18" height="18">'+bg+'</svg></div>';
  const clip = f===0.5 ? '<clipPath id="hc"><rect x="0" y="0" width="9" height="18"/></clipPath>' : '';
  const fill='<path d="'+path+'" fill="#e8323a" stroke="#000" stroke-width="1.4"'+(f===0.5?' clip-path="url(#hc)"':'')+'/>';
  return '<div class="icon"><svg viewBox="0 0 18 18" width="18" height="18">'+clip+bg+fill+'</svg></div>';
}
function foodSVG(f){
  const path='M4 14 C2 11 2 6 5 4 C6.5 3 8 4 9 5 C10 4 11.5 3 13 4 C16 6 16 11 14 14 C12 16.5 6 16.5 4 14 Z';
  const bg='<path d="'+path+'" fill="#241505" stroke="#000" stroke-width="1.3"/>';
  if(f===0) return '<div class="icon"><svg viewBox="0 0 18 18" width="18" height="18">'+bg+'</svg></div>';
  const clip = f===0.5 ? '<clipPath id="fc"><rect x="9" y="0" width="9" height="18"/></clipPath>' : '';
  const fill='<path d="'+path+'" fill="#c98b34" stroke="#000" stroke-width="1.3"'+(f===0.5?' clip-path="url(#fc)"':'')+'/>';
  return '<div class="icon"><svg viewBox="0 0 18 18" width="18" height="18">'+clip+bg+fill+'</svg></div>';
}
function bubbleSVG(){
  return '<div class="icon"><svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="6.2" fill="#a8dcff" stroke="#000" stroke-width="1.3"/><circle cx="6.8" cy="6.8" r="1.7" fill="#fff"/></svg></div>';
}

// ------------------------------------------------------ inventory UI
function mkGrid(cols, label){
  const wrap=document.createElement('div');
  if(label){ const l=document.createElement('div'); l.className='gridlbl'; l.textContent=label; wrap.appendChild(l); }
  const g=document.createElement('div');
  g.className='grid'; g.style.gridTemplateColumns='repeat('+cols+',42px)';
  wrap.appendChild(g);
  return {wrap, g};
}
function addSlot(parent, get, set, kind){
  const el=makeSlotDOM('big');
  parent.appendChild(el);
  const ref={el, get, set, kind};
  uiSlots.push(ref);
  el.addEventListener('mousedown', e=>{ onSlotClick(ref, e); e.preventDefault(); });
  el.addEventListener('mouseenter', ()=>{ el.classList.add('hover'); showTip(ref); });
  el.addEventListener('mouseleave', ()=>{ el.classList.remove('hover'); hideTip(); });
  return ref;
}
function showTip(ref){
  const st=ref.get();
  const tip=document.getElementById('tooltip');
  if(!st){ tip.style.display='none'; return; }
  const it=ITEMS[st.id];
  let extra='';
  if(it.dur) extra='<div class="d">Durability '+(it.dur-(st.dmg||0))+' / '+it.dur+'</div>';
  else if(it.food) extra='<div class="d">Restores '+it.food+' hunger</div>';
  else if(it.block!==undefined){
    const b=BLOCKS[it.block];
    extra='<div class="d">'+(b.hardness<0?'Unbreakable':'Hardness '+b.hardness)+(b.tool?' · '+b.tool:'')+'</div>';
  }
  tip.innerHTML='<div class="t">'+it.name+'</div>'+extra;
  tip.style.display='block';
  const r=ref.el.getBoundingClientRect();
  tip.style.left=(r.right+8)+'px';
  tip.style.top=(r.top-4)+'px';
  const tr=tip.getBoundingClientRect();
  if(tr.right>window.innerWidth-8) tip.style.left=(r.left-tr.width-8)+'px';
}
function hideTip(){ document.getElementById('tooltip').style.display='none'; }

function buildInvPanel(kind){
  const panel=document.getElementById('invPanel');
  panel.innerHTML='';
  uiSlots=[];
  const title=document.createElement('h2');
  title.textContent = kind==='table'?'Crafting':kind==='furnace'?'Furnace':kind==='chest'?'Chest':
                      (player.mode===GM.CREATIVE?'Creative Inventory':'Inventory');
  title.style.textAlign='center';
  panel.appendChild(title);

  const top=document.createElement('div');
  top.className='invwrap'; top.style.marginBottom='14px';
  panel.appendChild(top);

  if(kind==='inv' && player.mode===GM.CREATIVE){
    const cg=document.createElement('div'); cg.id='creativeGrid';
    top.appendChild(cg);
    const list=[];
    for(let i=1;i<BLOCKS.length;i++){ if(BLOCKS[i] && ITEMS[i] && i!==B.FURNACE_LIT) list.push(i); }
    for(const k in I) list.push(I[k]);
    for(const id of list){
      if(!ITEMS[id]) continue;
      const el=makeSlotDOM('big');
      paintSlot(el, {id, count:1});
      el.addEventListener('mousedown', e=>{
        const max=ITEMS[id].stack;
        cursorStack={id, count: e.button===2?1:max, dmg:0};
        paintCursor(); e.preventDefault();
      });
      el.addEventListener('mouseenter', ()=>{ el.classList.add('hover');
        const tip=document.getElementById('tooltip');
        tip.innerHTML='<div class="t">'+ITEMS[id].name+'</div><div class="d">Click to grab</div>';
        tip.style.display='block';
        const r=el.getBoundingClientRect(); tip.style.left=(r.right+8)+'px'; tip.style.top=(r.top-4)+'px';
      });
      el.addEventListener('mouseleave', ()=>{ el.classList.remove('hover'); hideTip(); });
      cg.appendChild(el);
    }
  } else if(kind==='inv' || kind==='table'){
    craftSize = kind==='table'?3:2;
    const cw=mkGrid(craftSize, 'Craft');
    top.appendChild(cw.wrap);
    for(let y=0;y<craftSize;y++) for(let x=0;x<craftSize;x++){
      const i=y*3+x;
      addSlot(cw.g, ()=>craftGrid[i], v=>{craftGrid[i]=v; recomputeCraft();}, 'craft');
    }
    const arrow=document.createElement('div'); arrow.className='arrow'; arrow.textContent='➜';
    arrow.style.alignSelf='flex-end'; arrow.style.marginBottom='8px';
    top.appendChild(arrow);
    const ow=mkGrid(1,'Result');
    top.appendChild(ow.wrap);
    addSlot(ow.g, ()=>craftOut, ()=>{}, 'result');
  } else if(kind==='furnace'){
    const c=openContainer;
    const col=document.createElement('div');
    col.style.display='flex'; col.style.flexDirection='column'; col.style.alignItems='center'; col.style.gap='4px';
    top.appendChild(col);
    const g1=mkGrid(1,'Smelt'); col.appendChild(g1.wrap);
    addSlot(g1.g, ()=>c.slots[0], v=>{c.slots[0]=v;}, 'cont');
    const fl=document.createElement('div'); fl.className='progbar'; fl.id='burnBar'; fl.innerHTML='<i></i>';
    col.appendChild(fl);
    const g2=mkGrid(1,'Fuel'); col.appendChild(g2.wrap);
    addSlot(g2.g, ()=>c.slots[1], v=>{c.slots[1]=v;}, 'cont');
    const arrow=document.createElement('div'); arrow.className='arrow'; arrow.id='cookArrow'; arrow.textContent='➜';
    top.appendChild(arrow);
    const g3=mkGrid(1,'Output'); top.appendChild(g3.wrap);
    addSlot(g3.g, ()=>c.slots[2], v=>{c.slots[2]=v;}, 'output');
  } else if(kind==='chest'){
    const c=openContainer;
    const cw=mkGrid(9,'Chest');
    top.appendChild(cw.wrap);
    for(let i=0;i<27;i++) addSlot(cw.g, ()=>c.slots[i], v=>{c.slots[i]=v;}, 'cont');
  }

  const iw=mkGrid(9,'Inventory');
  panel.appendChild(iw.wrap);
  for(let i=9;i<36;i++) addSlot(iw.g, ()=>inv.slots[i], v=>{inv.slots[i]=v;}, 'inv');
  const hw=mkGrid(9,'Hotbar');
  hw.wrap.style.marginTop='10px';
  panel.appendChild(hw.wrap);
  for(let i=0;i<9;i++) addSlot(hw.g, ()=>inv.slots[i], v=>{inv.slots[i]=v;}, 'inv');

  const hint=document.createElement('div');
  hint.className='tiny'; hint.style.marginTop='12px'; hint.style.textAlign='center';
  hint.innerHTML='<kbd>Shift</kbd>+click to move stacks &nbsp;·&nbsp; <kbd>RMB</kbd> to split &nbsp;·&nbsp; <kbd>E</kbd> or <kbd>Esc</kbd> to close';
  panel.appendChild(hint);
  refreshUI();
}
function refreshUI(){
  for(const s of uiSlots) paintSlot(s.el, s.get());
  if(openContainer && openContainer.type==='furnace'){
    const bb=document.getElementById('burnBar');
    if(bb) bb.firstChild.style.height = (openContainer.burnMax? (openContainer.burn/openContainer.burnMax*100):0)+'%';
    const ca=document.getElementById('cookArrow');
    if(ca){
      const f=openContainer.cook/COOK_TIME;
      ca.style.color = f>0 ? '#ffcc4d' : '';
      ca.style.opacity = 0.4+f*0.6;
    }
  }
}
function paintCursor(){
  const el=document.getElementById('cursorItem');
  if(!cursorStack){ el.style.display='none'; return; }
  el.style.display='block';
  el.querySelector('.ico').style.backgroundImage='url('+itemIcon(cursorStack.id)+')';
  el.querySelector('.cnt').textContent=cursorStack.count>1?cursorStack.count:'';
}
function onSlotClick(ref, e){
  const right = e.button===2;
  const shift = e.shiftKey;
  let st=ref.get();
  if(ref.kind==='result'){
    if(!craftOut) return;
    const out={id:craftOut.id, count:craftOut.count, dmg:0};
    if(shift){
      let n=0;
      while(craftOut && n<64){ const left=invAdd(craftOut.id, craftOut.count,0); if(left>0) break; consumeCraft(); n++; }
      sfx.play('craft');
    } else if(!cursorStack){ cursorStack=out; consumeCraft(); sfx.play('craft'); }
    else if(stackable(cursorStack,out) && cursorStack.count+out.count<=ITEMS[out.id].stack){
      cursorStack.count+=out.count; consumeCraft(); sfx.play('craft');
    }
    paintCursor(); refreshUI(); updateHotbar();
    return;
  }
  if(ref.kind==='output' && cursorStack) return;
  if(shift && st){
    quickMove(ref);
    paintCursor(); refreshUI(); updateHotbar(); recomputeCraft();
    return;
  }
  if(!cursorStack){
    if(!st) return;
    if(right){
      const half=Math.ceil(st.count/2);
      cursorStack={id:st.id,count:half,dmg:st.dmg||0};
      st.count-=half;
      ref.set(st.count<=0?null:st);
    } else { cursorStack={id:st.id,count:st.count,dmg:st.dmg||0}; ref.set(null); }
  } else {
    if(ref.kind==='output') return;
    if(!st){
      if(right){ ref.set({id:cursorStack.id,count:1,dmg:cursorStack.dmg}); cursorStack.count--; if(cursorStack.count<=0) cursorStack=null; }
      else { ref.set(cursorStack); cursorStack=null; }
    } else if(stackable(st,cursorStack)){
      const max=ITEMS[st.id].stack;
      const n=right?Math.min(1,max-st.count):Math.min(cursorStack.count, max-st.count);
      st.count+=n; cursorStack.count-=n; ref.set(st);
      if(cursorStack.count<=0) cursorStack=null;
    } else {
      const t=cursorStack; cursorStack={id:st.id,count:st.count,dmg:st.dmg||0}; ref.set(t);
    }
  }
  sfx.play('click');
  paintCursor(); refreshUI(); updateHotbar(); recomputeCraft();
}
function quickMove(ref){
  const st=ref.get();
  if(!st) return;
  const toInv = (ref.kind!=='inv');
  if(toInv){
    const left=invAdd(st.id, st.count, st.dmg);
    if(left<=0) ref.set(null); else { st.count=left; ref.set(st); }
    if(ref.kind==='result'){ consumeCraft(); }
  } else {
    // inventory -> open container / craft grid
    const targets = uiSlots.filter(s=>s.kind==='cont'||s.kind==='craft');
    let left=st.count;
    for(const t of targets){
      const cs=t.get();
      if(cs && stackable(cs,st) && cs.count<ITEMS[st.id].stack){
        const n=Math.min(left, ITEMS[st.id].stack-cs.count);
        cs.count+=n; left-=n; t.set(cs);
        if(left<=0) break;
      }
    }
    if(left>0) for(const t of targets){
      if(!t.get()){ t.set({id:st.id,count:left,dmg:st.dmg||0}); left=0; break; }
    }
    if(left<=0) ref.set(null); else { st.count=left; ref.set(st); }
  }
}
function openInventory(kind, x,y,z){
  if(kind==='chest'||kind==='furnace'){
    const k=x+','+y+','+z;
    let c=containers.get(k);
    if(!c){
      c = kind==='chest' ? {type:'chest', slots:new Array(27).fill(null)}
                         : {type:'furnace', slots:new Array(3).fill(null), burn:0, burnMax:0, cook:0};
      containers.set(k,c);
    }
    c.pos=k; c.bx=x; c.by=y; c.bz=z;
    openContainer=c;
    sfx.play('open');
  } else openContainer=null;
  buildInvPanel(kind);
  showScreen('inv');
  document.exitPointerLock && document.exitPointerLock();
  paintCursor();
}
function closeInventory(){
  if(!document.getElementById('inv').classList.contains('on')) return;
  hideScreen('inv');
  hideTip();
  // return crafting grid + cursor to the inventory
  for(let i=0;i<9;i++){
    const s=craftGrid[i];
    if(s){ const left=invAdd(s.id,s.count,s.dmg); if(left>0) spawnItem(player.pos[0],player.pos[1]+1,player.pos[2],s.id,left); craftGrid[i]=null; }
  }
  if(cursorStack){
    const left=invAdd(cursorStack.id,cursorStack.count,cursorStack.dmg);
    if(left>0) spawnItem(player.pos[0],player.pos[1]+1,player.pos[2],cursorStack.id,left);
    cursorStack=null; paintCursor();
  }
  craftOut=null; openContainer=null;
  updateHotbar();
  if(!player.dead && !document.getElementById('pause').classList.contains('on')) requestLock();
}

// ------------------------------------------------------------- furnace
const COOK_TIME = 6.0;
function tickFurnaces(dt){
  for(const [k,c] of containers){
    if(c.type!=='furnace') continue;
    const inS=c.slots[0], fuS=c.slots[1], ouS=c.slots[2];
    const recipe = inS ? SMELT[inS.id] : null;
    const canOut = recipe && (!ouS || (ouS.id===recipe.out && ouS.count<ITEMS[recipe.out].stack));
    let lit = c.burn>0;
    if(c.burn>0){ c.burn-=dt; if(c.burn<0) c.burn=0; }
    if(c.burn<=0 && canOut && fuS && FUELS[fuS.id]){
      c.burnMax = FUELS[fuS.id]/6;
      c.burn = c.burnMax;
      fuS.count--;
      if(fuS.count<=0) c.slots[1]=null;
      lit=true;
    }
    if(c.burn>0 && canOut){
      c.cook += dt;
      if(c.cook>=COOK_TIME){
        c.cook=0;
        if(ouS) ouS.count++;
        else c.slots[2]={id:recipe.out, count:1, dmg:0};
        inS.count--;
        if(inS.count<=0) c.slots[0]=null;
        if(openContainer===c) sfx.play('fizz');
      }
    } else if(c.cook>0){ c.cook=Math.max(0, c.cook-dt*2); }
    // block state
    const parts=k.split(',');
    const bx=+parts[0], by=+parts[1], bz=+parts[2];
    const cur=getBlock(bx,by,bz);
    const want = (c.burn>0)?B.FURNACE_LIT:B.FURNACE;
    if((cur===B.FURNACE||cur===B.FURNACE_LIT) && cur!==want) setBlock(bx,by,bz,want);
    if(c.burn>0 && Math.random()<dt*3){
      spawnSmoke(bx+0.5,by+1.05,bz+0.5,1);
    }
  }
}
</script>

<script>
// =====================================================================
//  FRAME
// =====================================================================
let gameStarted=false, worldReady=false, generating=false;
const proj=M4(), view=M4(), vp=M4(), invVP=M4(), vmProj=M4();
let camPos=[0,0,0], camDirV=[0,0,1];
let fpsHist=new Float32Array(120), fpsIdx=0, fps=60, frameMs=0;
let visibleChunks=[];
let lastTime=0, tickAcc=0, gameTime=0, useRepeat=0.28;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2) * (settings.res/100);
  const w = Math.max(1, Math.round(canvas.clientWidth*dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
}

function computeCamera(dt){
  const eyeH = player.sneaking?EYE_SNEAK:EYE;
  let ex=player.pos[0], ey=player.pos[1]+eyeH, ez=player.pos[2];
  const d=camDir();
  camDirV=d;
  let upx=0, upy=1, upz=0;
  if(settings.bob && player.thirdPerson===0 && !player.flying){
    const b=player.bobAmt;
    const s1=Math.sin(player.bob*2), s2=Math.abs(Math.cos(player.bob));
    const rx=-Math.cos(player.yaw), rz=Math.sin(player.yaw);
    ex += rx*s1*0.05*b; ez += rz*s1*0.05*b;
    ey += -s2*0.05*b;
    const roll = s1*0.030*b;
    upx = rx*roll; upz = rz*roll; upy = 1;
  }
  if(player.invuln>0.28){ const k=(player.invuln-0.28)*0.14; ex+=(Math.random()-0.5)*k; ey+=(Math.random()-0.5)*k; }
  if(player.thirdPerson>0){
    const back = player.thirdPerson===1 ? 1 : -1;
    let dist=4.2;
    const r=raycast(ex,ey,ez, -d[0]*back, -d[1]*back, -d[2]*back, dist);
    if(r.hit) dist=Math.max(0.6, r.dist-0.35);
    ex -= d[0]*dist*back; ey -= d[1]*dist*back; ez -= d[2]*dist*back;
  }
  camPos=[ex,ey,ez];
  const asp = canvas.width/canvas.height;
  let fov = settings.fov;
  if(player.sprinting) fov += 8;
  if(player.flying) fov += 4;
  if(player.headInWater) fov -= 6;
  fovCur += (fov-fovCur)*Math.min(1, dt*9);
  const far = Math.max(180, settings.renderDist*16*1.6+80);
  m4persp(proj, fovCur*Math.PI/180, asp, 0.06, far);
  if(player.thirdPerson>0){
    const dd = player.thirdPerson===1?1:-1;
    m4lookDir(view, d[0]*dd,d[1]*dd,d[2]*dd, upx,upy,upz);
  } else {
    m4lookDir(view, d[0],d[1],d[2], upx,upy,upz);
  }
  m4mul(vp, proj, view);
  m4invert(invVP, vp);
  extractFrustum(vp);
  m4persp(vmProj, 70*Math.PI/180, asp, 0.02, 12);
}
let fovCur=75;

function render(dt){
  glStat.draws=0; glStat.tris=0; glStat.chunks=0;
  const gw=canvas.width, gh=canvas.height;
  gl.viewport(0,0,gw,gh);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const sun=sunDirection();
  const day=dayFactor();
  const rain=weather.intensity*(weather.state==='storm'?1:0.8);
  const uw = player.headInWater?1:0;
  const fogFar = settings.fog ? Math.max(48, settings.renderDist*16-6) : 100000;
  const fogNear = settings.fog ? fogFar*0.70 : 99000;
  const ambient = 0.028 + weather.lightning*0.35;

  // ---------- gather visible chunks ----------
  visibleChunks.length=0;
  for(const [,c] of chunks){
    if(!c.hasMesh) continue;
    const x0=c.ox-camPos[0], z0=c.oz-camPos[2];
    if(!aabbInFrustum(x0, -camPos[1], z0, x0+16, CH-camPos[1], z0+16)) continue;
    const dx=c.ox+8-camPos[0], dz=c.oz+8-camPos[2];
    c._d = dx*dx+dz*dz;
    visibleChunks.push(c);
  }
  visibleChunks.sort((a,b)=>a._d-b._d);
  glStat.chunks=visibleChunks.length;

  // ---------- terrain: opaque ----------
  gl.useProgram(progTerrain);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
  gl.uniform1i(progTerrain.u.uTex, 0);
  gl.uniformMatrix4fv(progTerrain.u.uVP, false, vp);
  gl.uniform3fv(progTerrain.u.uTintPal, TINT_PALETTE);
  gl.uniform3f(progTerrain.u.uSunDir, sun[0],sun[1],sun[2]);
  gl.uniform1f(progTerrain.u.uDay, day);
  gl.uniform1f(progTerrain.u.uRain, rain);
  gl.uniform1f(progTerrain.u.uTime, gameTime);
  gl.uniform1f(progTerrain.u.uFogNear, fogNear);
  gl.uniform1f(progTerrain.u.uFogFar, fogFar);
  gl.uniform1f(progTerrain.u.uAmbient, ambient);
  gl.uniform3f(progTerrain.u.uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform1i(progTerrain.u.uUnderwater, uw);
  gl.uniform3f(progTerrain.u.uFogTint, 0.62,0.72,0.86);
  gl.uniform1i(progTerrain.u.uPass, 0);
  for(const c of visibleChunks){
    if(!c.op.count) continue;
    gl.uniform3f(progTerrain.u.uOrigin, c.ox-camPos[0], -camPos[1], c.oz-camPos[2]);
    gl.bindVertexArray(c.op.vao);
    gl.drawElements(gl.TRIANGLES, c.op.count, gl.UNSIGNED_INT, 0);
    glStat.draws++; glStat.tris+=c.op.count/3;
  }

  // ---------- entities ----------
  drawEntities(day, sun, rain, fogNear, fogFar, ambient, uw);

  // ---------- terrain: cutout ----------
  gl.useProgram(progTerrain);
  gl.uniform1i(progTerrain.u.uPass, 1);
  gl.disable(gl.CULL_FACE);
  for(const c of visibleChunks){
    if(!c.cu.count) continue;
    gl.uniform3f(progTerrain.u.uOrigin, c.ox-camPos[0], -camPos[1], c.oz-camPos[2]);
    gl.bindVertexArray(c.cu.vao);
    gl.drawElements(gl.TRIANGLES, c.cu.count, gl.UNSIGNED_INT, 0);
    glStat.draws++; glStat.tris+=c.cu.count/3;
  }
  gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(null);

  // ---------- sky ----------
  gl.useProgram(progSky);
  gl.depthMask(false);
  gl.uniformMatrix4fv(progSky.u.uInvVP, false, invVP);
  gl.uniform3f(progSky.u.uSunDir, sun[0],sun[1],sun[2]);
  gl.uniform3f(progSky.u.uMoonDir, -sun[0],-sun[1],-sun[2]);
  gl.uniform1f(progSky.u.uDay, day);
  gl.uniform1f(progSky.u.uTime, gameTime);
  gl.uniform1f(progSky.u.uRain, rain);
  gl.uniform1f(progSky.u.uClouds, settings.clouds?1:0);
  gl.uniform1i(progSky.u.uUnderwater, uw);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texClouds);
  gl.uniform1i(progSky.u.uCloudTex, 1);
  gl.bindVertexArray(skyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  glStat.draws++;
  gl.bindVertexArray(null);
  gl.depthMask(true);

  // ---------- selection outline + crack ----------
  if(target && !uiOpen()){
    drawSelection();
  }

  // ---------- water ----------
  gl.useProgram(progTerrain);
  gl.uniform1i(progTerrain.u.uPass, 2);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  for(let i=visibleChunks.length-1;i>=0;i--){
    const c=visibleChunks[i];
    if(!c.wa.count) continue;
    gl.uniform3f(progTerrain.u.uOrigin, c.ox-camPos[0], -camPos[1], c.oz-camPos[2]);
    gl.bindVertexArray(c.wa.vao);
    gl.drawElements(gl.TRIANGLES, c.wa.count, gl.UNSIGNED_INT, 0);
    glStat.draws++; glStat.tris+=c.wa.count/3;
  }
  gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(null);

  // ---------- particles ----------
  drawParticles(day, sun, rain, fogNear, fogFar, uw);
  gl.disable(gl.BLEND);

  // ---------- view model ----------
  if(player.thirdPerson===0 && !player.dead) drawViewModel(day, sun, rain, ambient, uw);
  gl.bindVertexArray(null);
}

function drawEntities(day,sun,rain,fogNear,fogFar,ambient,uw){
  gl.useProgram(progBox);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
  gl.uniform1i(progBox.u.uTex, 0);
  gl.uniformMatrix4fv(progBox.u.uVP, false, vp);
  gl.uniform3f(progBox.u.uSunDir, sun[0],sun[1],sun[2]);
  gl.uniform1f(progBox.u.uDay, day);
  gl.uniform1f(progBox.u.uRain, rain);
  gl.uniform1f(progBox.u.uFogNear, fogNear);
  gl.uniform1f(progBox.u.uFogFar, fogFar);
  gl.uniform1f(progBox.u.uAmbient, ambient);
  gl.uniform1i(progBox.u.uUnderwater, uw);
  boxReset();
  // --- item drops
  for(const e of items){
    const L=getLightRaw(Math.floor(e.x),Math.floor(e.y+0.2),Math.floor(e.z));
    const sky=L>>4, blk=L&15;
    const yy=e.y+0.14+Math.sin(e.bob)*0.055 - camPos[1];
    const rot=e.bob*0.55;
    const it=ITEMS[e.id];
    if(it.block!==undefined){
      const b=BLOCKS[it.block];
      const m=boxMat(e.x-camPos[0], yy, e.z-camPos[2], 0.26,0.26,0.26, rot,0, 0,0,0);
      let tint=b.tint; if(tint===255) tint=1;
      const tc=[TINT_PALETTE[tint*3],TINT_PALETTE[tint*3+1],TINT_PALETTE[tint*3+2]];
      boxPush(m, tc[0],tc[1],tc[2],1, b.tex[0], b.tex[2], b.tex[3], b.tex[4], sky, blk, 0);
    } else {
      const m=boxMat(e.x-camPos[0], yy, e.z-camPos[2], 0.32,0.32,0.035, rot,0, 0,0,0);
      boxPush(m, 1,1,1,1, it.icon, it.icon, it.icon, it.icon, sky, blk, 0);
    }
  }
  // --- mobs
  for(const m of mobs){
    const d=MOB[m.type];
    const L=getLightRaw(Math.floor(m.x),Math.floor(m.y+d.h*0.6),Math.floor(m.z));
    const sky=L>>4, blk=L&15;
    const cy=Math.cos(m.yaw), sy=Math.sin(m.yaw);
    const hurt=m.hurt>0;
    for(const part of d.parts){
      let rx=0;
      if(part.leg) rx=Math.sin(m.walk*2+(part.leg===1?0:Math.PI))*0.85*m.walkAmt;
      if(part.arm) rx=Math.sin(m.walk*2+(part.arm===1?Math.PI:0))*0.45*m.walkAmt - 1.35;
      const pxr=part.p[0]*cy + part.p[2]*sy;
      const pzr=-part.p[0]*sy + part.p[2]*cy;
      const mm=boxMat(m.x+pxr-camPos[0], m.y+part.p[1]-camPos[1], m.z+pzr-camPos[2],
                      part.s[0],part.s[1],part.s[2], m.yaw, rx, part.c[0],part.c[1],part.c[2]);
      const col=part.col;
      boxPush(mm, hurt?1:col[0], hurt?col[1]*0.4:col[1], hurt?col[2]*0.4:col[2], 1, -1,-1,-1,-1, sky, blk, hurt?0.25:0);
    }
    // eyes
    if(d.parts[1] && d.parts[1].head){
      const p=d.parts[1];
      const fx=Math.sin(m.yaw), fz=Math.cos(m.yaw);
      for(const s of [-1,1]){
        const lx=s*p.s[0]*0.26, lz=p.s[2]*0.5+0.01;
        const wx=lx*cy+lz*sy, wz=-lx*sy+lz*cy;
        const mm=boxMat(m.x+wx-camPos[0], m.y+p.p[1]+p.s[1]*0.14-camPos[1], m.z+wz-camPos[2],
                        0.09,0.09,0.02, m.yaw,0, 0,0,0);
        boxPush(mm, m.type==='zombie'?0.1:0.08, m.type==='zombie'?0.1:0.06, m.type==='zombie'?0.1:0.06, 1, -1,-1,-1,-1, sky, blk, 0);
      }
    }
  }
  // --- third person player
  if(player.thirdPerson>0){
    const L=getLightRaw(Math.floor(player.pos[0]),Math.floor(player.pos[1]+1),Math.floor(player.pos[2]));
    const sky=L>>4, blk=L&15;
    const y=player.pos[1]-camPos[1];
    const hs=Math.hypot(player.vel[0],player.vel[2]);
    const sw=Math.sin(player.bob*2)*Math.min(1,hs/4)*0.8;
    const parts=[
      {p:[0,1.12,0], c:[0,0,0], s:[0.5,0.7,0.28], col:[0.24,0.52,0.72], rx:0},
      {p:[0,1.62,0], c:[0,0,0], s:[0.5,0.5,0.5], col:[0.85,0.68,0.55], rx:0},
      {p:[-0.36,1.42,0], c:[0,-0.28,0], s:[0.22,0.66,0.22], col:[0.85,0.68,0.55], rx:sw},
      {p:[0.36,1.42,0], c:[0,-0.28,0], s:[0.22,0.66,0.22], col:[0.85,0.68,0.55], rx:-sw},
      {p:[-0.13,0.72,0], c:[0,-0.34,0], s:[0.22,0.72,0.22], col:[0.28,0.3,0.5], rx:-sw},
      {p:[0.13,0.72,0], c:[0,-0.34,0], s:[0.22,0.72,0.22], col:[0.28,0.3,0.5], rx:sw}
    ];
    const yaw=player.yaw;
    const cy=Math.cos(yaw), sy=Math.sin(yaw);
    for(const part of parts){
      const pxr=part.p[0]*cy+part.p[2]*sy, pzr=-part.p[0]*sy+part.p[2]*cy;
      const mm=boxMat(player.pos[0]+pxr-camPos[0], y+part.p[1], player.pos[2]+pzr-camPos[2],
                      part.s[0],part.s[1],part.s[2], yaw, part.rx, part.c[0],part.c[1],part.c[2]);
      boxPush(mm, part.col[0],part.col[1],part.col[2],1, -1,-1,-1,-1, sky, blk, 0);
    }
  }
  boxFlush();
}

function drawSelection(){
  const t=target;
  // wire outline
  gl.useProgram(progLine);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniformMatrix4fv(progLine.u.uVP, false, vp);
  gl.uniform3f(progLine.u.uOrigin, t.x-camPos[0]-0.002, t.y-camPos[1]-0.002, t.z-camPos[2]-0.002);
  gl.uniform1f(progLine.u.uScale, 1.004);
  gl.uniform4f(progLine.u.uColor, 0,0,0,0.55);
  gl.bindVertexArray(lineVAO);
  gl.drawArrays(gl.LINES, 0, 24);
  glStat.draws++;
  gl.bindVertexArray(null);
  // crack overlay
  if(mining.active && mining.stage>=0 && mining.total>0 && mining.total!==Infinity){
    gl.useProgram(progBox);
    gl.uniformMatrix4fv(progBox.u.uVP, false, vp);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    const layer=TX('crack'+mining.stage);
    boxReset();
    const m=boxMat(t.x+0.5-camPos[0], t.y+0.5-camPos[1], t.z+0.5-camPos[2], 1.006,1.006,1.006, 0,0, 0,0,0);
    boxPush(m, 1,1,1,1, layer,layer,layer,layer, 15,0, 0.6);
    boxFlush();
    gl.depthMask(true);
  }
  gl.disable(gl.BLEND);
}

function drawParticles(day,sun,rain,fogNear,fogFar,uw){
  if(particles.length===0) return;
  // screen right = forward x worldUp ; screen up = right x forward
  const rightX=-Math.cos(player.yaw), rightZ=Math.sin(player.yaw);
  const d=camDirV;
  const ux=-rightZ*d[1], uy=rightZ*d[0]-rightX*d[2], uz=rightX*d[1];
  let n=0;
  for(let i=0;i<particles.length && n<MAX_PART;i++){
    const p=particles[i];
    const o=n*12;
    const fade = Math.min(1, p.life/Math.min(0.35,p.maxLife));
    partData[o]=p.x-camPos[0]; partData[o+1]=p.y-camPos[1]; partData[o+2]=p.z-camPos[2]; partData[o+3]=p.size;
    partData[o+4]=p.r; partData[o+5]=p.g; partData[o+6]=p.b; partData[o+7]=p.a*fade;
    partData[o+8]=p.layer; partData[o+9]=p.uvx; partData[o+10]=p.uvy; partData[o+11]=p.rot;
    n++;
  }
  gl.useProgram(progPart);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
  gl.uniform1i(progPart.u.uTex, 0);
  gl.uniformMatrix4fv(progPart.u.uVP, false, vp);
  gl.uniform3f(progPart.u.uRight, rightX, 0, rightZ);
  gl.uniform3f(progPart.u.uUp, ux, uy, uz);
  gl.uniform3f(progPart.u.uSunDir, sun[0],sun[1],sun[2]);
  gl.uniform1f(progPart.u.uDay, day);
  gl.uniform1f(progPart.u.uRain, rain);
  gl.uniform1f(progPart.u.uFogNear, fogNear);
  gl.uniform1f(progPart.u.uFogFar, fogFar);
  gl.uniform1i(progPart.u.uUnderwater, uw);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.bindBuffer(gl.ARRAY_BUFFER, partInstVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, partData.subarray(0,n*12));
  gl.bindVertexArray(partVAO);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_INT, 0, n);
  glStat.draws++;
  gl.bindVertexArray(null);
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
}

function drawViewModel(day,sun,rain,ambient,uw){
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(progBox);
  gl.uniformMatrix4fv(progBox.u.uVP, false, vmProj);
  gl.uniform3f(progBox.u.uSunDir, sun[0],sun[1],sun[2]);
  gl.uniform1f(progBox.u.uDay, day);
  gl.uniform1f(progBox.u.uRain, rain);
  gl.uniform1f(progBox.u.uFogNear, 900);
  gl.uniform1f(progBox.u.uFogFar, 1000);
  gl.uniform1f(progBox.u.uAmbient, ambient+0.05);
  gl.uniform1i(progBox.u.uUnderwater, 0);
  const L=getLightRaw(Math.floor(player.pos[0]),Math.floor(player.pos[1]+1),Math.floor(player.pos[2]));
  const sky=L>>4, blk=L&15;
  const sw=Math.sin(Math.min(1,player.swing)*Math.PI);
  const bobx=Math.sin(player.bob)*0.014*player.bobAmt, boby=Math.abs(Math.cos(player.bob))*0.016*player.bobAmt;
  const st=heldItem();
  boxReset();
  if(st && ITEMS[st.id].block!==undefined){
    const b=BLOCKS[ITEMS[st.id].block];
    let tint=b.tint; if(tint===255) tint=1;
    const m=boxMat(0.58+bobx - sw*0.10, -0.52-boby - sw*0.24, -0.82 + sw*0.16,
                   0.42,0.42,0.42, -0.62+sw*0.7, 0.18-sw*0.95, 0,0,0);
    boxPush(m, TINT_PALETTE[tint*3],TINT_PALETTE[tint*3+1],TINT_PALETTE[tint*3+2],1,
            b.tex[0],b.tex[2],b.tex[3],b.tex[4], sky, blk, 0);
  } else if(st){
    const it=ITEMS[st.id];
    const m=boxMat(0.56+bobx - sw*0.12, -0.50-boby - sw*0.26, -0.78 + sw*0.18,
                   0.46,0.46,0.045, -0.9+sw*0.5, -0.5-sw*0.9, 0,0,0);
    boxPush(m, 1,1,1,1, it.icon,it.icon,it.icon,it.icon, sky, blk, 0);
  } else {
    const m=boxMat(0.62+bobx - sw*0.14, -0.62-boby - sw*0.20, -0.72 + sw*0.2,
                   0.16,0.44,0.16, -0.35+sw*0.5, 0.9-sw*1.1, 0,0,0);
    boxPush(m, 0.87,0.70,0.56,1, -1,-1,-1,-1, sky, blk, 0);
  }
  boxFlush();
}

// =====================================================================
//  TICK + LOOP
// =====================================================================
function tick(){
  waterFillBudget = 10;
  processBlockUpdates();
  tickFurnaces(TICK);
  // torch flame particles
  if(Math.random()<0.85){
    const px=Math.floor(player.pos[0]), py=Math.floor(player.pos[1]), pz=Math.floor(player.pos[2]);
    for(let k=0;k<6;k++){
      const x=px+((Math.random()*17)|0)-8, y=py+((Math.random()*13)|0)-6, z=pz+((Math.random()*17)|0)-8;
      const b=getBlock(x,y,z);
      if(b===B.TORCH){ spawnFlame(x+0.5,y+0.62,z+0.5); if(Math.random()<0.25) spawnSmoke(x+0.5,y+0.72,z+0.5,1); }
      else if(b===B.LAVA && Math.random()<0.25){ spawnFlame(x+0.5,y+1.0,z+0.5); }
    }
  }
  // ambient cave/water sounds
  if(player.headInWater && Math.random()<0.02) sfx.play('fizz');
}

function frame(now){
  requestAnimationFrame(frame);
  const t0=performance.now();
  if(!lastTime) lastTime=now;
  let dt=(now-lastTime)/1000;
  lastTime=now;
  if(dt>0.25) dt=0.25;
  if(dt<=0) dt=1/60;

  if(gameStarted){
    gameTime+=dt;
    worldTime += dt/(settings.dayLen*60);
    if(worldTime>1) worldTime-=1;
  }

  const paused = document.getElementById('pause').classList.contains('on') ||
                 document.getElementById('settings').classList.contains('on');

  // world streaming always runs so the world keeps loading
  updateStreaming(player.pos[0], player.pos[2], dt);

  if(gameStarted && !paused){
    if(!worldReady){
      const c=chunkAt(Math.floor(player.pos[0]/16), Math.floor(player.pos[2]/16));
      if(c && c.state>=3){
        worldReady=true;
        if(!loadedFromSave){
          const y=findSurface(Math.floor(player.pos[0]),Math.floor(player.pos[2]));
          player.pos[1]=y+0.2;
          player.spawn=[player.pos[0],player.pos[1],player.pos[2]];
        }
      }
    }
    if(worldReady && !player.dead){
      updatePlayer(dt);
      updateTarget();
      updateMining(dt);
      if(mouseButtons[0] && !target && pointerLocked && !uiOpen()) player.swinging=true;
      // hold right mouse to keep placing
      useRepeat -= dt;
      if(mouseButtons[2] && pointerLocked && !uiOpen()){
        if(useRepeat<=0){ useRepeat=0.20; onUse(true); }
      } else useRepeat=0.28;
    } else if(!worldReady){
      updateTarget();
    }
    updateItems(dt);
    updateMobs(dt);
    updateParticles(dt);
    updateWeather(dt);
    sfx.tickDig(dt);
    sfx.tickMusic(dt);
    tickAcc+=dt;
    let guard=0;
    while(tickAcc>=TICK && guard++<5){ tickAcc-=TICK; tick(); }
  }

  // swing animation
  if(player.swinging){ player.swing+=dt*4.2; if(player.swing>=1){ player.swing=0; player.swinging = (mouseButtons[0]&&mining.active); } }
  else player.swing=0;

  resize();
  computeCamera(dt);
  render(dt);
  updateHUD(dt);

  frameMs = performance.now()-t0;
  fpsHist[fpsIdx]=dt*1000; fpsIdx=(fpsIdx+1)%fpsHist.length;
  let s=0; for(let i=0;i<fpsHist.length;i++) s+=fpsHist[i];
  fps = 1000/(s/fpsHist.length);
}

// =====================================================================
//  HUD
// =====================================================================
let hudT=0;
function updateHUD(dt){
  hudT-=dt;
  if(itemNameT>0){ itemNameT-=dt; if(itemNameT<=0) document.getElementById('itemname').classList.remove('show'); }
  document.getElementById('waterOv').style.opacity = player.headInWater?'1':'0';
  document.getElementById('lavaOv').style.opacity = player.headInLava?'1':'0';
  document.getElementById('crosshair').classList.toggle('hidden', uiOpen()||player.thirdPerson>0);
  const yaw=((player.yaw*180/Math.PI)%360+360)%360;
  const dirs=['S','SE','E','NE','N','NW','W','SW'];
  const di=Math.round(yaw/45)%8;
  if(hudT<=0){
    hudT=0.12;
    document.getElementById('compass').textContent = dirs[di]+'  '+Math.round(yaw)+'°';
    const dbg=document.getElementById('debug');
    if(dbg.classList.contains('on')){
      const p=player.pos;
      const bi=biomeAtWorld(Math.floor(p[0]),Math.floor(p[2]));
      const L=getLightRaw(Math.floor(p[0]),Math.floor(p[1]+1),Math.floor(p[2]));
      const clock=(worldTime*24+6)%24;
      const tm=Math.floor(clock), tmm=Math.floor((clock%1)*60);
      dbg.textContent =
        'VOXELCRAFT  ·  '+fps.toFixed(0)+' fps  ('+frameMs.toFixed(1)+' ms)\n'+
        'XYZ  '+p[0].toFixed(2)+' / '+p[1].toFixed(2)+' / '+p[2].toFixed(2)+'\n'+
        'Chunk '+Math.floor(p[0]/16)+', '+Math.floor(p[2]/16)+'   Block '+Math.floor(p[0])+' '+Math.floor(p[1])+' '+Math.floor(p[2])+'\n'+
        'Biome  '+BIOME_NAME[bi]+'\n'+
        'Light  sky '+(L>>4)+'  block '+(L&15)+'\n'+
        'Time   '+String(tm).padStart(2,'0')+':'+String(tmm).padStart(2,'0')+'  ('+(dayFactor()>0.5?'day':'night')+')\n'+
        'Weather '+weather.state+'  '+(weather.intensity*100).toFixed(0)+'%\n'+
        (target? 'Target  '+BLOCKS[target.block].name+'  ('+target.x+','+target.y+','+target.z+')' : 'Target  —');
      const dbr=document.getElementById('debugR');
      dbr.textContent =
        'chunks  '+chunks.size+'  (vis '+glStat.chunks+')\n'+
        'draws   '+glStat.draws+'\n'+
        'tris    '+(glStat.tris/1000).toFixed(1)+'k\n'+
        'gen q   '+genInFlight+'   mesh q '+meshInFlight+'\n'+
        'entities '+mobs.length+' mobs, '+items.length+' items\n'+
        'particles '+particles.length+'\n'+
        'workers '+(pool ? (pool.fallback?'inline':pool.workers.length) : '—')+'\n'+
        'seed    '+worldSeed;
      drawGraph();
    }
  }
}
function drawGraph(){
  const c=document.getElementById('graph');
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='rgba(6,8,12,.55)';
  ctx.fillRect(0,0,c.width,c.height);
  for(let i=0;i<fpsHist.length;i++){
    const v=fpsHist[(fpsIdx+i)%fpsHist.length];
    const h=Math.min(c.height, v/33.3*c.height);
    ctx.fillStyle = v<17?'#7fd24a':(v<34?'#ffcc4d':'#ff5a4d');
    ctx.fillRect(i*1.25, c.height-h, 1.2, h);
  }
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.beginPath();
  ctx.moveTo(0,c.height-16.6/33.3*c.height); ctx.lineTo(c.width,c.height-16.6/33.3*c.height); ctx.stroke();
}

// =====================================================================
//  SAVE / LOAD
// =====================================================================
let loadedFromSave=false;
function saveWorld(){
  try{
    const ed=[];
    for(const [k,m] of edits){
      const a=[];
      for(const [i,v] of m) a.push(i,v);
      ed.push([k,a]);
    }
    const co=[];
    for(const [k,c] of containers) co.push([k,{type:c.type,slots:c.slots,burn:c.burn||0,burnMax:c.burnMax||0,cook:c.cook||0}]);
    const data={
      v:1, seed:worldSeed, time:worldTime,
      p:{pos:player.pos, yaw:player.yaw, pitch:player.pitch, health:player.health, food:player.food,
         sat:player.saturation, mode:player.mode, xp:player.xp, lvl:player.level, spawn:player.spawn, fly:player.flying},
      inv:inv.slots, hot:hotbarSel, ed, co
    };
    localStorage.setItem('vx_world', JSON.stringify(data));
    toast('World saved ('+ed.length+' modified chunks)');
    sfx.play('craft');
  }catch(e){ toast('Save failed: '+e.message); }
}
function loadWorld(){
  try{
    const raw=localStorage.getItem('vx_world');
    if(!raw){ toast('No saved world found'); return false; }
    const d=JSON.parse(raw);
    startWorld(d.seed, d);
    toast('World loaded');
    return true;
  }catch(e){ toast('Load failed: '+e.message); return false; }
}

// =====================================================================
//  BOOT
// =====================================================================
const TIPS = [
  'Punch a tree to get wood, then craft planks and a crafting table.',
  'Torches keep the darkness — and the zombies — away.',
  'Sand and gravel fall. Do not dig straight down.',
  'A furnace turns iron ore into ingots, and raw pork into dinner.',
  'Diamonds hide below y=16. Bring an iron pickaxe.',
  'Water flows into any hole you dig beneath it.',
  'Shift near an edge and you will not fall off.',
  'Press F5 to admire yourself in third person.',
  'Middle-click a block to pick it into your hand.',
  'Press F3 for the debug overlay and a frame-time graph.'
];
function cycleTips(){
  const el=document.getElementById('ltip');
  let i=(Math.random()*TIPS.length)|0;
  el.textContent=TIPS[i];
  setInterval(()=>{ i=(i+1)%TIPS.length; el.style.opacity=0; setTimeout(()=>{ el.textContent=TIPS[i]; el.style.opacity=1; },300); }, 5200);
  el.style.transition='opacity .3s';
}

function startWorld(seed, save){
  // clear existing
  for(const [,c] of chunks) c.free();
  chunks.clear(); invalidateChunkCache();
  edits=new Map(); containers=new Map();
  items.length=0; mobs.length=0; particles.length=0;
  worldSeed=seed>>>0;
  loadedFromSave=!!save;
  worldReady=false;
  player.dead=false; player.thirdPerson=0;
  hideScreen('death');
  if(save){
    worldTime=save.time||0.28;
    player.pos=save.p.pos.slice(); player.yaw=save.p.yaw; player.pitch=save.p.pitch;
    player.health=save.p.health; player.food=save.p.food; player.saturation=save.p.sat||5;
    player.mode=save.p.mode; player.xp=save.p.xp||0; player.level=save.p.lvl||0;
    player.spawn=save.p.spawn||player.pos.slice(); player.flying=!!save.p.fly;
    inv.slots=save.inv.map(s=>s?{id:s.id,count:s.count,dmg:s.dmg||0}:null);
    while(inv.slots.length<36) inv.slots.push(null);
    hotbarSel=save.hot||0;
    for(const [k,a] of save.ed){ const m=new Map(); for(let i=0;i<a.length;i+=2) m.set(a[i],a[i+1]); edits.set(k,m); }
    for(const [k,c] of save.co) containers.set(k,c);
  } else {
    worldTime=0.26;
    player.pos=[0.5, 100, 0.5]; player.yaw=0.6; player.pitch=-0.12;
    player.health=20; player.food=20; player.saturation=5; player.xp=0; player.level=0;
    player.flying=false;
    inv.slots=new Array(36).fill(null);
    hotbarSel=0;
    if(player.mode===GM.CREATIVE){
      inv.slots[0]={id:B.STONE,count:64}; inv.slots[1]={id:B.PLANKS,count:64};
      inv.slots[2]={id:B.GLASS,count:64}; inv.slots[3]={id:B.TORCH,count:64};
    }
  }
  player.vel=[0,0,0];
  startPool(worldSeed);
  updateHotbar(); updateBars();
  lastPCX=1e9; lastPCZ=1e9; listTimer=0;
}

function wireUI(){
  buildHotbar();
  document.getElementById('btnPlay').addEventListener('click', ()=>{
    sfx.init(); sfx.resume();
    if(!generating){
      generating=true;
      const v=document.getElementById('seedInput').value.trim();
      let seed;
      if(v==='') seed=(Math.random()*4294967295)>>>0;
      else if(/^-?\d+$/.test(v)) seed=(parseInt(v,10))>>>0;
      else { seed=0; for(let i=0;i<v.length;i++) seed=(Math.imul(seed,31)+v.charCodeAt(i))>>>0; }
      document.getElementById('startBox').style.display='none';
      document.getElementById('lspin').style.display='block';
      startWorld(seed);
      pollReady();
    }
  });
  document.getElementById('btnResume').addEventListener('click', resumeGame);
  document.getElementById('btnSettings').addEventListener('click', ()=>{ hideScreen('pause'); showScreen('settings'); syncSettingsUI(); });
  document.getElementById('btnSetBack').addEventListener('click', ()=>{ hideScreen('settings'); showPause(); saveSettings(); });
  document.getElementById('btnSave').addEventListener('click', saveWorld);
  document.getElementById('btnLoad').addEventListener('click', ()=>{ if(loadWorld()){ hideScreen('pause'); worldReady=false; } });
  document.getElementById('btnNew').addEventListener('click', ()=>{
    const s=prompt('World seed (blank = random):','');
    if(s===null) return;
    let seed;
    if(s.trim()==='') seed=(Math.random()*4294967295)>>>0;
    else if(/^-?\d+$/.test(s.trim())) seed=parseInt(s,10)>>>0;
    else { seed=0; for(let i=0;i<s.length;i++) seed=(Math.imul(seed,31)+s.charCodeAt(i))>>>0; }
    startWorld(seed);
    hideScreen('pause');
    toast('New world · seed '+seed);
  });
  document.getElementById('btnGamemode').addEventListener('click', ()=>{
    player.mode = player.mode===GM.SURVIVAL?GM.CREATIVE:GM.SURVIVAL;
    if(player.mode===GM.SURVIVAL) player.flying=false;
    updateGamemodeBtn(); updateBars(); updateHotbar();
    toast('Gamemode: '+(player.mode===GM.CREATIVE?'Creative':'Survival'));
  });
  document.getElementById('btnRespawn').addEventListener('click', respawn);

  const bind=(id, key, fmt, onchange)=>{
    const el=document.getElementById(id);
    el.addEventListener('input', ()=>{
      settings[key]=parseInt(el.value,10);
      document.getElementById('v'+id.slice(3)).textContent = fmt(settings[key]);
      if(onchange) onchange();
      saveSettings();
    });
  };
  bind('optRD','renderDist', v=>v+' chunks', ()=>{ lastPCX=1e9; });
  bind('optFOV','fov', v=>v+'°');
  bind('optSens','sens', v=>v+'%');
  bind('optRes','res', v=>v+'%');
  bind('optVol','vol', v=>v+'%', ()=>sfx.setVol());
  bind('optMus','music', v=>v+'%', ()=>sfx.setVol());
  bind('optDay','dayLen', v=>v+' min');
  const tog=(id,key,label,after)=>{
    document.getElementById(id).addEventListener('click', ()=>{
      settings[key]=!settings[key];
      document.getElementById(id).textContent=label+': '+(settings[key]?'On':'Off');
      if(after) after();
      saveSettings();
    });
  };
  tog('optClouds','clouds','Clouds');
  tog('optSmooth','smooth','Smooth lighting', remeshAll);
  tog('optBob','bob','View bobbing');
  tog('optWeather','weather','Weather');
  tog('optMobs','mobs','Creatures');
  tog('optFog','fog','Fog');

  window.addEventListener('mousemove', e=>{
    const el=document.getElementById('cursorItem');
    el.style.left=e.clientX+'px'; el.style.top=e.clientY+'px';
  });
  document.getElementById('inv').addEventListener('mousedown', e=>{
    if(e.target.id==='inv' && cursorStack){
      spawnItem(player.pos[0]+camDirV[0]*0.5, player.pos[1]+1.2, player.pos[2]+camDirV[2]*0.5,
                cursorStack.id, cursorStack.count, false, [camDirV[0]*4,2.5,camDirV[2]*4]);
      cursorStack=null; paintCursor();
    }
  });
  canvas.addEventListener('mousedown', e=>{
    if(e.button===0 && pointerLocked && !uiOpen() && !player.dead){ tryAttack(); }
  });
  updateGamemodeBtn();
}
function updateGamemodeBtn(){
  document.getElementById('btnGamemode').textContent='Gamemode: '+(player.mode===GM.CREATIVE?'Creative':'Survival');
}
function syncSettingsUI(){
  const set=(id,val,fmt)=>{ document.getElementById(id).value=val; document.getElementById('v'+id.slice(3)).textContent=fmt(val); };
  set('optRD',settings.renderDist,v=>v+' chunks');
  set('optFOV',settings.fov,v=>v+'°');
  set('optSens',settings.sens,v=>v+'%');
  set('optRes',settings.res,v=>v+'%');
  set('optVol',settings.vol,v=>v+'%');
  set('optMus',settings.music,v=>v+'%');
  set('optDay',settings.dayLen,v=>v+' min');
  document.getElementById('optClouds').textContent='Clouds: '+(settings.clouds?'On':'Off');
  document.getElementById('optSmooth').textContent='Smooth lighting: '+(settings.smooth?'On':'Off');
  document.getElementById('optBob').textContent='View bobbing: '+(settings.bob?'On':'Off');
  document.getElementById('optWeather').textContent='Weather: '+(settings.weather?'On':'Off');
  document.getElementById('optMobs').textContent='Creatures: '+(settings.mobs?'On':'Off');
  document.getElementById('optFog').textContent='Fog: '+(settings.fog?'On':'Off');
}

function pollReady(){
  const bar=document.getElementById('lbar').firstChild;
  const pct=document.getElementById('lpct');
  const iv=setInterval(()=>{
    const need=Math.max(12, Math.min(chunkLoadProgress.total, 120));
    const done=chunkLoadProgress.done;
    const f=Math.min(1, done/Math.max(1,need));
    bar.style.width=(f*100).toFixed(0)+'%';
    pct.textContent='building terrain · '+done+' / '+need+' chunks';
    const spawnC = chunkAt(Math.floor(player.pos[0]/16), Math.floor(player.pos[2]/16));
    if(f>=1 && spawnC && spawnC.hasMesh){
      clearInterval(iv);
      bar.style.width='100%';
      pct.textContent='ready';
      document.getElementById('lspin').style.display='none';
      const box=document.getElementById('startBox');
      box.style.display='block';
      document.getElementById('seedInput').style.display='none';
      const btn=document.getElementById('btnPlay');
      btn.textContent='▶  ENTER WORLD';
      btn.onclick=()=>{
        hideScreen('loading');
        gameStarted=true;
        sfx.init(); sfx.resume();
        requestLock();
        setTimeout(()=>toast('Welcome to Voxelcraft — seed '+worldSeed),400);
      };
    }
  }, 120);
}

function boot(){
  loadSettings();
  buildTextures();
  buildBlocks();
  buildItems();
  buildRecipes();
  buildSmelting();
  buildFuels();
  try{ initGL(); }
  catch(e){
    document.getElementById('loading').innerHTML =
      '<div class="panel"><h1>VOXELCRAFT</h1><div class="sub" style="color:#ff8a7a;margin-top:18px">'+
      e.message+'</div><div class="tiny" style="margin-top:14px;text-align:center">This game needs WebGL 2. Try a recent Chrome, Edge, Firefox or Safari 15+.</div></div>';
    throw e;
  }
  initInput();
  wireUI();
  syncSettingsUI();
  cycleTips();
  updateBars();
  document.getElementById('startBox').style.display='block';
  document.getElementById('lspin').style.display='none';
  document.getElementById('lpct').textContent='ready when you are';
  requestAnimationFrame(frame);
  window.__game = {player, chunks, settings, BLOCKS, ITEMS, inv, startWorld, setBlock, getBlock, sfx, mobs, items};
}
window.addEventListener('load', boot);
</script>
