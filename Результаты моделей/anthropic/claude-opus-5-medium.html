function layoutViewModel(dt){
  if (!vmMesh) return;
  const sw = Math.sin(player.swing*Math.PI);
  const bob = player.bobAmt;
  const bx = Math.sin(player.bobT*2)*0.018*bob, by = -Math.abs(Math.cos(player.bobT*2))*0.022*bob;
  // anchor to the lower-right corner of whatever aspect ratio we are running at
  const Z = 0.92;
  const halfH = Math.tan(vmCam.fov*Math.PI/360)*Z;
  const halfW = halfH*Math.max(0.6, vmCam.aspect);
  const ax = halfW*0.60, ay = -halfH*0.62;
  if (isBlockId(vmId)){
    vmMesh.position.set(ax+bx - sw*0.14, ay+by - sw*0.20, -Z + sw*0.18);
    vmMesh.rotation.set(-0.18 + sw*0.9, 0.72 - sw*0.5, 0.12);
  } else {
    vmMesh.position.set(ax+bx - sw*0.16, ay+by - sw*0.18, -Z + sw*0.16);
    vmMesh.rotation.set(-0.30 + sw*1.1, -0.55, 0.9 - sw*0.4);
  }
  // light the held item from the player's position
  const L = { s: world.getSky(Math.floor(player.pos.x),Math.floor(player.pos.y+1),Math.floor(player.pos.z))/MAXLIGHT,
              b: world.getBlk(Math.floor(player.pos.x),Math.floor(player.pos.y+1),Math.floor(player.pos.z))/MAXLIGHT };
  const attr = vmMesh.geometry.attributes.lightv;
  for (let k=0;k<attr.count;k++){ attr.array[k*2]=Math.max(L.s,0.35); attr.array[k*2+1]=L.b; }
  attr.needsUpdate=true;
}

/* ============================================================
   18. Interaction: mining, placing, using
   ============================================================ */
const mouse = {0:false,1:false,2:false};
let target = null;
const mining = {x:0,y:0,z:0,t:0,total:0,on:false};
let placeCooldown = 0;

function toolFor(){
  const s = heldItem();
  if (!s) return null;
  const d = ITEMS[s.id];
  return (d && d.tool) ? d : null;
}
function breakTime(id){
  const def = BLOCKS[id];
  if (!def || def.hardness<0) return Infinity;
  const tool = toolFor();
  const right = tool && def.tool && tool.tool===def.tool;
  const tier  = tool ? tool.tier : 0;
  const can   = def.needs===0 || (right && tier>=def.needs);
  let speed = 1;
  if (right) speed = tool.speed;
  else if (tool && tool.tool==='sword' && def.render==='cross') speed = 6;
  const t = def.hardness * (can?1.5:5.0) / speed;
  return Math.max(0.05, t);
}
function canHarvest(id){
  const def=BLOCKS[id];
  if (!def.needs) return true;
  const tool=toolFor();
  return !!(tool && tool.tool===def.tool && tool.tier>=def.needs);
}
function breakBlock(x,y,z){
  const id = world.getBlock(x,y,z);
  if (!id || BLOCKS[id].hardness<0) return;
  const def = BLOCKS[id];
  world.setBlock(x,y,z,0);
  blockParticles(x,y,z,id,16);
  Audio2.break_(def.stepSound||'stone');
  if (player.mode==='survival'){
    if (canHarvest(id)){
      const rnd = Math.random;
      const items = def.drop(rnd);
      for (const it of items)
        spawnDrop(x+0.5,y+0.4,z+0.5, it.id, it.n, (Math.random()-.5)*1.4, 2.2, (Math.random()-.5)*1.4);
    }
    const tool = toolFor();
    if (tool) damageTool(1);
  }
  // gravity blocks above collapse
  for (let yy=y+1; yy<CH; yy++){
    const above = world.getBlock(x,yy,z);
    if (!above) break;
    const ad = BLOCKS[above];
    if (!ad.gravity) break;
    world.setBlock(x,yy,z,0);
    world.setBlock(x,yy-1,z,above);
  }
  // detach floating plants
  const up = world.getBlock(x,y+1,z);
  if (up && BLOCKS[up].render==='cross'){
    world.setBlock(x,y+1,z,0);
    if (player.mode==='survival') for (const it of BLOCKS[up].drop(Math.random)) spawnDrop(x+.5,y+1.4,z+.5,it.id,it.n,0,1.4,0);
  }
  mining.on=false; setCrack(-1);
}
function tryPlace(){
  if (!target) return;
  const s = heldItem();
  if (!s) return;
  const d = defOf(s.id);
  // food first
  if (d && d.food){
    if (player.hp < player.maxHp && player.mode==='survival'){
      heal(d.food); consumeHeld(1); Audio2.eat(); toast('+'+d.food+' health');
      player.swingActive=true; player.swing=0.001;
    }
    return;
  }
  if (!isBlockId(s.id)) { player.swingActive=true; player.swing=0.001; return; }

  let px=target.x, py=target.y, pz=target.z;
  const hitId = world.getBlock(px,py,pz);
  const replaceable = hitId===10 || (BLOCKS[hitId] && BLOCKS[hitId].render==='cross');
  if (!replaceable){ px+=target.nx; py+=target.ny; pz+=target.nz; }
  const cur = world.getBlock(px,py,pz);
  if (cur!==0 && cur!==10 && !(BLOCKS[cur] && BLOCKS[cur].render==='cross')) return;
  if (py<1 || py>=CH) return;

  const def = BLOCKS[s.id];
  if (def.solid!==false){
    // don't place inside the player
    const minX=px, maxX=px+1, minY=py, maxY=py+1, minZ=pz, maxZ=pz+1;
    if (player.pos.x+HW>minX && player.pos.x-HW<maxX &&
        player.pos.y+PH>minY && player.pos.y<maxY &&
        player.pos.z+HW>minZ && player.pos.z-HW<maxZ) return;
    for (const d2 of drops){
      if (d2.x>minX&&d2.x<maxX&&d2.y>minY-0.2&&d2.y<maxY&&d2.z>minZ&&d2.z<maxZ) return;
    }
  }
  if (def.render==='cross' && !isSolid(world.getBlock(px,py-1,pz))) return;

  world.setBlock(px,py,pz,s.id);
  Audio2.place(def.stepSound||'stone');
  if (player.mode==='survival') consumeHeld(1);
  player.swingActive=true; player.swing=0.001;
  placeCooldown = 0.20;
}
function pickBlock(){
  if (!target) return;
  const id = target.id;
  for (let i=0;i<9;i++) if (inv.slots[i] && inv.slots[i].id===id){ selectSlot(i); return; }
  if (player.mode==='creative'){
    inv.slots[inv.sel] = newStack(id, stackMax(id));
    refreshInv(); selectSlot(inv.sel);
  } else {
    for (let i=9;i<INV_SIZE;i++) if (inv.slots[i] && inv.slots[i].id===id){
      const t=inv.slots[inv.sel]; inv.slots[inv.sel]=inv.slots[i]; inv.slots[i]=t;
      refreshInv(); selectSlot(inv.sel); return;
    }
  }
}
function dropHeldStack(all){
  const s = heldItem(); if (!s) return;
  const n = all ? s.n : 1;
  const d = lookDir();
  const e = eyePos();
  spawnDrop(e.x+d.x*0.6, e.y-0.2+d.y*0.6, e.z+d.z*0.6, s.id, n, d.x*5.5, d.y*5.5+2.2, d.z*5.5);
  consumeHeld(n);
}

function updateInteraction(dt){
  const e = eyePos(), d = lookDir();
  const reach = player.mode==='creative' ? 7 : 5;
  target = raycast(e, d, reach, false);

  $('#cross').classList.toggle('hit', !!target);
  if (target){
    selBox.visible = true;
    selBox.position.set(target.x+0.5, target.y+0.5, target.z+0.5);
  } else selBox.visible=false;

  if (placeCooldown>0) placeCooldown-=dt;
  if (mouse[2] && placeCooldown<=0 && target) tryPlace();

  if (!mouse[0] || !target || !player.alive){
    if (mining.on){ mining.on=false; setCrack(-1); }
  } else {
    if (!mining.on || mining.x!==target.x || mining.y!==target.y || mining.z!==target.z){
      mining.on=true; mining.x=target.x; mining.y=target.y; mining.z=target.z;
      mining.t=0; mining.total=breakTime(target.id);
      if (player.mode==='creative') mining.total=0.001;
    }
    mining.t += dt;
    player.swingActive = true;
    if (mining.t % 0.28 < dt){
      Audio2.dig(BLOCKS[target.id].stepSound||'stone');
      blockParticles(target.x,target.y,target.z,target.id,2);
    }
    if (mining.t >= mining.total){
      breakBlock(mining.x,mining.y,mining.z);
    } else {
      crackMesh.position.set(mining.x+0.5, mining.y+0.5, mining.z+0.5);
      setCrack(Math.min(7, Math.floor(mining.t/mining.total*8)));
    }
  }
  if (!mining.on) setCrack(-1);

  // swing animation: keeps looping while mining, otherwise plays once
  if (player.swingActive || player.swing>0){
    player.swing += dt*4.2;
    if (player.swing>=1){
      player.swing = 0;
      if (!(mouse[0] && mining.on)) player.swingActive = false;
    }
  }
}

/* ============================================================
   19. Day / night
   ============================================================ */
const DAY_LENGTH = 900;           // seconds for a full cycle
let dayTime = 0.28;               // 0 = midnight, .25 = sunrise, .5 = noon
const SKY = {
  day:   {top:new T.Color(0x3b7fd4), hor:new T.Color(0xbcdcfb), fog:new T.Color(0xbcdcfb), sun:new T.Color(0xfff3d0)},
  dusk:  {top:new T.Color(0x2b3f7a), hor:new T.Color(0xf3a35c), fog:new T.Color(0xd88f63), sun:new T.Color(0xffb066)},
  night: {top:new T.Color(0x05070f), hor:new T.Color(0x101a33), fog:new T.Color(0x0c1424), sun:new T.Color(0x9fb8e8)}
};
const tmpC1=new T.Color(), tmpC2=new T.Color();
let dayCount = 1, clockAcc = 0;
function updateSky(dt){
  const prev = dayTime;
  dayTime = (dayTime + dt/DAY_LENGTH) % 1;
  if (dayTime < prev) dayCount++;
  clockAcc += dt;
  if (clockAcc > 0.5){
    clockAcc = 0;
    const h = Math.floor(dayTime*24), m = Math.floor((dayTime*24%1)*60);
    const phase = (h>=6&&h<18) ? '☀' : '☾';
    $('#clock').textContent = phase+' '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+'\nday '+dayCount;
  }
  const ang = (dayTime-0.25)*Math.PI*2;
  const sunDir = new T.Vector3(Math.cos(ang)*0.2, Math.sin(ang), Math.cos(ang));
  sunDir.normalize();
  const elev = sunDir.y;
  const daylight = clamp((elev+0.16)/0.36, 0, 1);
  const dusk = clamp(1-Math.abs(elev)/0.26, 0, 1) * (1-clamp((elev-0.18)/0.2,0,1));

  let A = elev>0 ? SKY.day : SKY.night;
  let B = elev>0 ? SKY.night : SKY.day;
  const t = clamp(1-daylight, 0, 1);
  const top = tmpC1.copy(SKY.day.top).lerp(SKY.night.top, t).lerp(SKY.dusk.top, dusk*0.75);
  const hor = tmpC2.copy(SKY.day.hor).lerp(SKY.night.hor, t).lerp(SKY.dusk.hor, dusk*0.85);
  skyUni.uTop.value.copy(top);
  skyUni.uHoriz.value.copy(hor);
  skyUni.uSunDir.value.copy(sunDir);
  skyUni.uSunCol.value.copy(SKY.day.sun).lerp(SKY.dusk.sun, dusk);
  starMat.uniforms.uOp.value = clamp(1-daylight*1.6, 0, 1)*0.9;

  SHARED_UNIFORMS.uDay.value = 0.12 + 0.88*daylight;

  const under = player.headInWater;
  const fogC = under ? new T.Color(0x1d5a9c).multiplyScalar(0.35+0.65*daylight) : hor;
  SHARED_UNIFORMS.uFogColor.value.lerp(fogC, 1-Math.pow(0.001, dt));
  const far = under ? 26 : chunks.renderDist*CS*0.92;
  SHARED_UNIFORMS.uFogNear.value = lerp(SHARED_UNIFORMS.uFogNear.value, under?2:far*0.45, 1-Math.pow(0.001,dt));
  SHARED_UNIFORMS.uFogFar.value  = lerp(SHARED_UNIFORMS.uFogFar.value,  far, 1-Math.pow(0.001,dt));
  renderer.setClearColor(SHARED_UNIFORMS.uFogColor.value);
  partMat.uniforms.uFogColor.value = SHARED_UNIFORMS.uFogColor.value;

  const cam = camera.position;
  skyMesh.position.copy(cam); stars.position.copy(cam);
  sunMesh.position.copy(cam).addScaledVector(sunDir, 420);
  sunMesh.lookAt(cam);
  moonMesh.position.copy(cam).addScaledVector(sunDir, -420);
  moonMesh.lookAt(cam);
  moonMesh.material.opacity = clamp(1-daylight*1.4,0,1);
  sunMesh.material.opacity  = clamp(daylight*1.6,0,1);
  clouds.position.set(cam.x, 132, cam.z);
  cloudTex.offset.x = (performance.now()*0.000004)%1;
  clouds.material.opacity = 0.16 + 0.42*daylight;
  clouds.material.color.copy(hor).lerp(new T.Color(0xffffff), 0.55);

  $('#water').style.opacity = under ? '1' : '0';
}

/* ============================================================
   20. Save / load
   ============================================================ */
const SAVE_KEY = 'voxelcraft.save.v1';
function saveGame(silent){
  try{
    const edits=[];
    for (const [k,v] of world.edits) edits.push(k+':'+v);
    const data = {
      seed: world.seed, dayTime,
      edits,
      p:{x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch,
         hp:player.hp,air:player.air,mode:player.mode,fly:player.fly},
      inv: inv.slots.map(s=>s?{i:s.id,n:s.n,d:s.dur}:null),
      sel: inv.sel
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if (!silent) toast('World saved');
    return true;
  } catch(e){ if(!silent) toast('Could not save (storage full?)'); return false; }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function applySave(data){
  world.seed = data.seed>>>0;
  world.n = new World(data.seed).n;
  world.edits.clear();
  for (const s of (data.edits||[])){
    const i = s.lastIndexOf(':');
    world.edits.set(s.slice(0,i), +s.slice(i+1));
  }
  dayTime = data.dayTime!==undefined ? data.dayTime : 0.28;
  const p = data.p||{};
  player.pos.set(p.x!==undefined?p.x:0.5, p.y!==undefined?p.y:90, p.z!==undefined?p.z:0.5);
  player.yaw=p.yaw||0; player.pitch=p.pitch||0;
  player.hp = p.hp!==undefined?p.hp:20; player.air = p.air!==undefined?p.air:300;
  player.mode = p.mode||'survival'; player.fly = !!p.fly && player.mode==='creative';
  inv.slots = (data.inv||[]).map(s=> s? (s.d?{id:s.i,n:s.n,dur:s.d}:{id:s.i,n:s.n}) : null);
  while (inv.slots.length<INV_SIZE) inv.slots.push(null);
  inv.sel = data.sel||0;
}

/* ============================================================
   21. Menus
   ============================================================ */
const settings = {
  fov: 72, sens: 0.0022, dist: 7, bob: true
};
let paused=false;
function openMenu(kind){
  paused = true;
  const panel = $('#panel');
  if (kind==='dead'){
    panel.innerHTML = `<h1 style="color:#e05a4a">You died</h1><div class="sub">${player.deathReason||''}</div>
      <button class="primary" id="mRespawn">Respawn</button>
      <button id="mMenu2">Settings</button>`;
    $('#mRespawn').onclick = ()=>{ respawn(); closeMenu(); };
    $('#mMenu2').onclick = ()=>openMenu('settings');
  } else if (kind==='settings'){
    panel.innerHTML = `<h1>Settings</h1><div class="sub">changes apply immediately</div>
      <div class="row"><label>Field of view</label><input type="range" id="sFov" min="60" max="100" value="${settings.fov}"><div class="val" id="vFov">${settings.fov}</div></div>
      <div class="row"><label>Sensitivity</label><input type="range" id="sSens" min="4" max="40" value="${Math.round(settings.sens*10000)}"><div class="val" id="vSens">${Math.round(settings.sens*10000)}</div></div>
      <div class="row"><label>Render distance</label><input type="range" id="sDist" min="3" max="12" value="${settings.dist}"><div class="val" id="vDist">${settings.dist}</div></div>
      <div class="row"><label>Resolution</label><input type="range" id="sRes" min="50" max="100" value="${Math.round(pixelRatio/Math.min(window.devicePixelRatio||1,2)*100)}"><div class="val" id="vRes">100</div></div>
      <button id="mBob">View bobbing: ${settings.bob?'on':'off'}</button>
      <button id="mMute">Sound: ${Audio2.muted?'off':'on'}</button>
      <button class="primary" id="mBack">Back</button>`;
    const bind=(id,vid,fn)=>{ const el=$(id); el.oninput=()=>{ $(vid).textContent=el.value; fn(+el.value); }; };
    bind('#sFov','#vFov',v=>{ settings.fov=v; });
    bind('#sSens','#vSens',v=>{ settings.sens=v/10000; });
    bind('#sDist','#vDist',v=>{ settings.dist=v; chunks.renderDist=v; });
    bind('#sRes','#vRes',v=>{ pixelRatio = Math.min(window.devicePixelRatio||1,2)*(v/100); onResize(); });
    $('#mBob').onclick = e=>{ settings.bob=!settings.bob; e.target.textContent='View bobbing: '+(settings.bob?'on':'off'); };
    $('#mMute').onclick = e=>{ const m=Audio2.toggle(); e.target.textContent='Sound: '+(m?'off':'on'); };
    $('#mBack').onclick = ()=>openMenu('pause');
  } else if (kind==='help'){
    panel.innerHTML = `<h1>Controls</h1><div class="sub">click the world to lock the mouse</div>
      <div class="keys">
      <b>WASD</b> move<br><b>Space</b> jump / swim up<br><b>Shift</b> sprint (fly: down)<br>
      <b>Ctrl</b> sneak — will not walk off edges<br><b>Mouse 1</b> mine (hold)<br>
      <b>Mouse 2</b> place / eat<br><b>Mouse 3</b> pick block<br><b>1–9 / wheel</b> select slot<br>
      <b>E</b> inventory & crafting<br><b>Q</b> drop item (Ctrl+Q: stack)<br>
      <b>F</b> toggle flight (creative)<br><b>G</b> creative / survival<br>
      <b>F3</b> debug overlay<br><b>M</b> mute<br><b>Esc</b> pause
      </div><div style="height:14px"></div><button class="primary" id="mBack2">Back</button>`;
    $('#mBack2').onclick = ()=>openMenu('pause');
  } else {
    panel.innerHTML = `<h1>Voxelcraft</h1><div class="sub">seed ${world.seed}</div>
      <button class="primary" id="mResume">Resume</button>
      <button id="mSave">Save world</button>
      <button id="mHelp">Controls</button>
      <button id="mSet">Settings</button>
      <button class="danger" id="mNew">Generate a new world</button>`;
    $('#mResume').onclick = ()=>{ closeMenu(); requestLock(); };
    $('#mSave').onclick = ()=>saveGame();
    $('#mHelp').onclick = ()=>openMenu('help');
    $('#mSet').onclick = ()=>openMenu('settings');
    $('#mNew').onclick = ()=>{ if (confirm('Discard this world and generate a new one?')) newWorld(); };
  }
  $('#menu').classList.add('on');
  if (document.pointerLockElement) document.exitPointerLock();
}
function closeMenu(){ paused=false; $('#menu').classList.remove('on'); }

function die(reason){
  player.alive=false; player.deathReason = 'You '+(reason||'died');
  for (let i=0;i<INV_SIZE;i++){
    const s=inv.slots[i];
    if (s){ spawnDrop(player.pos.x, player.pos.y+1, player.pos.z, s.id, s.n,
      (Math.random()-.5)*4, 3, (Math.random()-.5)*4); inv.slots[i]=null; }
  }
  refreshInv();
  openMenu('dead');
}
function respawn(){
  player.alive=true; player.hp=player.maxHp; player.air=player.maxAir;
  player.vel.set(0,0,0); player.deathT=0; player.fallStart=null;
  const sp = findSpawn();
  player.pos.copy(safeSpawnNear(sp.x, sp.z) || sp);
  updateHUD();
}
/** Nearest column around (sx,sz) with solid ground and 4 blocks of headroom. */
function safeSpawnNear(sx,sz){
  sx=Math.floor(sx); sz=Math.floor(sz);
  for (let r=0; r<10; r++){
    for (let dz=-r; dz<=r; dz++) for (let dx=-r; dx<=r; dx++){
      if (Math.max(Math.abs(dx),Math.abs(dz))!==r) continue;
      const x=sx+dx, z=sz+dz;
      let y = Math.floor(world.heightAt(x,z))+1;
      while (y<CH-4 && world.getBlock(x,y,z)!==0) y++;
      let clear=true;
      for (let k=0;k<4;k++) if (world.getBlock(x,y+k,z)!==0) clear=false;
      if (clear && isSolid(world.getBlock(x,y-1,z))) return new T.Vector3(x+0.5, y+0.05, z+0.5);
    }
  }
  return null;
}
function findSpawn(){
  for (let r=0;r<48;r++){
    for (let i=0;i<=r*4;i++){
      const ang = i/(r*4+1)*Math.PI*2;
      const x = Math.round(Math.cos(ang)*r), z = Math.round(Math.sin(ang)*r);
      const h = Math.floor(world.heightAt(x,z));
      if (h>SEA+1 && h<CH-6) return new T.Vector3(x+0.5, h+1.2, z+0.5);
    }
  }
  return new T.Vector3(0.5, 80, 0.5);
}
function newWorld(){
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  location.reload();
}

/* ============================================================
   22. Input
   ============================================================ */
function requestLock(){ canvas.requestPointerLock && canvas.requestPointerLock(); }
canvas.addEventListener('mousedown', e=>{
  Audio2.resume();
  if (!document.pointerLockElement && !paused && !$('#invwrap').classList.contains('on')){ requestLock(); return; }
  mouse[e.button]=true;
  if (e.button===1){ pickBlock(); e.preventDefault(); }
  if (e.button===2 && target) { placeCooldown=0; tryPlace(); }
});
window.addEventListener('mouseup', e=>{ mouse[e.button]=false; });
window.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('mousemove', e=>{
  if (inv.held){ dragEl.style.left=(e.clientX-22)+'px'; dragEl.style.top=(e.clientY-22)+'px'; }
  if (document.pointerLockElement!==canvas) return;
  player.yaw   -= e.movementX*settings.sens;
  player.pitch -= e.movementY*settings.sens;
  player.pitch = clamp(player.pitch, -Math.PI/2+0.001, Math.PI/2-0.001);
});
document.addEventListener('pointerlockchange', ()=>{
  if (document.pointerLockElement!==canvas){
    mouse[0]=mouse[1]=mouse[2]=false;
    if (!paused && !$('#invwrap').classList.contains('on') && started) openMenu('pause');
  }
});
window.addEventListener('wheel', e=>{
  if ($('#invwrap').classList.contains('on') || paused) return;
  selectSlot(inv.sel + (e.deltaY>0?1:-1));
}, {passive:true});
window.addEventListener('keydown', e=>{
  if (e.code==='F3'){ $('#debug').classList.toggle('on'); e.preventDefault(); return; }
  if (e.repeat) return;
  keys[e.code]=true;
  const invOpen = $('#invwrap').classList.contains('on');
  if (e.code==='Escape'){
    if (invOpen){ closeInventory(); return; }
    if (paused){ if(player.alive) { closeMenu(); requestLock(); } }
    else openMenu('pause');
    return;
  }
  if (e.code==='KeyE'){ invOpen ? closeInventory() : openInventory(); return; }
  if (paused || invOpen) return;
  if (e.code.startsWith('Digit')){
    const n=+e.code.slice(5); if(n>=1&&n<=9) selectSlot(n-1);
  }
  if (e.code==='KeyQ') dropHeldStack(e.ctrlKey);
  if (e.code==='KeyF' && player.mode==='creative'){ player.fly=!player.fly; toast(player.fly?'Flying':'Walking'); }
  if (e.code==='KeyG'){
    player.mode = player.mode==='creative'?'survival':'creative';
    if (player.mode==='survival') player.fly=false; else buildPalette();
    $('#palettewrap') && ($('#palettewrap').style.display = player.mode==='creative'?'block':'none');
    toast(player.mode==='creative'?'Creative mode':'Survival mode');
    updateHUD();
  }
  if (e.code==='KeyM') toast(Audio2.toggle()?'Sound off':'Sound on');
  if (e.code==='Space'){
    // double-tap space to toggle flight in creative
    const now=performance.now();
    if (player.mode==='creative' && now-(player._lastSpace||0)<300){ player.fly=!player.fly; player.vel.y=0; }
    player._lastSpace=now;
  }
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; mouse[0]=mouse[1]=mouse[2]=false; });

function openInventory(){
  if (!player.alive) return;
  if (player.mode==='creative'){ buildPalette(); const w=$('#palettewrap'); if(w) w.style.display='block'; }
  else { const w=$('#palettewrap'); if(w) w.style.display='none'; }
  $('#invwrap').classList.add('on');
  refreshInv();
  if (document.pointerLockElement) document.exitPointerLock();
}
function closeInventory(){
  $('#invwrap').classList.remove('on');
  // return crafting grid + cursor to the inventory
  for (let i=0;i<9;i++){ const s=inv.craft[i]; if(s){ if(addItem(s.id,s.n)) spawnDropAtPlayer(s); inv.craft[i]=null; } }
  if (inv.held){ if(addItem(inv.held.id,inv.held.n)) spawnDropAtPlayer(inv.held); inv.held=null; }
  updateCraftOut(); refreshInv();
  if (!paused) requestLock();
}
function spawnDropAtPlayer(s){
  spawnDrop(player.pos.x, player.pos.y+1, player.pos.z, s.id, s.n, (Math.random()-.5)*3, 2.4, (Math.random()-.5)*3);
}

function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  vmCam.aspect=w/h; vmCam.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

/* ============================================================
   23. Main loop
   ============================================================ */
let started=false, lastT=performance.now(), fpsAcc=0, fpsN=0, fps=60, autosaveT=0;
let camShake=0;

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now-lastT)/1000; lastT=now;
  if (dt>0.1) dt=0.1;
  fpsAcc+=dt; fpsN++;
  if (fpsAcc>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }

  const active = started && !paused && !$('#invwrap').classList.contains('on');

  if (started){
    if (active){
      updatePlayer(dt);
      updateInteraction(dt);
    } else {
      // keep the world alive but frozen for the player
      player.swingActive=false;
    }
    chunks.update(player.pos.x, player.pos.z);
    chunks.work(performance.now()+7, player.pos.x, player.pos.z);
    updateDrops(dt, world, player, (id,n)=>{
      const left = addItem(id,n);
      if (left!==n){ Audio2.pickup(); toast('+'+(n-left)+' '+nameOf(id)); }
      return left;
    });
    updateParticles(dt, world);

    autosaveT+=dt;
    if (autosaveT>45){ autosaveT=0; saveGame(true); }

    // keep the health / air readout in sync
    const hudKey = player.hp+'|'+Math.ceil(player.air/player.maxAir*10)+'|'+(player.headInWater?1:0)+'|'+player.mode;
    if (hudKey!==frame._hud){ frame._hud=hudKey; updateHUD(); }
  }

  // camera
  const e = eyePos();
  const bobX = settings.bob ? Math.cos(player.bobT*2)*0.055*player.bobAmt : 0;
  const bobY = settings.bob ? Math.abs(Math.sin(player.bobT*2))*0.07*player.bobAmt : 0;
  camera.position.set(e.x, e.y+bobY, e.z);
  camera.rotation.order='YXZ';
  camera.rotation.set(player.pitch, player.yaw, bobX*0.35 + (player.hurtT>0?Math.sin(player.hurtT*60)*0.05:0));
  if (!player.alive){ camera.rotation.z = Math.min(1.2, player.deathT*1.6); camera.position.y = e.y - Math.min(0.9, player.deathT*1.4); }
  const targetFov = settings.fov * (player.sprint?1.09:1) * (player.fly&&player.sprint?1.06:1);
  camera.fov = lerp(camera.fov, targetFov, 1-Math.pow(0.002,dt));
  camera.updateProjectionMatrix();

  updateSky(dt);
  SHARED_UNIFORMS.uTime.value = now/1000;
  layoutViewModel(dt);

  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  if (vmMesh && started){
    vmCam.rotation.set(0,0,0);
    renderer.render(vmScene, vmCam);
  }

  if ($('#debug').classList.contains('on')) updateDebug();
}

function updateDebug(){
  const p=player.pos;
  const bx=Math.floor(p.x), by=Math.floor(p.y), bz=Math.floor(p.z);
  const b = world.biomeAt(bx,bz);
  const biome = b.t>0.22&&b.h<0.02 ? 'desert' : b.t<-0.24 ? 'snowy' : b.h>0.10 ? 'forest' : 'plains';
  const lookAt = target ? nameOf(target.id)+' @ '+target.x+','+target.y+','+target.z : '—';
  const tri = renderer.info.render.triangles;
  $('#debug').textContent =
`fps        ${fps.toFixed(0)}
xyz        ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}
chunk      ${bx>>4} ${bz>>4}   (${chunks.loadedCount} loaded)
biome      ${biome}
light      sky ${world.getSky(bx,by+1,bz)}  block ${world.getBlk(bx,by+1,bz)}
daylight   ${(SHARED_UNIFORMS.uDay.value*100).toFixed(0)}%   time ${(dayTime*24).toFixed(1)}h
looking    ${lookAt}
entities   ${drops.length} drops, ${particles.length} particles
tris       ${(tri/1000).toFixed(1)}k
mode       ${player.mode}${player.fly?' (flying)':''}`;
}

/* ============================================================
   24. Boot
   ============================================================ */
function giveStarterKit(){
  inv.slots[0]=newStack(TOOLIDS.wood_pickaxe,1);
  inv.slots[1]=newStack(TOOLIDS.wood_axe,1);
  inv.slots[2]=newStack(9,16);
  inv.slots[3]=newStack(24,8);
  inv.slots[4]=newStack(104,3);
}

const saved = loadGame();
if (saved) applySave(saved); else giveStarterKit();

onResize();
updateHUD();
refreshInv();
selectSlot(inv.sel);
updateViewModel();
$('#clock').textContent='';

if (!saved){
  const sp = findSpawn();
  player.pos.copy(sp);
}

// warm-up: build the chunks around the spawn before showing the world
let warm=0;
const WARM_TARGET = 42;
function warmup(){
  chunks.update(player.pos.x, player.pos.z);
  chunks.work(performance.now()+22, player.pos.x, player.pos.z);
  let ready=0;
  const ccx=Math.floor(player.pos.x/CS), ccz=Math.floor(player.pos.z/CS);
  for (let dz=-2;dz<=2;dz++) for(let dx=-2;dx<=2;dx++){
    const c=world.getChunk(ccx+dx,ccz+dz);
    if (c && c.meshes) ready++;
  }
  warm = Math.max(warm, Math.min(1, (world.chunks.size?ready/25:0)*0.75 + Math.min(1,chunks.loadedCount/WARM_TARGET)*0.25));
  $('#loadbar').style.width = (warm*100).toFixed(0)+'%';
  if (ready>=25 || warm>=0.99){
    // settle the player on open ground (not on a roof of leaves, not inside a trunk)
    if (!saved){
      const best = safeSpawnNear(player.pos.x, player.pos.z);
      if (best) player.pos.copy(best);
      else { let y=Math.floor(world.heightAt(player.pos.x,player.pos.z))+1;
             while (y<CH-3 && boxCollides(player.pos.x,y,player.pos.z)) y++;
             player.pos.y=y+0.05; }
    }
    started=true;
    $('#load').classList.add('done');
    setTimeout(()=>{ const l=$('#load'); if(l) l.style.display='none'; }, 700);
    toast('Click to play  ·  E for inventory  ·  Esc for the menu');
    return;
  }
  requestAnimationFrame(warmup);
}
requestAnimationFrame(warmup);
requestAnimationFrame(frame);

window.addEventListener('beforeunload', ()=>{ if(started) saveGame(true); });

// expose a tiny debug handle
window.VOXEL = {world, player, inv, chunks, scene, renderer, keys, mouse, mining,
  get target(){ return target; }, breakBlock, tryPlace, addItem, raycast, eyePos, lookDir, drops, particles,
  matchRecipe, updateCraftOut, takeCraftOutput, breakTime, updatePlayer, updateInteraction, BLOCKS, ITEMS, TOOLIDS,
  get dayTime(){ return dayTime; }, set dayTime(v){ dayTime=v; }};
};
