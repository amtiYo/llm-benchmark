<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Voxel Sandbox JS</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            canvas {
                display: block;
            }

            /* UI Overlay */
            #gui {
                position: absolute;
                top: 20px;
                left: 20px;
                color: white;
                text-shadow: 2px 2px 0px #000;
                pointer-events: none;
            }

            /* Inventory Bar */
            #hotbar {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                background: rgba(0, 0, 0, 0.5);
                padding: 10px;
                border-radius: 5px;
                border: 2px solid #fff;
            }
            .slot {
                width: 50px;
                height: 50px;
                border: 2px solid #888;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                background: #333;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }
            .slot.active {
                border-color: #fff;
                background: #666;
                box-shadow: 0 0 10px #fff;
            }
            .slot .count {
                position: absolute;
                bottom: 2px;
                right: 2px;
                font-size: 12px;
            }
            .block-preview {
                width: 30px;
                height: 30px;
            }

            #crosshair {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 20px;
                height: 20px;
                border: 2px solid white;
                border-radius: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

            #instructions {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 20px;
                text-align: center;
                border-radius: 10px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="gui">
            <div>WASD: Move | Space: Jump</div>
            <div>LMB: Mine | RMB: Build</div>
        </div>

        <div id="crosshair"></div>

        <div id="instructions">
            <h1>VOXEL SANDBOX</h1>
            <p>Click to Start</p>
            <p>(Esc to unlock mouse)</p>
        </div>

        <div id="hotbar">
            <!-- Slots generated by JS -->
        </div>

        <!-- Import Three.js and PointerLockControls -->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
            import { PointerLockControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

            /** CONFIGURATION **/
            const CHUNK_SIZE = 16;
            const RENDER_DISTANCE = 3;
            const BLOCK_SIZE = 1;
            const GRAVITY = 0.015;
            const JUMP_FORCE = 0.25;
            const PLAYER_SPEED = 0.12;
            const PLAYER_HEIGHT = 1.8;

            const BLOCK_TYPES = {
                DIRT: { id: 0, color: 0x8b4513, name: "Dirt" },
                GRASS: { id: 1, color: 0x4ea33c, name: "Grass" },
                STONE: { id: 2, color: 0x808080, name: "Stone" },
                WOOD: { id: 3, color: 0x5c4033, name: "Wood" },
            };

            /** NOISE FUNCTION (Simplified Perlin-like) **/
            class Noise {
                constructor() {
                    this.p = new Uint8Array(512);
                    for (let i = 0; i < 256; i++) this.p[i] = i;
                    for (let i = 255; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                    }
                    for (let i = 0; i < 256; i++) this.p[256 + i] = this.p[i];
                }
                fade(t) {
                    return t * t * t * (t * (t * 6 - 15) + 10);
                }
                lerp(t, a, b) {
                    return a + t * (b - a);
                }
                grad(hash, x, y, z) {
                    const h = hash & 15;
                    const u = h < 8 ? x : y;
                    const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
                }
                perlin(x, y, z) {
                    const X = Math.floor(x) & 255;
                    const Y = Math.floor(y) & 255;
                    const Z = Math.floor(z) & 255;
                    x -= Math.floor(x);
                    y -= Math.floor(y);
                    z -= Math.floor(z);
                    const u = this.fade(x),
                        v = this.fade(y),
                        w = this.fade(z);
                    const A = this.p[X] + Y,
                        AA = this.p[A] + Z,
                        AB = this.p[A + 1] + Z;
                    const B = this.p[X + 1] + Y,
                        BA = this.p[B] + Z,
                        BB = this.p[B + 1] + Z;
                    return this.lerp(
                        w,
                        this.lerp(
                            v,
                            this.lerp(
                                u,
                                this.grad(this.p[AA], x, y, z),
                                this.grad(this.p[BA], x - 1, y, z),
                            ),
                            this.lerp(
                                u,
                                this.grad(this.p[AB], x, y - 1, z),
                                this.grad(this.p[BB], x - 1, y - 1, z),
                            ),
                        ),
                        this.lerp(
                            v,
                            this.lerp(
                                u,
                                this.grad(this.p[AA + 1], x, y, z - 1),
                                this.grad(this.p[BA + 1], x - 1, y, z - 1),
                            ),
                            this.lerp(
                                u,
                                this.grad(this.p[AB + 1], x, y - 1, z - 1),
                                this.grad(this.p[BB + 1], x - 1, y - 1, z - 1),
                            ),
                        ),
                    );
                }
            }
            const worldNoise = new Noise();

            /** GAME STATE **/
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 20, 50);

            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000,
            );
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new PointerLockControls(camera, document.body);
            const instructions = document.getElementById("instructions");

            instructions.addEventListener("click", () => controls.lock());
            controls.addEventListener(
                "lock",
                () => (instructions.style.display = "none"),
            );
            controls.addEventListener(
                "unlock",
                () => (instructions.style.display = "block"),
            );

            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.9);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(10, 20, 10);
            scene.add(sunLight);

            // Player movement state
            let velocity = new THREE.Vector3();
            let canJump = false;
            const keys = {};
            document.addEventListener("keydown", (e) => (keys[e.code] = true));
            document.addEventListener("keyup", (e) => (keys[e.code] = false));

            // World Data
            const blocks = new Map(); // Key: "x,y,z", Value: Mesh
            const chunksLoaded = new Set();
            const itemDrops = [];
            const inventory = {
                0: 0, // Dirt
                1: 0, // Grass
                2: 0, // Stone
                3: 0, // Wood
            };
            let selectedSlot = 1;

            /** INVENTORY UI **/
            const hotbarEl = document.getElementById("hotbar");
            function initUI() {
                hotbarEl.innerHTML = "";
                Object.values(BLOCK_TYPES).forEach((type) => {
                    const slot = document.createElement("div");
                    slot.className = `slot ${selectedSlot === type.id ? "active" : ""}`;
                    slot.id = `slot-${type.id}`;
                    slot.innerHTML = `
                    <div class="block-preview" style="background-color: #${type.color.toString(16).padStart(6, "0")}"></div>
                    <div class="count" id="count-${type.id}">0</div>
                `;
                    slot.onclick = () => {
                        selectedSlot = type.id;
                        updateUI();
                    };
                    hotbarEl.appendChild(slot);
                });
            }

            function updateUI() {
                Object.values(BLOCK_TYPES).forEach((type) => {
                    const slot = document.getElementById(`slot-${type.id}`);
                    const count = document.getElementById(`count-${type.id}`);
                    slot.className = `slot ${selectedSlot === type.id ? "active" : ""}`;
                    count.innerText = inventory[type.id];
                });
            }

            /** WORLD GENERATION **/
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            function getMaterial(typeId) {
                const type = Object.values(BLOCK_TYPES).find(
                    (t) => t.id === typeId,
                );
                return new THREE.MeshLambertMaterial({ color: type.color });
            }

            function generateChunk(cx, cz) {
                const key = `${cx},${cz}`;
                if (chunksLoaded.has(key)) return;
                chunksLoaded.add(key);

                for (let x = 0; x < CHUNK_SIZE; x++) {
                    for (let z = 0; z < CHUNK_SIZE; z++) {
                        const worldX = cx * CHUNK_SIZE + x;
                        const worldZ = cz * CHUNK_SIZE + z;

                        // Heightmap based on noise
                        const h = Math.floor(
                            worldNoise.perlin(worldX * 0.05, 0, worldZ * 0.05) *
                                5 +
                                5,
                        );

                        for (let y = 0; y <= h; y++) {
                            let type = BLOCK_TYPES.STONE.id;
                            if (y === h) type = BLOCK_TYPES.GRASS.id;
                            else if (y > h - 3) type = BLOCK_TYPES.DIRT.id;

                            createBlock(worldX, y, worldZ, type);
                        }
                    }
                }
            }

            function createBlock(x, y, z, typeId) {
                const mesh = new THREE.Mesh(geometry, getMaterial(typeId));
                mesh.position.set(x, y, z);
                mesh.userData.typeId = typeId;
                scene.add(mesh);
                blocks.set(`${x},${y},${z}`, mesh);
            }

            /** INTERACTION **/
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(0, 0); // Center of screen

            window.addEventListener("mousedown", (e) => {
                if (!controls.isLocked) return;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(
                    Array.from(blocks.values()),
                );

                if (intersects.length > 0 && intersects[0].distance < 5) {
                    const hit = intersects[0];
                    const block = hit.object;

                    if (e.button === 0) {
                        // Left Click: Break
                        breakBlock(block);
                    } else if (e.button === 2) {
                        // Right Click: Build
                        placeBlock(hit);
                    }
                }
            });

            // Prevent context menu on right click
            window.addEventListener("contextmenu", (e) => e.preventDefault());

            function breakBlock(block) {
                const pos = block.position;
                const typeId = block.userData.typeId;

                // Spawn Drop
                spawnDrop(pos.x, pos.y, pos.z, typeId);

                // Remove from world
                scene.remove(block);
                blocks.delete(`${pos.x},${pos.y},${pos.z}`);
            }

            function placeBlock(hit) {
                const pos = hit.object.position;
                const normal = hit.face.normal;

                const newPos = new THREE.Vector3().addVectors(pos, normal);
                const typeId = selectedSlot;

                if (inventory[typeId] > 0) {
                    createBlock(newPos.x, newPos.y, newPos.z, typeId);
                    inventory[typeId]--;
                    updateUI();
                }
            }

            function spawnDrop(x, y, z, typeId) {
                const type = Object.values(BLOCK_TYPES).find(
                    (t) => t.id === typeId,
                );
                const dropGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const dropMat = new THREE.MeshLambertMaterial({
                    color: type.color,
                });
                const mesh = new THREE.Mesh(dropGeo, dropMat);

                mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
                mesh.userData.typeId = typeId;

                scene.add(mesh);
                itemDrops.push(mesh);
            }

            /** COLLISION SYSTEM **/
            function checkCollision(pos) {
                // Check corners of player bounding box
                const size = 0.3;
                const points = [
                    { x: pos.x - size, z: pos.z - size },
                    { x: pos.x + size, z: pos.z - size },
                    { x: pos.x - size, z: pos.z + size },
                    { x: pos.x + size, z: pos.z + size },
                ];

                for (let p of points) {
                    const bx = Math.round(p.x);
                    const bz = Math.round(p.z);
                    const by = Math.floor(pos.y - PLAYER_HEIGHT);
                    if (blocks.has(`${bx},${by},${bz}`)) return true;
                }
                return false;
            }

            /** GAME LOOP **/
            function update() {
                if (controls.isLocked) {
                    // Movement
                    const moveDir = new THREE.Vector3();
                    if (keys["KeyW"]) moveDir.z -= 1;
                    if (keys["KeyS"]) moveDir.z += 1;
                    if (keys["KeyA"]) moveDir.x -= 1;
                    if (keys["KeyD"]) moveDir.x += 1;
                    moveDir.normalize();

                    controls.moveRight(moveDir.x * PLAYER_SPEED);
                    controls.moveForward(-moveDir.z * PLAYER_SPEED);

                    // Simple Collision (Horizontal)
                    if (checkCollision(camera.position)) {
                        // Step back
                        controls.moveRight(-moveDir.x * PLAYER_SPEED);
                        controls.moveForward(moveDir.z * PLAYER_SPEED);
                    }

                    // Gravity & Jump
                    velocity.y -= GRAVITY;
                    camera.position.y += velocity.y;

                    // Ground Collision
                    const groundY = Math.floor(
                        camera.position.y - PLAYER_HEIGHT,
                    );
                    const bx = Math.round(camera.position.x);
                    const bz = Math.round(camera.position.z);

                    if (blocks.has(`${bx},${groundY},${bz}`)) {
                        camera.position.y = groundY + 1 + PLAYER_HEIGHT;
                        velocity.y = 0;
                        canJump = true;
                    } else {
                        canJump = false;
                    }

                    if (keys["Space"] && canJump) {
                        velocity.y = JUMP_FORCE;
                        canJump = false;
                    }
                }

                // Update Item Drops
                for (let i = itemDrops.length - 1; i >= 0; i--) {
                    const drop = itemDrops[i];

                    // Simple Gravity for drops
                    if (drop.position.y > 0) {
                        drop.position.y -= 0.02;
                        drop.rotation.y += 0.05;
                    }

                    // Pickup logic
                    const dist = drop.position.distanceTo(camera.position);
                    if (dist < 2) {
                        inventory[drop.userData.typeId]++;
                        updateUI();
                        scene.remove(drop);
                        itemDrops.splice(i, 1);
                    }
                }

                // Chunk loading
                const px = Math.floor(camera.position.x / CHUNK_SIZE);
                const pz = Math.floor(camera.position.z / CHUNK_SIZE);
                for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                    for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                        generateChunk(px + x, pz + z);
                    }
                }

                renderer.render(scene, camera);
                requestAnimationFrame(update);
            }

            // Init
            camera.position.set(8, 15, 8);
            initUI();
            update();

            // Handle Resize
            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
