<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before {
            top: 4px; left: 0; width: 10px; height: 2px;
        }
        #crosshair::after {
            top: 0; left: 4px; width: 2px; height: 10px;
        }

        #hotbar {
            display: flex;
            justify-content: center;
            gap: 6px;
            pointer-events: auto;
            margin-bottom: 10px;
        }

        .slot {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #555;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            font-weight: bold;
            font-size: 12px;
            transition: border-color 0.1s;
        }

        .slot.selected {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .slot .count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 11px;
            text-shadow: 1px 1px 1px #000;
        }

        .slot .icon {
            width: 28px;
            height: 28px;
            background-size: cover;
            image-rendering: pixelated;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            text-align: center;
        }

        #instructions h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #55ff55;
            text-shadow: 2px 2px #000;
        }

        #instructions p {
            font-size: 1.2rem;
            max-width: 500px;
            line-height: 1.6;
            color: #ddd;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #debug {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="debug">Loading...</div>
    <div id="crosshair"></div>
    <div id="ui">
        <div style="display:flex; justify-content:space-between;">
            <div id="stats" style="color:white; font-family:monospace; text-shadow:1px 1px #000;"></div>
        </div>
        <div id="hotbar"></div>
    </div>

    <div id="instructions">
        <h1>MINECRAFT 3D</h1>
        <p>
            <b>Click to Play</b><br><br>
            <b>W, A, S, D</b> - Move<br>
            <b>SPACE</b> - Jump<br>
            <b>LMB</b> - Break Block<br>
            <b>RMB</b> - Place Block<br>
            <b>1-9 or Scroll</b> - Select Hotbar Slot<br>
            <b>ESC</b> - Release Mouse
        </p>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Three.js and PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- PROCEDURAL TEXTURE GENERATOR ---
        function createPixelTexture(drawFunc) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            drawFunc(ctx);
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function noise2D(x, y) {
            // Simple pseudo-random hash noise for terrain
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        // Simple value noise implementation for smooth terrain hills
        function smoothNoise(x, z) {
            const intX = Math.floor(x), intZ = Math.floor(z);
            const fracX = x - intX, fracZ = z - intZ;
            
            const v1 = noise2D(intX, intZ);
            const v2 = noise2D(intX + 1, intZ);
            const v3 = noise2D(intX, intZ + 1);
            const v4 = noise2D(intX + 1, intZ + 1);

            const i1 = v1 * (1 - fracX) + v2 * fracX;
            const i2 = v3 * (1 - fracX) + v4 * fracX;
            return i1 * (1 - fracZ) + i2 * fracZ;
        }

        function getTerrainHeight(x, z) {
            let h = 0;
            h += smoothNoise(x * 0.03, z * 0.03) * 16;
            h += smoothNoise(x * 0.1, z * 0.1) * 4;
            h += smoothNoise(x * 0.005, z * 0.005) * 30;
            return Math.floor(h) + 10;
        }

        // Textures setup
        const textures = {};
        
        // Dirt
        textures.dirt = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#6e4c31' : '#9c704e';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Grass Top
        textures.grass_top = createPixelTexture(ctx => {
            ctx.fillStyle = '#5c9e31';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<45; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#4e8a29' : '#6ab339';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Grass Side
        textures.grass_side = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#6e4c31' : '#9c704e';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            // Grass green top overlay
            ctx.fillStyle = '#5c9e31';
            ctx.fillRect(0, 0, 16, 5);
            for(let x=0; x<16; x++) {
                if(Math.random() > 0.4) ctx.fillRect(x, 5, 1, 1);
                if(Math.random() > 0.7) ctx.fillRect(x, 6, 1, 1);
            }
        });

        // Stone
        textures.stone = createPixelTexture(ctx => {
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<50; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#666666' : '#999999';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Wood Side
        textures.wood_side = createPixelTexture(ctx => {
            ctx.fillStyle = '#6e4b28';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#54371b';
            for(let y=0; y<16; y+=3) {
                ctx.fillRect(0, y, 16, 1);
            }
            for(let i=0; i<20; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#432a13' : '#7d5630';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Wood Top
        textures.wood_top = createPixelTexture(ctx => {
            ctx.fillStyle = '#b58953';
            ctx.fillRect(0, 0, 16, 16);
            ctx.strokeStyle = '#8c6339';
            ctx.strokeRect(3, 3, 10, 10);
            ctx.fillStyle = '#9c7247';
            ctx.fillRect(6, 6, 4, 4);
        });

        // Leaves
        textures.leaves = createPixelTexture(ctx => {
            ctx.fillStyle = '#327019';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<60; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#245211' : '#418f22';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Sand
        textures.sand = createPixelTexture(ctx => {
            ctx.fillStyle = '#dcd49b';
            ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#c4bc85' : '#ede5af';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
        });

        // Block definitions
        const BLOCK = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD: 4,
            LEAVES: 5,
            SAND: 6
        };

        const BLOCK_NAMES = {
            1: "Grass Block",
            2: "Dirt",
            3: "Stone",
            4: "Wood Log",
            5: "Leaves",
            6: "Sand"
        };

        const BLOCK_MATERIALS = {
            1: [
                new THREE.MeshLambertMaterial({ map: textures.grass_side }), // right
                new THREE.MeshLambertMaterial({ map: textures.grass_side }), // left
                new THREE.MeshLambertMaterial({ map: textures.grass_top }),  // top
                new THREE.MeshLambertMaterial({ map: textures.dirt }),       // bottom
                new THREE.MeshLambertMaterial({ map: textures.grass_side }), // front
                new THREE.MeshLambertMaterial({ map: textures.grass_side })  // back
            ],
            2: new THREE.MeshLambertMaterial({ map: textures.dirt }),
            3: new THREE.MeshLambertMaterial({ map: textures.stone }),
            4: [
                new THREE.MeshLambertMaterial({ map: textures.wood_side }),
                new THREE.MeshLambertMaterial({ map: textures.wood_side }),
                new THREE.MeshLambertMaterial({ map: textures.wood_top }),
                new THREE.MeshLambertMaterial({ map: textures.wood_top }),
                new THREE.MeshLambertMaterial({ map: textures.wood_side }),
                new THREE.MeshLambertMaterial({ map: textures.wood_side })
            ],
            5: new THREE.MeshLambertMaterial({ map: textures.leaves, transparent: true, opacity: 0.95 }),
            6: new THREE.MeshLambertMaterial({ map: textures.sand })
        };

        // --- GAME STATE ---
        const CHUNK_SIZE = 16;
        const CHUNK_HEIGHT = 64;
        const RENDER_DISTANCE = 3; // radius in chunks

        const chunks = new Map(); // key: "x,z", value: { data: Uint8Array, mesh: THREE.Mesh }
        const drops = []; // active dropped item entities
        
        let inventory = {
            1: { type: 1, count: 64 }, // Grass
            2: { type: 2, count: 64 }, // Dirt
            3: { type: 3, count: 64 }, // Stone
            4: { type: 4, count: 32 }, // Wood
            5: { type: 5, count: 32 }, // Leaves
            6: { type: 6, count: 32 }, // Sand
            7: { type: 0, count: 0 },
            8: { type: 0, count: 0 },
            9: { type: 0, count: 0 }
        };
        let selectedSlot = 1;

        // Setup Three.js Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8cb8ff);
        scene.fog = new THREE.FogExp2(0x8cb8ff, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Controls
        const controls = new THREE.PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            instructions.style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            instructions.style.display = 'flex';
        });

        scene.add(controls.getObject());

        // --- WORLD GENERATION LOGIC ---
        function getChunkKey(cx, cz) {
            return `${cx},${cz}`;
        }

        function generateChunkData(cx, cz) {
            const data = new Uint8Array(CHUNK_SIZE * CHUNK_HEIGHT * CHUNK_SIZE);
            
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const worldX = cx * CHUNK_SIZE + x;
                    const worldZ = cz * CHUNK_SIZE + z;
                    const height = getTerrainHeight(worldX, worldZ);

                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        const index = (y * CHUNK_SIZE + z) * CHUNK_SIZE + x;
                        if (y === 0) {
                            data[index] = BLOCK.STONE; // Bedrock/bottom
                        } else if (y < height - 4) {
                            data[index] = BLOCK.STONE;
                        } else if (y < height) {
                            data[index] = height < 14 ? BLOCK.SAND : BLOCK.DIRT;
                        } else if (y === height) {
                            data[index] = height < 14 ? BLOCK.SAND : BLOCK.GRASS;
                        }
                    }

                    // Simple tree generation on grass
                    if (height >= 14 && noise2D(worldX * 1.5, worldZ * 1.5) > 0.88) {
                        const treeHeight = 4 + Math.floor(noise2D(worldX, worldZ) * 3);
                        // check if within chunk bounds for simplicity or generate
                        if (x >= 2 && x < CHUNK_SIZE - 2 && z >= 2 && z < CHUNK_SIZE - 2) {
                            for (let ty = 0; ty < treeHeight; ty++) {
                                const wy = height + 1 + ty;
                                const idx = (wy * CHUNK_SIZE + z) * CHUNK_SIZE + x;
                                data[idx] = BLOCK.WOOD;
                            }
                            // Leaves crown
                            for (let ly = height + treeHeight - 2; ly <= height + treeHeight + 1; ly++) {
                                for (let lx = x - 2; lx <= x + 2; lx++) {
                                    for (let lz = z - 2; lz <= z + 2; lz++) {
                                        if (Math.abs(lx - x) === 2 && Math.abs(lz - z) === 2 && ly === height + treeHeight + 1) continue;
                                        const lIndex = (ly * CHUNK_SIZE + lz) * CHUNK_SIZE + lx;
                                        if (data[lIndex] === BLOCK.AIR) {
                                            data[lIndex] = BLOCK.LEAVES;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return data;
        }

        function getBlock(wx, wy, wz) {
            if (wy < 0 || wy >= CHUNK_HEIGHT) return BLOCK.AIR;
            const cx = Math.floor(wx / CHUNK_SIZE);
            const cz = Math.floor(wz / CHUNK_SIZE);
            const chunk = chunks.get(getChunkKey(cx, cz));
            if (!chunk) return BLOCK.AIR;

            const lx = ((wx % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            const lz = ((wz % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            const index = (wy * CHUNK_SIZE + lz) * CHUNK_SIZE + lx;
            return chunk.data[index];
        }

        function setBlock(wx, wy, wz, blockType) {
            if (wy < 0 || wy >= CHUNK_HEIGHT) return;
            const cx = Math.floor(wx / CHUNK_SIZE);
            const cz = Math.floor(wz / CHUNK_SIZE);
            let chunk = chunks.get(getChunkKey(cx, cz));
            if (!chunk) return;

            const lx = ((wx % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            const lz = ((wz % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            const index = (wy * CHUNK_SIZE + lz) * CHUNK_SIZE + lx;
            chunk.data[index] = blockType;
            rebuildChunkMesh(cx, cz);

            // Rebuild neighboring chunks if block is on boundary
            if (lx === 0) rebuildChunkMesh(cx - 1, cz);
            if (lx === CHUNK_SIZE - 1) rebuildChunkMesh(cx + 1, cz);
            if (lz === 0) rebuildChunkMesh(cx, cz - 1);
            if (lz === CHUNK_SIZE - 1) rebuildChunkMesh(cx, cz + 1);
        }

        // Optimized Chunk Meshing
        const geometryCache = new Map();
        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

        function rebuildChunkMesh(cx, cz) {
            const key = getChunkKey(cx, cz);
            const chunk = chunks.get(key);
            if (!chunk) return;

            if (chunk.mesh) {
                scene.remove(chunk.mesh);
                chunk.mesh.geometry.dispose();
            }

            const geometries = [];

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        const index = (y * CHUNK_SIZE + z) * CHUNK_SIZE + x;
                        const block = chunk.data[index];
                        if (block === BLOCK.AIR) continue;

                        // Check if block is fully occluded
                        const wx = cx * CHUNK_SIZE + x;
                        const wz = cz * CHUNK_SIZE + z;
                        
                        const hasTop = getBlock(wx, y + 1, wz) !== BLOCK.AIR;
                        const hasBottom = getBlock(wx, y - 1, wz) !== BLOCK.AIR;
                        const hasRight = getBlock(wx + 1, y, wz) !== BLOCK.AIR;
                        const hasLeft = getBlock(wx - 1, y, wz) !== BLOCK.AIR;
                        const hasFront = getBlock(wx, y, wz + 1) !== BLOCK.AIR;
                        const hasBack = getBlock(wx, y, wz - 1) !== BLOCK.AIR;

                        if (hasTop && hasBottom && hasRight && hasLeft && hasFront && hasBack && block !== BLOCK.LEAVES) {
                            continue; // occluded
                        }

                        const matrix = new THREE.Matrix4().makeTranslation(wx + 0.5, y + 0.5, wz + 0.5);
                        
                        // We can group by block material or use instanced meshes, but merging geometry per block type or standard instancing is great.
                        // For simplicity & robustness with multi-materials (like grass), we can add single cubes or group them efficiently.
                        // Let's create individual meshes or merge. Since r128 makes instancing easy, let's do group or simple single meshes per chunk via BufferGeometry.
                    }
                }
            }

            // Using standard individual meshes or merged buffer geometry for chunk blocks:
            // To make it super performant, let's build merged geometries per block material in the chunk!
            const materialGroups = {};

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        const index = (y * CHUNK_SIZE + z) * CHUNK_SIZE + x;
                        const block = chunk.data[index];
                        if (block === BLOCK.AIR) continue;

                        const wx = cx * CHUNK_SIZE + x;
                        const wz = cz * CHUNK_SIZE + z;

                        // Cull interior blocks except leaves
                        if (block !== BLOCK.LEAVES) {
                            if (getBlock(wx, y+1, wz) !== BLOCK.AIR &&
                                getBlock(wx, y-1, wz) !== BLOCK.AIR &&
                                getBlock(wx+1, y, wz) !== BLOCK.AIR &&
                                getBlock(wx-1, y, wz) !== BLOCK.AIR &&
                                getBlock(wx, y, wz+1) !== BLOCK.AIR &&
                                getBlock(wx, y, wz-1) !== BLOCK.AIR) {
                                continue;
                            }
                        }

                        if (!materialGroups[block]) materialGroups[block] = [];
                        
                        const mesh = new THREE.Mesh(cubeGeo, BLOCK_MATERIALS[block]);
                        mesh.position.set(wx + 0.5, y + 0.5, wz + 0.5);
                        mesh.updateMatrix();
                        materialGroups[block].push(mesh.matrix.clone());
                    }
                }
            }

            const chunkGroup = new THREE.Group();
            for (const [blockType, matrices] of Object.entries(materialGroups)) {
                const instancedMesh = new THREE.InstancedMesh(cubeGeo, BLOCK_MATERIALS[blockType], matrices.length);
                instancedMesh.castShadow = true;
                instancedMesh.receiveShadow = true;
                for (let i = 0; i < matrices.length; i++) {
                    instancedMesh.setMatrixAt(i, matrices[i]);
                }
                instancedMesh.instanceMatrix.needsUpdate = true;
                chunkGroup.add(instancedMesh);
            }

            chunk.mesh = chunkGroup;
            scene.add(chunkGroup);
        }

        function loadChunksAroundPlayer() {
            const pPos = controls.getObject().position;
            const pcx = Math.floor(pPos.x / CHUNK_SIZE);
            const pcz = Math.floor(pPos.z / CHUNK_SIZE);

            const activeChunks = new Set();

            for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                    const cx = pcx + x;
                    const cz = pcz + z;
                    const key = getChunkKey(cx, cz);
                    activeChunks.add(key);

                    if (!chunks.has(key)) {
                        const data = generateChunkData(cx, cz);
                        chunks.set(key, { data, mesh: null });
                        rebuildChunkMesh(cx, cz);
                    }
                }
            }

            // Remove far chunks
            for (const [key, chunk] of chunks.entries()) {
                if (!activeChunks.has(key)) {
                    if (chunk.mesh) {
                        scene.remove(chunk.mesh);
                        chunk.mesh.geometry.dispose();
                    }
                    chunks.delete(key);
                }
            }
        }

        // --- DROPS & INVENTORY ---
        function spawnDrop(wx, wy, wz, blockType) {
            const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const material = BLOCK_MATERIALS[blockType];
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(wx + 0.5, wy + 0.5, wz + 0.5);
            scene.add(mesh);

            drops.push({
                mesh: mesh,
                type: blockType,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 4 + 2,
                    (Math.random() - 0.5) * 4
                ),
                age: 0
            });
        }

        function updateDrops(delta) {
            const pPos = controls.getObject().position;

            for (let i = drops.length - 1; i >= 0; i--) {
                const drop = drops[i];
                drop.age += delta;

                // Physics
                drop.velocity.y -= 15 * delta;
                drop.mesh.position.addScaledVector(drop.velocity, delta);
                drop.mesh.rotation.x += delta * 2;
                drop.mesh.rotation.y += delta * 3;

                // Terrain collision on drop
                const b = getBlock(Math.floor(drop.mesh.position.x), Math.floor(drop.mesh.position.y - 0.2), Math.floor(drop.mesh.position.z));
                if (b !== BLOCK.AIR) {
                    drop.mesh.position.y = Math.floor(drop.mesh.position.y - 0.2) + 1.15;
                    drop.velocity.y = -drop.velocity.y * 0.3; // bounce
                    drop.velocity.x *= 0.8;
                    drop.velocity.z *= 0.8;
                }

                // Distance to player for pickup
                const dist = drop.mesh.position.distanceTo(pPos);
                if (dist < 2.2) {
                    // Add to inventory
                    addToInventory(drop.type);
                    scene.remove(drop.mesh);
                    drop.mesh.geometry.dispose();
                    drops.splice(i, 1);
                } else if (dist < 5.0) {
                    // Magnet towards player
                    const dir = new THREE.Vector3().subVectors(pPos, drop.mesh.position).normalize();
                    drop.velocity.addScaledVector(dir, 15 * delta);
                }

                if (drop.age > 300) { // Despawn after 5 mins
                    scene.remove(drop.mesh);
                    drop.mesh.geometry.dispose();
                    drops.splice(i, 1);
                }
            }
        }

        function addToInventory(blockType) {
            // Find slot with same type or empty slot
            for (let i = 1; i <= 9; i++) {
                if (inventory[i].type === blockType && inventory[i].count < 99) {
                    inventory[i].count++;
                    updateHotbarUI();
                    return;
                }
            }
            for (let i = 1; i <= 9; i++) {
                if (inventory[i].type === 0 || inventory[i].count === 0) {
                    inventory[i].type = blockType;
                    inventory[i].count = 1;
                    updateHotbarUI();
                    return;
                }
            }
        }

        function updateHotbarUI() {
            const hotbarEl = document.getElementById('hotbar');
            hotbarEl.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const slot = inventory[i];
                const slotEl = document.createElement('div');
                slotEl.className = `slot ${i === selectedSlot ? 'selected' : ''}`;
                slotEl.innerHTML = `
                    <span style="position:absolute; top:2px; left:4px; font-size:10px; color:#aaa;">${i}</span>
                    ${slot.type !== 0 ? `<div class="icon" style="background-color: #777;"></div><span class="count">${slot.count}</span>` : ''}
                `;
                hotbarEl.appendChild(slotEl);
            }
        }

        // --- PLAYER CONTROLS & COLLISION ---
        const moveState = { forward: false, backward: false, left: false, right: false, jump: false };
        let velocity = new THREE.Vector3();
        let canJump = false;
        const playerHeight = 1.6;
        const playerRadius = 0.3;

        window.addEventListener('keydown', (e) => {
            if (!controls.isLocked) return;
            switch(e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'Space': if (canJump) { velocity.y = 8; canJump = false; } break;
                case 'Digit1': selectedSlot = 1; updateHotbarUI(); break;
                case 'Digit2': selectedSlot = 2; updateHotbarUI(); break;
                case 'Digit3': selectedSlot = 3; updateHotbarUI(); break;
                case 'Digit4': selectedSlot = 4; updateHotbarUI(); break;
                case 'Digit5': selectedSlot = 5; updateHotbarUI(); break;
                case 'Digit6': selectedSlot = 6; updateHotbarUI(); break;
                case 'Digit7': selectedSlot = 7; updateHotbarUI(); break;
                case 'Digit8': selectedSlot = 8; updateHotbarUI(); break;
                case 'Digit9': selectedSlot = 9; updateHotbarUI(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
            }
        });

        window.addEventListener('wheel', (e) => {
            if (!controls.isLocked) return;
            if (e.deltaY > 0) {
                selectedSlot = selectedSlot % 9 + 1;
            } else {
                selectedSlot = (selectedSlot - 2 + 9) % 9 + 1;
            }
            updateHotbarUI();
        });

        function checkCollision(pos) {
            const x = Math.floor(pos.x);
            const y = Math.floor(pos.y);
            const z = Math.floor(pos.z);

            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -2; dy <= 0; dy++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        const bx = x + dx;
                        const by = y + dy;
                        const bz = z + dz;
                        if (getBlock(bx, by, bz) !== BLOCK.AIR) {
                            // AABB check
                            if (pos.x + playerRadius > bx && pos.x - playerRadius < bx + 1 &&
                                pos.y > by && pos.y - playerHeight < by + 1 &&
                                pos.z + playerRadius > bz && pos.z - playerRadius < bz + 1) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        function updatePlayer(delta) {
            const pObj = controls.getObject();

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 25.0 * delta; // gravity

            const speed = 15.0;
            const direction = new THREE.Vector3();
            if (moveState.forward) direction.z += 1;
            if (moveState.backward) direction.z -= 1;
            if (moveState.left) direction.x -= 1;
            if (moveState.right) direction.x += 1;
            direction.normalize();

            if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta * 10;
            if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta * 10;

            // Move X
            pObj.translateX(-velocity.x * delta);
            if (checkCollision(pObj.position)) {
                pObj.translateX(velocity.x * delta);
                velocity.x = 0;
            }

            // Move Z
            pObj.translateZ(velocity.z * delta);
            if (checkCollision(pObj.position)) {
                pObj.translateZ(-velocity.z * delta);
                velocity.z = 0;
            }

            // Move Y
            pObj.position.y += velocity.y * delta;
            if (checkCollision(pObj.position)) {
                pObj.position.y -= velocity.y * delta;
                if (velocity.y < 0) {
                    canJump = true;
                }
                velocity.y = 0;
            }

            // Fall out of world safeguard
            if (pObj.position.y < -20) {
                pObj.position.set(0, 50, 0);
                velocity.set(0, 0, 0);
            }
        }

        // --- INTERACTION (MINING & PLACING) ---
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6.0;

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Collect all chunk meshes for raycasting
            const intersectObjects = [];
            for (const chunk of chunks.values()) {
                if (chunk.mesh) intersectObjects.push(chunk.mesh);
            }

            const intersects = raycaster.intersectObjects(intersectObjects, true);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const position = new THREE.Vector3().copy(intersect.point).addScaledVector(intersect.face.normal, -0.5);
                const wx = Math.floor(position.x);
                const wy = Math.floor(position.y);
                const wz = Math.floor(position.z);

                if (e.button === 0) {
                    // LMB: Break Block
                    const blockType = getBlock(wx, wy, wz);
                    if (blockType !== BLOCK.AIR) {
                        setBlock(wx, wy, wz, BLOCK.AIR);
                        spawnDrop(wx, wy, wz, blockType);
                    }
                } else if (e.button === 2) {
                    // RMB: Place Block
                    const slot = inventory[selectedSlot];
                    if (slot.type !== 0 && slot.count > 0) {
                        const placePos = new THREE.Vector3().copy(intersect.point).addScaledVector(intersect.face.normal, 0.5);
                        const pwx = Math.floor(placePos.x);
                        const pwy = Math.floor(placePos.y);
                        const pwz = Math.floor(placePos.z);

                        // Check if placement intersects player position
                        const pPos = controls.getObject().position;
                        const playerBox = new THREE.Box3(
                            new THREE.Vector3(pPos.x - playerRadius, pPos.y - playerHeight, pPos.z - playerRadius),
                            new THREE.Vector3(pPos.x + playerRadius, pPos.y, pPos.z + playerRadius)
                        );
                        const blockBox = new THREE.Box3(
                            new THREE.Vector3(pwx, pwy, pwz),
                            new THREE.Vector3(pwx + 1, pwy + 1, pwz + 1)
                        );

                        if (!playerBox.intersectsBox(blockBox)) {
                            setBlock(pwx, pwy, pwz, slot.type);
                            slot.count--;
                            if (slot.count === 0) {
                                slot.type = 0;
                            }
                            updateHotbarUI();
                        }
                    }
                }
            }
        });

        // Prevent context menu on RMB
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- INITIALIZATION ---
        // Spawn player on top of terrain at center
        const spawnX = 0;
        const spawnZ = 0;
        const spawnY = getTerrainHeight(spawnX, spawnZ) + 3;
        controls.getObject().position.set(spawnX, spawnY, spawnZ);

        loadChunksAroundPlayer();
        updateHotbarUI();

        // --- GAME LOOP ---
        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = 0;

        function animate(now) {
            requestAnimationFrame(animate);

            const delta = (now - lastTime) / 1000;
            lastTime = now;

            frameCount++;
            if (now - lastFpsUpdate > 1000) {
                document.getElementById('debug').innerText = `FPS: ${frameCount} | Chunks: ${chunks.size} | Pos: ${Math.floor(controls.getObject().position.x)}, ${Math.floor(controls.getObject().position.y)}, ${Math.floor(controls.getObject().position.z)}`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            if (controls.isLocked) {
                updatePlayer(delta);
                loadChunksAroundPlayer();
                updateDrops(delta);
            }

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
