<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: white;
            transform: translate(-50%, -50%);
        }

        #hud-top {
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-size: 16px;
            font-weight: bold;
        }

        #inventory-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            pointer-events: auto;
        }

        .slot {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #3c3c3c;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            box-sizing: border-box;
            transition: border-color 0.1s;
        }

        .slot.selected {
            border-color: #ffffff;
            background: rgba(50, 50, 50, 0.6);
            transform: scale(1.05);
        }

        .slot-icon {
            width: 24px;
            height: 24px;
            background-size: cover;
            margin-bottom: 2px;
        }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
        }

        .slot-num {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            text-align: center;
        }

        #instructions h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #55ff55;
            text-shadow: 3px 3px 0px #000;
        }

        #instructions p {
            font-size: 18px;
            max-width: 600px;
            line-height: 1.5;
            color: #ddd;
            margin: 5px 0;
        }

        #instructions .btn {
            margin-top: 30px;
            background: #3c8527;
            color: white;
            border: 2px solid #55ff55;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #1b3d11;
            border-radius: 4px;
        }

        #instructions .btn:hover {
            background: #4ca633;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="crosshair"></div>
    <div id="ui">
        <div id="hud-top">
            <div id="fps">FPS: 60</div>
            <div id="coords">X: 0 Y: 0 Z: 0</div>
        </div>
        <div id="inventory-bar"></div>
    </div>

    <div id="instructions">
        <h1>MINECRAFT 3D</h1>
        <p><b>WASD</b> to Move | <b>Space</b> to Jump | <b>Mouse</b> to Look Around</p>
        <p><b>Left Click</b> to Break Block | <b>Right Click</b> to Place Block</p>
        <p><b>1-9</b> or <b>Scroll</b> to Select Inventory Slot</p>
        <button class="btn" id="start-btn">PLAY GAME</button>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Simplex Noise for procedural terrain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script>
        // --- CONSTANTS & CONFIG ---
        const CHUNK_SIZE = 16;
        const CHUNK_HEIGHT = 64;
        const VIEW_DISTANCE = 3; // Chunks radius

        const BLOCK = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD: 4,
            LEAVES: 5,
            SAND: 6
        };

        const BLOCK_NAMES = {
            [BLOCK.GRASS]: 'Grass',
            [BLOCK.DIRT]: 'Dirt',
            [BLOCK.STONE]: 'Stone',
            [BLOCK.WOOD]: 'Wood',
            [BLOCK.LEAVES]: 'Leaves',
            [BLOCK.SAND]: 'Sand'
        };

        const BLOCK_COLORS = {
            [BLOCK.GRASS]: 0x559944,
            [BLOCK.DIRT]: 0x8b5a2b,
            [BLOCK.STONE]: 0x888888,
            [BLOCK.WOOD]: 0x6e4723,
            [BLOCK.LEAVES]: 0x2e6b2e,
            [BLOCK.SAND]: 0xd2b48c
        };

        // --- GAME STATE ---
        let scene, camera, renderer;
        let simplex = new SimplexNoise();
        let chunks = new Map();
        let drops = [];
        let inventory = {
            [BLOCK.GRASS]: 10,
            [BLOCK.DIRT]: 10,
            [BLOCK.STONE]: 10,
            [BLOCK.WOOD]: 5,
            [BLOCK.LEAVES]: 5,
            [BLOCK.SAND]: 5
        };
        let hotbar = [BLOCK.GRASS, BLOCK.DIRT, BLOCK.STONE, BLOCK.WOOD, BLOCK.LEAVES, BLOCK.SAND];
        let selectedSlot = 0;

        // Player physics & state
        let player = {
            position: new THREE.Vector3(0, 40, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            radius: 0.3,
            height: 1.6,
            onGround: false,
            speed: 4.5,
            jumpForce: 7.5
        };

        let moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false
        };

        let isLocked = false;
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let raycaster = new THREE.Raycaster();
        let clock = new THREE.Clock();

        // Shared materials and geometries for performance
        let blockMaterials = {};
        let blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        // --- INITIALIZATION ---
        function init() {
            const canvas = document.getElementById('canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            // Create materials
            for (let id in BLOCK_COLORS) {
                blockMaterials[id] = new THREE.MeshLambertMaterial({ color: BLOCK_COLORS[id] });
            }

            setupControls();
            buildInventoryUI();

            // Find initial player spawn height
            player.position.y = getTerrainHeight(0, 0) + 3;

            // Generate initial chunks
            updateChunks(true);

            // Events
            window.addEventListener('resize', onWindowResize);

            // Start loop
            requestAnimationFrame(animate);
        }

        // --- PROCEDURAL GENERATION ---
        function getTerrainHeight(x, z) {
            let h1 = simplex.noise2D(x * 0.005, z * 0.005) * 20;
            let h2 = simplex.noise2D(x * 0.02, z * 0.02) * 5;
            return Math.floor(15 + h1 + h2);
        }

        function generateChunkData(cx, cz) {
            let data = new Uint8Array(CHUNK_SIZE * CHUNK_HEIGHT * CHUNK_SIZE);
            
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let worldX = cx * CHUNK_SIZE + x;
                    let worldZ = cz * CHUNK_SIZE + z;
                    let terrainHeight = getTerrainHeight(worldX, worldZ);

                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        let index = x + y * CHUNK_SIZE + z * CHUNK_SIZE * CHUNK_HEIGHT;
                        if (y < terrainHeight - 4) {
                            data[index] = BLOCK.STONE;
                        } else if (y < terrainHeight) {
                            data[index] = BLOCK.DIRT;
                        } else if (y === terrainHeight) {
                            data[index] = (terrainHeight < 12) ? BLOCK.SAND : BLOCK.GRASS;
                        } else {
                            data[index] = BLOCK.AIR;
                        }
                    }
                }
            }

            // Simple tree generation on surface
            for (let x = 2; x < CHUNK_SIZE - 2; x += 4) {
                for (let z = 2; z < CHUNK_SIZE - 2; z += 4) {
                    let worldX = cx * CHUNK_SIZE + x;
                    let worldZ = cz * CHUNK_SIZE + z;
                    let h = getTerrainHeight(worldX, worldZ);
                    
                    // Pseudo random check for trees
                    let rnd = Math.abs(Math.sin(worldX * 12.9898 + worldZ * 78.233)) * 43758.5453;
                    rnd = rnd - Math.floor(rnd);

                    if (rnd < 0.05 && h > 12 && h < 35) {
                        // Build tree
                        let treeHeight = 4 + Math.floor(rnd * 3);
                        // Trunk
                        for (let ty = 0; ty < treeHeight; ty++) {
                            let ly = h + 1 + ty;
                            if (ly < CHUNK_HEIGHT) {
                                let idx = x + ly * CHUNK_SIZE + z * CHUNK_SIZE * CHUNK_HEIGHT;
                                data[idx] = BLOCK.WOOD;
                            }
                        }
                        // Leaves
                        for (let ly = h + treeHeight - 1; ly <= h + treeHeight + 1; ly++) {
                            for (let lx = x - 2; lx <= x + 2; lx++) {
                                for (let lz = z - 2; lz <= z + 2; lz++) {
                                    if (lx >= 0 && lx < CHUNK_SIZE && lz >= 0 && lz < CHUNK_SIZE && ly < CHUNK_HEIGHT) {
                                        let dist = Math.abs(lx - x) + Math.abs(lz - z) + Math.abs(ly - (h + treeHeight));
                                        if (dist <= 3) {
                                            let idx = lx + ly * CHUNK_SIZE + lz * CHUNK_SIZE * CHUNK_HEIGHT;
                                            if (data[idx] === BLOCK.AIR) {
                                                data[idx] = BLOCK.LEAVES;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            return data;
        }

        function createChunkMesh(cx, cz, data) {
            let geometries = {};

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let y = 0; y < CHUNK_HEIGHT; y++) {
                    for (let z = 0; z < CHUNK_SIZE; z++) {
                        let idx = x + y * CHUNK_SIZE + z * CHUNK_SIZE * CHUNK_HEIGHT;
                        let blockId = data[idx];
                        if (blockId === BLOCK.AIR) continue;

                        // Check neighbors for occlusion
                        let show = false;
                        let neighbors = [
                            {x: 1, y: 0, z: 0}, {x: -1, y: 0, z: 0},
                            {x: 0, y: 1, z: 0}, {x: 0, y: -1, z: 0},
                            {x: 0, y: 0, z: 1}, {x: 0, y: 0, z: -1}
                        ];

                        for (let n of neighbors) {
                            let nx = x + n.x;
                            let ny = y + n.y;
                            let nz = z + n.z;
                            
                            if (nx < 0 || nx >= CHUNK_SIZE || ny < 0 || ny >= CHUNK_HEIGHT || nz < 0 || nz >= CHUNK_SIZE) {
                                show = true; // Border with other chunks, assume visible for simplicity or check global
                            } else {
                                let nIdx = nx + ny * CHUNK_SIZE + nz * CHUNK_SIZE * CHUNK_HEIGHT;
                                if (data[nIdx] === BLOCK.AIR) {
                                    show = true;
                                }
                            }
                            if (show) break;
                        }

                        if (show) {
                            if (!geometries[blockId]) geometries[blockId] = [];
                            
                            let matrix = new THREE.Matrix4().makeTranslation(
                                cx * CHUNK_SIZE + x + 0.5,
                                y + 0.5,
                                cz * CHUNK_SIZE + z + 0.5
                            );
                            
                            // We can use InstancedMesh or merge. For simplicity and great compatibility, let's create boxes or use merged geometry. 
                            // Actually, standard boxes merged per chunk material is standard and performant for basic engines.
                        }
                    }
                }
            }

            // Using standard individual meshes or merged. Let's use simple InstancedMesh or group of boxes if count is low, 
            // but for performance, Three.js InstancedMesh per block type per chunk is fantastic.
            
            let chunkGroup = new THREE.Group();
            chunkGroup.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);

            // Count blocks per type
            let counts = {};
            for (let i = 0; i < data.length; i++) {
                let id = data[i];
                if (id !== BLOCK.AIR) counts[id] = (counts[id] || 0) + 1;
            }

            for (let id in counts) {
                let count = counts[id];
                let instancedMesh = new THREE.InstancedMesh(blockGeometry, blockMaterials[id], count);
                let dummy = new THREE.Object3D();
                let index = 0;

                for (let x = 0; x < CHUNK_SIZE; x++) {
                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        for (let z = 0; z < CHUNK_SIZE; z++) {
                            let idx = x + y * CHUNK_SIZE + z * CHUNK_SIZE * CHUNK_HEIGHT;
                            if (data[idx] == id) {
                                dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
                                dummy.updateMatrix();
                                instancedMesh.setMatrixAt(index++, dummy.matrix);
                            }
                        }
                    }
                }
                instancedMesh.instanceMatrix.needsUpdate = true;
                chunkGroup.add(instancedMesh);
            }

            return chunkGroup;
        }

        // Global world lookup helpers
        function getBlock(wx, wy, wz) {
            if (wy < 0 || wy >= CHUNK_HEIGHT) return BLOCK.AIR;
            let cx = Math.floor(wx / CHUNK_SIZE);
            let cz = Math.floor(wz / CHUNK_SIZE);
            let key = `${cx},${cz}`;
            let chunk = chunks.get(key);
            if (!chunk) return BLOCK.AIR;

            let lx = wx - cx * CHUNK_SIZE;
            let lz = wz - cz * CHUNK_SIZE;
            let idx = lx + wy * CHUNK_SIZE + lz * CHUNK_SIZE * CHUNK_HEIGHT;
            return chunk.data[idx];
        }

        function setBlock(wx, wy, wz, blockId) {
            if (wy < 0 || wy >= CHUNK_HEIGHT) return;
            let cx = Math.floor(wx / CHUNK_SIZE);
            let cz = Math.floor(wz / CHUNK_SIZE);
            let key = `${cx},${cz}`;
            let chunk = chunks.get(key);
            if (!chunk) return;

            let lx = wx - cx * CHUNK_SIZE;
            let lz = wz - cz * CHUNK_SIZE;
            let idx = lx + wy * CHUNK_SIZE + lz * CHUNK_SIZE * CHUNK_HEIGHT;
            chunk.data[idx] = blockId;

            // Rebuild chunk mesh
            scene.remove(chunk.mesh);
            chunk.mesh = createChunkMesh(cx, cz, chunk.data);
            scene.add(chunk.mesh);
        }

        function updateChunks(force = false) {
            let pChunkX = Math.floor(player.position.x / CHUNK_SIZE);
            let pChunkZ = Math.floor(player.position.z / CHUNK_SIZE);

            let neededChunks = new Set();

            for (let x = -VIEW_DISTANCE; x <= VIEW_DISTANCE; x++) {
                for (let z = -VIEW_DISTANCE; z <= VIEW_DISTANCE; z++) {
                    let cx = pChunkX + x;
                    let cz = pChunkZ + z;
                    neededChunks.add(`${cx},${cz}`);

                    if (!chunks.has(`${cx},${cz}`)) {
                        let data = generateChunkData(cx, cz);
                        let mesh = createChunkMesh(cx, cz, data);
                        scene.add(mesh);
                        chunks.set(`${cx},${cz}`, { data, mesh });
                    }
                }
            }

            // Remove far chunks
            for (let [key, chunk] of chunks) {
                let [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - pChunkX) > VIEW_DISTANCE || Math.abs(cz - pChunkZ) > VIEW_DISTANCE) {
                    scene.remove(chunk.mesh);
                    chunks.delete(key);
                }
            }
        }

        // --- DROPS & INVENTORY ---
        function spawnDrop(wx, wy, wz, blockId) {
            let geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            let material = blockMaterials[blockId];
            let mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(wx + 0.5, wy + 0.5, wz + 0.5);
            scene.add(mesh);

            drops.push({
                mesh: mesh,
                blockId: blockId,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 3,
                    4,
                    (Math.random() - 0.5) * 3
                ),
                age: 0
            });
        }

        function buildInventoryUI() {
            let container = document.getElementById('inventory-bar');
            container.innerHTML = '';
            for (let i = 0; i < hotbar.length; i++) {
                let blockId = hotbar[i];
                let slot = document.createElement('div');
                slot.className = `slot ${i === selectedSlot ? 'selected' : ''}`;
                slot.innerHTML = `
                    <span class="slot-num">${i + 1}</span>
                    <div class="slot-icon" style="background-color: #${BLOCK_COLORS[blockId].toString(16)}"></div>
                    <span class="slot-count" id="count-${blockId}">${inventory[blockId] || 0}</span>
                `;
                container.appendChild(slot);
            }
        }

        function updateInventoryUI() {
            for (let i = 0; i < hotbar.length; i++) {
                let blockId = hotbar[i];
                let countEl = document.getElementById(`count-${blockId}`);
                if (countEl) {
                    countEl.innerText = inventory[blockId] || 0;
                }
                let slotEl = document.children; // handled via re-classing
            }
            let slots = document.querySelectorAll('.slot');
            slots.forEach((s, idx) => {
                if (idx === selectedSlot) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        }

        // --- CONTROLS ---
        function setupControls() {
            let instructions = document.getElementById('instructions');
            let startBtn = document.getElementById('start-btn');

            startBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                instructions.style.display = isLocked ? 'none' : 'flex';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                let sensitivity = 0.002;
                euler.y -= e.movementX * sensitivity;
                euler.x -= e.movementY * sensitivity;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            });

            document.addEventListener('keydown', (e) => {
                if (!isLocked) return;
                if (e.code === 'KeyW') moveState.forward = true;
                if (e.code === 'KeyS') moveState.backward = true;
                if (e.code === 'KeyA') moveState.left = true;
                if (e.code === 'KeyD') moveState.right = true;
                if (e.code === 'Space') {
                    if (player.onGround) {
                        player.velocity.y = player.jumpForce;
                        player.onGround = false;
                    }
                }

                // Number keys 1-6
                if (e.code >= 'Digit1' && e.code <= 'Digit6') {
                    selectedSlot = parseInt(e.code) - 1;
                    updateInventoryUI();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveState.forward = false;
                if (e.code === 'KeyS') moveState.backward = false;
                if (e.code === 'KeyA') moveState.left = false;
                if (e.code === 'KeyD') moveState.right = false;
            });

            window.addEventListener('wheel', (e) => {
                if (!isLocked) return;
                if (e.deltaY > 0) {
                    selectedSlot = (selectedSlot + 1) % hotbar.length;
                } else {
                    selectedSlot = (selectedSlot - 1 + hotbar.length) % hotbar.length;
                }
                updateInventoryUI();
            });

            // Mouse actions: Break & Place
            window.addEventListener('mousedown', (e) => {
                if (!isLocked) return;

                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                
                // Collect interactable meshes
                let interactables = [];
                for (let [key, chunk] of chunks) {
                    chunk.mesh.children.forEach(m => interactables.push(m));
                }

                let intersects = raycaster.intersectObjects(interactables, false);

                if (intersects.length > 0) {
                    let hit = intersects[0];
                    if (hit.distance > 6) return; // Too far

                    if (e.button === 0) {
                        // Left click: Break block
                        let p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(-0.5));
                        let bx = Math.floor(p.x);
                        let by = Math.floor(p.y);
                        let bz = Math.floor(p.z);

                        let bId = getBlock(bx, by, bz);
                        if (bId !== BLOCK.AIR) {
                            setBlock(bx, by, bz, BLOCK.AIR);
                            spawnDrop(bx, by, bz, bId);
                        }
                    } else if (e.button === 2) {
                        // Right click: Place block
                        let activeBlock = hotbar[selectedSlot];
                        if (inventory[activeBlock] > 0) {
                            let p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
                            let bx = Math.floor(p.x);
                            let by = Math.floor(p.y);
                            let bz = Math.floor(p.z);

                            // Check player collision with placed block
                            let pBox = new THREE.Box3(
                                new THREE.Vector3(player.position.x - player.radius, player.position.y, player.position.z - player.radius),
                                new THREE.Vector3(player.position.x + player.radius, player.position.y + player.height, player.position.z + player.radius)
                            );
                            let bBox = new THREE.Box3(
                                new THREE.Vector3(bx, by, bz),
                                new THREE.Vector3(bx + 1, by + 1, bz + 1)
                            );

                            if (!pBox.intersectsBox(bBox)) {
                                setBlock(bx, by, bz, activeBlock);
                                inventory[activeBlock]--;
                                updateInventoryUI();
                            }
                        }
                    }
                }
            });

            // Prevent context menu on right click
            window.addEventListener('contextmenu', e => e.preventDefault());
        }

        // --- COLLISION & PHYSICS ---
        function checkCollision(pos) {
            let r = player.radius;
            let h = player.height;

            let x0 = Math.floor(pos.x - r);
            let x1 = Math.floor(pos.x + r);
            let y0 = Math.floor(pos.y);
            let y1 = Math.floor(pos.y + h);
            let z0 = Math.floor(pos.z - r);
            let z1 = Math.floor(pos.z + r);

            for (let x = x0; x <= x1; x++) {
                for (let y = y0; y <= y1; y++) {
                    for (let z = z0; z <= z1; z++) {
                        if (getBlock(x, y, z) !== BLOCK.AIR) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function updatePhysics(delta) {
            // Gravity
            player.velocity.y -= 25 * delta;

            // Movement directions
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            let sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (moveState.forward) moveDir.add(dir);
            if (moveState.backward) moveDir.sub(dir);
            if (moveState.right) moveDir.add(sideDir);
            if (moveState.left) moveDir.sub(sideDir);
            moveDir.normalize();

            player.velocity.x = moveDir.x * player.speed;
            player.velocity.z = moveDir.z * player.speed;

            // Apply movement with Axis-Aligned collision resolution
            // X axis
            player.position.x += player.velocity.x * delta;
            if (checkCollision(player.position)) {
                player.position.x -= player.velocity.x * delta;
            }

            // Z axis
            player.position.z += player.velocity.z * delta;
            if (checkCollision(player.position)) {
                player.position.z -= player.velocity.z * delta;
            }

            // Y axis
            player.position.y += player.velocity.y * delta;
            if (checkCollision(player.position)) {
                if (player.velocity.y < 0) {
                    player.onGround = true;
                }
                player.position.y -= player.velocity.y * delta;
                player.velocity.y = 0;
            } else {
                player.onGround = false;
            }

            camera.position.copy(player.position);
            camera.position.y += player.height - 0.2; // Eye height

            // Update Chunks around player
            updateChunks();
        }

        // --- DROPS & PICKUP LOGIC ---
        function updateDrops(delta) {
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                d.age += delta;

                // Simple gravity & spin
                d.velocity.y -= 15 * delta;
                d.mesh.position.addScaledVector(d.velocity, delta);

                // Simple floor collision for drops
                let floorH = getTerrainHeight(d.mesh.position.x, d.mesh.position.z);
                if (d.mesh.position.y < floorH + 0.2) {
                    d.mesh.position.y = floorH + 0.2;
                    d.velocity.y = -d.velocity.y * 0.3; // bounce slightly
                    d.velocity.x *= 0.8;
                    d.velocity.z *= 0.8;
                }

                d.mesh.rotation.x += 1.5 * delta;
                d.mesh.rotation.y += 2.0 * delta;

                // Check distance to player for auto-pickup
                let dist = d.mesh.position.distanceTo(player.position);
                if (dist < 2.0) {
                    inventory[d.blockId] = (inventory[d.blockId] || 0) + 1;
                    updateInventoryUI();

                    scene.remove(d.mesh);
                    d.mesh.geometry.dispose();
                    drops.splice(i, 1);
                }
            }
        }

        // --- MAIN LOOP ---
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            let delta = (time - lastTime) / 1000;
            if (delta > 0.1) delta = 0.1; // Cap delta
            lastTime = time;

            // FPS Counter
            frameCount++;
            fpsTimer += delta;
            if (fpsTimer >= 1.0) {
                document.getElementById('fps').innerText = `FPS: ${Math.round(frameCount / fpsTimer)}`;
                document.getElementById('coords').innerText = `X: ${Math.round(player.position.x)} Y: ${Math.round(player.position.y)} Z: ${Math.round(player.position.z)}`;
                frameCount = 0;
                fpsTimer = 0;
            }

            if (isLocked) {
                updatePhysics(delta);
                updateDrops(delta);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
