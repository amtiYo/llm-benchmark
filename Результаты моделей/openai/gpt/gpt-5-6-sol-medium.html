<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Blockhaven</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8fd0f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;user-select:none}canvas{display:block}
    #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 55%,rgba(17,31,35,.16) 100%);z-index:2}
    #hud{position:fixed;inset:0;z-index:3;pointer-events:none;color:white;text-shadow:0 2px 0 rgba(0,0,0,.45)}
    #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 1px #000)}
    #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;border-radius:1px}#crosshair:before{width:2px;height:18px;left:8px}#crosshair:after{width:18px;height:2px;top:8px}
    #info{position:absolute;top:18px;left:18px;font-weight:700;font-size:13px;letter-spacing:.04em;opacity:.9}
    #toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:8px;background:rgba(0,0,0,.48);font-weight:700;opacity:0;transition:opacity .2s}
    #hotbar{position:absolute;bottom:24px;left:50%;display:flex;gap:5px;transform:translateX(-50%)}
    .slot{position:relative;width:64px;height:64px;border:3px solid rgba(240,248,255,.65);border-radius:5px;background:rgba(18,25,26,.66);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.25);transition:transform .1s,border-color .1s}.slot.selected{transform:translateY(-6px) scale(1.08);border-color:#fff;background:rgba(45,53,50,.84);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 5px 13px rgba(0,0,0,.38)}
    .slot .key{position:absolute;top:3px;left:6px;font-size:11px;opacity:.75}.slot .count{position:absolute;right:6px;bottom:2px;font-size:18px;font-weight:900}.slot .name{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);font-size:11px;font-weight:800;opacity:0;white-space:nowrap}.slot.selected .name{opacity:1}
    .block-icon{position:absolute;left:17px;top:15px;width:30px;height:30px;border:2px solid rgba(255,255,255,.2);box-shadow:inset -8px -8px 0 rgba(0,0,0,.13),inset 5px 5px 0 rgba(255,255,255,.11),2px 3px 0 rgba(0,0,0,.25)}
    #start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(30,65,89,.2),rgba(15,28,24,.65));color:#fff;text-align:center;transition:opacity .25s}
    #start.hidden{opacity:0;pointer-events:none}.card{width:min(520px,calc(100% - 32px));padding:36px 42px;border:1px solid rgba(255,255,255,.25);border-radius:18px;background:rgba(15,25,28,.78);box-shadow:0 20px 70px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
    h1{margin:0 0 7px;font-size:50px;line-height:1;letter-spacing:-.06em;text-shadow:0 4px 0 #315528}h1 span{color:#aee77f}.tag{margin:0 0 26px;color:#d8e8ec;font-weight:600}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;margin:0 auto 26px;text-align:left;color:#d9e7e9;font-size:14px}.controls b{color:#fff}button{border:0;border-radius:9px;padding:14px 30px;background:#71bb4b;color:white;font:900 16px inherit;letter-spacing:.04em;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 5px 16px rgba(0,0,0,.25)}button:hover{background:#7aca51}button:active{transform:translateY(2px)}
    #loading{margin-top:14px;font-size:12px;color:#aac1c5}.dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
    @media(max-width:600px){.slot{width:52px;height:52px}.block-icon{left:13px;top:12px;width:25px;height:25px}.card{padding:28px 24px}h1{font-size:42px}}
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="hud">
    <div id="crosshair"></div><div id="info">BLOCKHAVEN</div><div id="toast"></div><div id="hotbar"></div>
  </div>
  <div id="start"><div class="card">
    <h1>BLOCK<span>HAVEN</span></h1><p class="tag">An endless world. Yours to reshape.</p>
    <div class="controls"><div><b>WASD</b> Move</div><div><b>Mouse</b> Look</div><div><b>Space</b> Jump</div><div><b>1–5 / Wheel</b> Select</div><div><b>Left click</b> Mine</div><div><b>Right click</b> Place</div></div>
    <button id="play">ENTER WORLD</button><div id="loading">Generating terrain<span class="dot">…</span></div>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
  (()=>{'use strict';
    const CHUNK=16, RANGE=2, REACH=6, EYE=1.62, PLAYER_H=1.8, PLAYER_W=.58;
    const TYPES={grass:{name:'Grass',color:'#68a942',hard:.34},dirt:{name:'Dirt',color:'#8a5b34',hard:.28},stone:{name:'Stone',color:'#888b86',hard:.62},sand:{name:'Sand',color:'#d8c27c',hard:.24},wood:{name:'Wood',color:'#9b6937',hard:.48}};
    const typeNames=Object.keys(TYPES), inventory={grass:0,dirt:4,stone:0,sand:0,wood:0};
    let selected=1, locked=false, leftDown=false, mineTarget='', mineTime=0, toastTimer=0, last=performance.now(), jumpQueued=false;

    const scene=new THREE.Scene();scene.background=new THREE.Color(0x92d5f7);scene.fog=new THREE.Fog(0x92d5f7,32,71);
    const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);camera.rotation.order='YXZ';
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xc8edff,0x52633c,1.15));const sun=new THREE.DirectionalLight(0xfff1c8,1.05);sun.position.set(35,55,24);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=sun.shadow.camera.bottom=-35;sun.shadow.camera.right=sun.shadow.camera.top=35;sun.shadow.camera.near=1;sun.shadow.camera.far=110;scene.add(sun);

    const texCanvas=(base,kind)=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,32,32);let seed=kind.length*9187;const rnd=()=>((seed=Math.imul(seed^seed>>>15,1|seed))+(seed^seed>>>7)>>>0)/4294967296;for(let i=0;i<145;i++){const v=rnd();g.fillStyle=v>.55?'rgba(255,255,255,.10)':'rgba(0,0,0,.10)';const s=1+(rnd()*3|0);g.fillRect(rnd()*32|0,rnd()*32|0,s,s)}if(kind==='grass'){g.fillStyle='rgba(45,90,30,.22)';for(let i=0;i<30;i++)g.fillRect(rnd()*32|0,rnd()*32|0,1,3)}if(kind==='stone'){g.strokeStyle='rgba(40,45,42,.16)';for(let i=0;i<7;i++){g.beginPath();g.moveTo(rnd()*32,rnd()*32);g.lineTo(rnd()*32,rnd()*32);g.stroke()}}if(kind==='wood'){g.strokeStyle='rgba(60,34,15,.25)';for(let x=3;x<32;x+=7){g.beginPath();g.moveTo(x,0);g.lineTo(x+(rnd()*3|0),32);g.stroke()}}const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipMapLinearFilter;t.encoding=THREE.sRGBEncoding;return t};
    const materials={};for(const [k,v] of Object.entries(TYPES)){materials[k]=new THREE.MeshLambertMaterial({map:texCanvas(v.color,k)})}
    const cubeGeo=new THREE.BoxGeometry(1,1,1), chunks=new Map(), modifications=new Map(), raycaster=new THREE.Raycaster();raycaster.far=REACH;
    const key=(x,y,z)=>x+','+y+','+z, ckey=(cx,cz)=>cx+','+cz, floorDiv=(n,d)=>Math.floor(n/d), mod=(n,d)=>((n%d)+d)%d;
    const hash=(x,z)=>{let h=Math.imul(x,374761393)+Math.imul(z,668265263);h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295};
    const smooth=t=>t*t*(3-2*t);function noise(x,z,s){x/=s;z/=s;const xi=Math.floor(x),zi=Math.floor(z),xf=smooth(x-xi),zf=smooth(z-zi),a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,xf),THREE.MathUtils.lerp(c,d,xf),zf)}
    function terrainHeight(x,z){const plains=noise(x,z,70),rolling=noise(x+180,z-91,35),detail=noise(x-40,z+210,14);const hillMask=smooth(Math.max(0,(plains-.42)/.58));return Math.floor(3+rolling*2+hillMask*7+detail*1.5)}
    function treeAt(x,z){const h=terrainHeight(x,z);return h>4&&hash(x*7+41,z*7-19)>.988&&noise(x+30,z-20,18)<=.58}
    function naturalBlock(x,y,z){if(y<0)return'stone';const h=terrainHeight(x,z);if(y>h){for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){const tx=x-dx,tz=z-dz;if(!treeAt(tx,tz))continue;const th=terrainHeight(tx,tz);if(dx===0&&dz===0&&y<=th+3)return'wood';const crown=y-th;if(crown>=3&&crown<=5&&Math.abs(dx)+Math.abs(dz)<(crown===5?2:4))return'grass'}return null}if(y===h){return h<=4&&noise(x+30,z-20,18)>.58?'sand':'grass'}if(y>=h-2)return'dirt';return'stone'}
    function getBlock(x,y,z){const k=key(x,y,z);if(modifications.has(k))return modifications.get(k);return naturalBlock(x,y,z)}
    function setBlock(x,y,z,type){modifications.set(key(x,y,z),type);const cx=floorDiv(x,CHUNK),cz=floorDiv(z,CHUNK);rebuildChunk(cx,cz);if(mod(x,CHUNK)===0)rebuildChunk(cx-1,cz);if(mod(x,CHUNK)===CHUNK-1)rebuildChunk(cx+1,cz);if(mod(z,CHUNK)===0)rebuildChunk(cx,cz-1);if(mod(z,CHUNK)===CHUNK-1)rebuildChunk(cx,cz+1)}
    const exposed=(x,y,z)=>!getBlock(x+1,y,z)||!getBlock(x-1,y,z)||!getBlock(x,y+1,z)||!getBlock(x,y-1,z)||!getBlock(x,y,z+1)||!getBlock(x,y,z-1);
    function rebuildChunk(cx,cz){const id=ckey(cx,cz),old=chunks.get(id);if(old)scene.remove(old.group);const group=new THREE.Group(),byType={};for(const t of typeNames)byType[t]=[];const x0=cx*CHUNK,z0=cz*CHUNK;for(let lx=0;lx<CHUNK;lx++)for(let lz=0;lz<CHUNK;lz++){const x=x0+lx,z=z0+lz,h=terrainHeight(x,z);for(let y=0;y<=Math.max(15,h+7);y++){const t=getBlock(x,y,z);if(t&&exposed(x,y,z))byType[t].push([x,y,z])}}
      const dummy=new THREE.Object3D();for(const t of typeNames){const arr=byType[t];if(!arr.length)continue;const mesh=new THREE.InstancedMesh(cubeGeo,materials[t],arr.length);mesh.castShadow=t!=='grass'||arr.length<900;mesh.receiveShadow=true;mesh.userData.positions=arr;mesh.userData.type=t;for(let i=0;i<arr.length;i++){dummy.position.set(arr[i][0],arr[i][1],arr[i][2]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)}mesh.instanceMatrix.needsUpdate=true;group.add(mesh)}group.userData.chunk=id;scene.add(group);chunks.set(id,{group,cx,cz})}
    function updateChunks(force=false){const cx=floorDiv(camera.position.x,CHUNK),cz=floorDiv(camera.position.z,CHUNK);for(let dz=-RANGE;dz<=RANGE;dz++)for(let dx=-RANGE;dx<=RANGE;dx++){const id=ckey(cx+dx,cz+dz);if(!chunks.has(id))rebuildChunk(cx+dx,cz+dz)}for(const [id,c] of chunks){if(Math.abs(c.cx-cx)>RANGE+1||Math.abs(c.cz-cz)>RANGE+1){scene.remove(c.group);chunks.delete(id)}}sun.position.set(camera.position.x+35,55,camera.position.z+24);sun.target.position.set(camera.position.x,0,camera.position.z);scene.add(sun.target)}

    const player={vel:new THREE.Vector3(),grounded:false};const keys={};
    function collides(px,py,pz){const r=PLAYER_W/2,eps=.001;for(let x=Math.floor(px-r+eps);x<=Math.floor(px+r-eps);x++)for(let y=Math.floor(py+eps);y<=Math.floor(py+PLAYER_H-eps);y++)for(let z=Math.floor(pz-r+eps);z<=Math.floor(pz+r-eps);z++)if(getBlock(x,y,z))return true;return false}
    function moveAxis(axis,amount){if(!amount)return;const p=camera.position,feet=p.y-EYE;p[axis]+=amount;if(collides(p.x,feet,p.z)){const sign=Math.sign(amount),step=.01;while(collides(p.x,axis==='y'?p.y-EYE:p.y,p.z)){p[axis]-=sign*step;if(Math.abs(step)>Math.abs(amount))break}p[axis]-=sign*.002;if(axis==='y'){if(sign<0)player.grounded=true;player.vel.y=0}else player.vel[axis]=0}}
    function updatePlayer(dt){if(!locked)return;const forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y)),right=new THREE.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y)),wish=new THREE.Vector3();if(keys.KeyW)wish.add(forward);if(keys.KeyS)wish.sub(forward);if(keys.KeyD)wish.add(right);if(keys.KeyA)wish.sub(right);if(wish.lengthSq())wish.normalize();const speed=(keys.ShiftLeft||keys.ShiftRight)?6.8:4.7,accel=player.grounded?18:7;player.vel.x=THREE.MathUtils.lerp(player.vel.x,wish.x*speed,Math.min(1,accel*dt));player.vel.z=THREE.MathUtils.lerp(player.vel.z,wish.z*speed,Math.min(1,accel*dt));if(jumpQueued&&player.grounded){player.vel.y=7.4;player.grounded=false}jumpQueued=false;player.vel.y-=20*dt;player.grounded=false;moveAxis('x',player.vel.x*dt);moveAxis('z',player.vel.z*dt);moveAxis('y',player.vel.y*dt);if(camera.position.y<-10)spawnPlayer()}
    function spawnPlayer(){const x=2,z=2;camera.position.set(x,terrainHeight(x,z)+EYE+1,z);player.vel.set(0,0,0)}

    const highlight=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.018,1.018,1.018)),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.85}));highlight.visible=false;scene.add(highlight);const crack=new THREE.Mesh(new THREE.BoxGeometry(1.025,1.025,1.025),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,wireframe:true}));crack.visible=false;scene.add(crack);
    function aimedBlock(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const targets=[];for(const c of chunks.values())targets.push(...c.group.children);const hits=raycaster.intersectObjects(targets,false);if(!hits.length)return null;const h=hits[0],p=h.object.userData.positions[h.instanceId];if(!p)return null;return{x:p[0],y:p[1],z:p[2],type:h.object.userData.type,normal:h.face.normal.clone(),distance:h.distance}}
    function updateMining(dt){const hit=aimedBlock();if(hit){highlight.visible=true;highlight.position.set(hit.x,hit.y,hit.z)}else highlight.visible=false;if(!leftDown||!hit){mineTarget='';mineTime=0;crack.visible=false;return}const id=key(hit.x,hit.y,hit.z);if(id!==mineTarget){mineTarget=id;mineTime=0}mineTime+=dt;const hard=TYPES[hit.type].hard;crack.visible=true;crack.position.set(hit.x,hit.y,hit.z);crack.material.opacity=.18+.55*Math.min(1,mineTime/hard);crack.rotation.y=mineTime*2;if(mineTime>=hard){setBlock(hit.x,hit.y,hit.z,null);spawnDrop(hit.x,hit.y,hit.z,hit.type);mineTarget='';mineTime=0;crack.visible=false}}

    const drops=[];function spawnDrop(x,y,z,type){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,.28),materials[type]);mesh.position.set(x+(Math.random()-.5)*.25,y+.15,z+(Math.random()-.5)*.25);mesh.castShadow=true;scene.add(mesh);drops.push({mesh,type,vel:new THREE.Vector3((Math.random()-.5)*1.5,2.2+Math.random(),(Math.random()-.5)*1.5),age:0})}
    function updateDrops(dt){const pp=new THREE.Vector3(camera.position.x,camera.position.y-EYE+.75,camera.position.z);for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age+=dt;d.vel.y-=14*dt;d.mesh.position.addScaledVector(d.vel,dt);const bx=Math.floor(d.mesh.position.x),by=Math.floor(d.mesh.position.y-.16),bz=Math.floor(d.mesh.position.z);if(getBlock(bx,by,bz)&&d.vel.y<0){d.mesh.position.y=by+.66;d.vel.y*=-.18;d.vel.x*=.82;d.vel.z*=.82}d.mesh.rotation.y+=dt*3.8;d.mesh.rotation.x+=dt*1.7;const dist=d.mesh.position.distanceTo(pp);if(d.age>.3&&dist<2.2){const pull=Math.min(1,dt*(7+(2.2-dist)*8));d.mesh.position.lerp(pp,pull)}if(d.age>.3&&dist<.62){inventory[d.type]++;updateHotbar();showToast('+1 '+TYPES[d.type].name);scene.remove(d.mesh);drops.splice(i,1)}}}
    function placeBlock(){const hit=aimedBlock();if(!hit)return;const t=typeNames[selected];if(inventory[t]<=0){showToast('No '+TYPES[t].name.toLowerCase()+' blocks');return}const x=hit.x+Math.round(hit.normal.x),y=hit.y+Math.round(hit.normal.y),z=hit.z+Math.round(hit.normal.z);if(getBlock(x,y,z))return;const feet=camera.position.y-EYE,r=PLAYER_W/2;if(x+.5>camera.position.x-r&&x-.5<camera.position.x+r&&z+.5>camera.position.z-r&&z-.5<camera.position.z+r&&y+.5>feet&&y-.5<feet+PLAYER_H)return;setBlock(x,y,z,t);inventory[t]--;updateHotbar()}

    const hotbar=document.getElementById('hotbar');function updateHotbar(){hotbar.innerHTML='';typeNames.forEach((t,i)=>{const s=document.createElement('div');s.className='slot'+(i===selected?' selected':'');s.innerHTML='<span class="key">'+(i+1)+'</span><span class="block-icon" style="background:'+TYPES[t].color+'"></span><span class="count">'+inventory[t]+'</span><span class="name">'+TYPES[t].name+'</span>';hotbar.appendChild(s)})}function selectSlot(i){selected=(i+typeNames.length)%typeNames.length;updateHotbar()}function showToast(s){const e=document.getElementById('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity=0,850)}
    function lock(){renderer.domElement.requestPointerLock()}document.getElementById('play').onclick=lock;renderer.domElement.onclick=()=>{if(!locked)lock()};document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;document.getElementById('start').classList.toggle('hidden',locked);leftDown=false});document.addEventListener('mousemove',e=>{if(!locked)return;camera.rotation.y-=e.movementX*.00225;camera.rotation.x-=e.movementY*.00225;camera.rotation.x=Math.max(-Math.PI/2+.01,Math.min(Math.PI/2-.01,camera.rotation.x))});
    addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){jumpQueued=true;e.preventDefault()}if(/^Digit[1-5]$/.test(e.code))selectSlot(+e.code.slice(5)-1)});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0)leftDown=true;if(e.button===2)placeBlock()});addEventListener('mouseup',e=>{if(e.button===0)leftDown=false});addEventListener('contextmenu',e=>e.preventDefault());addEventListener('wheel',e=>{if(locked)selectSlot(selected+(e.deltaY>0?1:-1))},{passive:true});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    spawnPlayer();updateChunks(true);updateHotbar();document.getElementById('loading').textContent='World ready — click to play';
    function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;updatePlayer(dt);updateChunks();updateMining(dt);updateDrops(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
