<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Voxel Sandbox (Single File)</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                cursor: none;
            }
            #c {
                width: 100%;
                height: 100%;
                display: block;
            }

            #hud {
                position: fixed;
                inset: 0;
                pointer-events: none;
            }

            #help {
                position: fixed;
                top: 20px;
                left: 20px;
                max-width: 420px;
                background: rgba(0, 0, 0, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 14px;
                color: #fff;
                padding: 12px 14px;
                line-height: 1.35;
                font-size: 14px;
                white-space: pre-line;
            }

            #selectedName {
                position: fixed;
                bottom: 108px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(255, 255, 255, 0.12);
                padding: 6px 10px;
                border-radius: 12px;
                color: #fff;
                font-size: 13px;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            }

            #inventoryWrap {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }

            #inventory {
                display: flex;
                gap: 8px;
                padding: 10px;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 14px;
            }

            .slot {
                width: 64px;
                height: 64px;
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.12);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .slot.active {
                border-color: #fff;
                box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
                background: rgba(255, 255, 255, 0.12);
            }

            .swatch {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35) inset;
            }
            .count {
                margin-top: 6px;
                font-size: 12px;
                color: #fff;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            }

            #crosshair {
                position: fixed;
                left: 50%;
                top: 50%;
                width: 26px;
                height: 26px;
                transform: translate(-50%, -50%);
            }
            #crosshair:before,
            #crosshair:after {
                content: "";
                position: absolute;
                background: rgba(255, 255, 255, 0.9);
            }
            #crosshair:before {
                width: 2px;
                height: 26px;
                left: 12px;
                top: 0;
            }
            #crosshair:after {
                height: 2px;
                width: 26px;
                top: 12px;
                left: 0;
            }
            #crosshair .dot {
                position: absolute;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.9);
                left: 11px;
                top: 11px;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>

        <div id="hud">
            <div id="help">
                Click to start WASD: move • Space: jump LMB: break • RMB: place
                1-4: select block
            </div>

            <div id="selectedName">Selected: —</div>

            <div id="inventoryWrap"><div id="inventory"></div></div>

            <div id="crosshair"><div class="dot"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
        <script>
            (() => {
                // -------------------- World / Blocks --------------------
                const CHUNK_SIZE = 16;
                const CHUNK_HEIGHT = 72;
                const SIZE_XZ = CHUNK_SIZE * CHUNK_SIZE;

                const RENDER_DISTANCE = 2; // chunks
                const MESH_UNLOAD_DISTANCE = 3; // chunks
                const MAX_CACHED_CHUNKS = 240;

                const WORLD_SEED = 1337;

                const BLOCK = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, SAND: 4 };

                const BLOCK_NAME = {
                    [BLOCK.GRASS]: "Grass",
                    [BLOCK.DIRT]: "Dirt",
                    [BLOCK.STONE]: "Stone",
                    [BLOCK.SAND]: "Sand",
                };

                const BLOCK_RGB = {
                    [BLOCK.AIR]: [0, 0, 0],
                    [BLOCK.GRASS]: [0.2, 0.8, 0.25],
                    [BLOCK.DIRT]: [0.55, 0.35, 0.15],
                    [BLOCK.STONE]: [0.58, 0.58, 0.63],
                    [BLOCK.SAND]: [0.92, 0.84, 0.46],
                };

                const BLOCK_CSS = {};
                for (const id of [
                    BLOCK.GRASS,
                    BLOCK.DIRT,
                    BLOCK.STONE,
                    BLOCK.SAND,
                ]) {
                    const [r, g, b] = BLOCK_RGB[id];
                    BLOCK_CSS[id] =
                        `rgb(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)})`;
                }

                const SLOT_TYPES = [
                    BLOCK.GRASS,
                    BLOCK.DIRT,
                    BLOCK.STONE,
                    BLOCK.SAND,
                ];

                function clamp(v, a, b) {
                    return Math.max(a, Math.min(b, v));
                }
                function lerp(a, b, t) {
                    return a + (b - a) * t;
                }
                function smooth01(t) {
                    t = clamp(t, 0, 1);
                    return t * t * (3 - 2 * t);
                }
                function smoothstepRange(a, b, x) {
                    return smooth01((x - a) / (b - a));
                }

                function hash2i(x, z) {
                    let h = x * 374761393 + z * 668265263 + WORLD_SEED * 1447;
                    h = (h ^ (h >> 13)) * 1274126177;
                    h = (h ^ (h >> 16)) >>> 0;
                    return h / 4294967296;
                }

                function valueNoise(x, z) {
                    const xi = Math.floor(x),
                        zi = Math.floor(z);
                    const xf = x - xi,
                        zf = z - zi;

                    const r00 = hash2i(xi, zi);
                    const r10 = hash2i(xi + 1, zi);
                    const r01 = hash2i(xi, zi + 1);
                    const r11 = hash2i(xi + 1, zi + 1);

                    const u = smooth01(xf);
                    const v = smooth01(zf);

                    const x1 = lerp(r00, r10, u);
                    const x2 = lerp(r01, r11, u);
                    return lerp(x1, x2, v); // 0..1
                }

                function fbm(x, z, octaves) {
                    let sum = 0,
                        amp = 1,
                        freq = 1,
                        norm = 0;
                    for (let i = 0; i < octaves; i++) {
                        sum += valueNoise(x * freq, z * freq) * amp;
                        norm += amp;
                        amp *= 0.5;
                        freq *= 2;
                    }
                    return sum / norm; // 0..1
                }

                const BASE_HEIGHT = 24;
                const MIN_HEIGHT = 6;
                const SAND_CUTOFF = BASE_HEIGHT - 4;

                // Hills + flat plains: blend amplitude by a low-frequency mask + terrace in plains
                function terrainHeight(x, z) {
                    const low = fbm(x * 0.0016, z * 0.0016, 2);
                    const mask = fbm(x * 0.005, z * 0.005, 3);
                    const detail = fbm(x * 0.02, z * 0.02, 5);

                    const hillFactor = smoothstepRange(0.35, 0.7, mask); // 0..1
                    const hillAmp = lerp(3.5, 20, hillFactor);

                    let h =
                        BASE_HEIGHT +
                        (low - 0.5) * 10 +
                        (detail - 0.5) * hillAmp;

                    // Flatten + terrace in plains
                    const step = 2;
                    const terrace = Math.round(h / step) * step;
                    const terraceMix = (1 - hillFactor) * 0.65;
                    h = h * (1 - terraceMix) + terrace * terraceMix;

                    h = clamp(h, MIN_HEIGHT, CHUNK_HEIGHT - 5);
                    return Math.floor(h);
                }

                // -------------------- Chunk Data --------------------
                const chunkMap = new Map(); // key -> { key,cx,cz,voxels,mesh,dirty,lastUsed }

                function chunkKey(cx, cz) {
                    return `${cx},${cz}`;
                }

                function generateChunkVoxels(cx, cz) {
                    const voxels = new Uint8Array(
                        CHUNK_SIZE * CHUNK_SIZE * CHUNK_HEIGHT,
                    );
                    const baseX = cx * CHUNK_SIZE;
                    const baseZ = cz * CHUNK_SIZE;

                    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
                        const z = baseZ + lz;
                        for (let lx = 0; lx < CHUNK_SIZE; lx++) {
                            const x = baseX + lx;
                            const h = terrainHeight(x, z);

                            const baseIndex = lx + lz * CHUNK_SIZE; // y=0
                            for (let y = 0; y <= h; y++) {
                                let t;
                                if (y === h) {
                                    t =
                                        h < SAND_CUTOFF
                                            ? BLOCK.SAND
                                            : BLOCK.GRASS;
                                } else if (y >= h - 3) {
                                    t = BLOCK.DIRT;
                                } else {
                                    t = BLOCK.STONE;
                                }
                                voxels[baseIndex + y * SIZE_XZ] = t;
                            }
                        }
                    }
                    return voxels;
                }

                function ensureChunkData(cx, cz) {
                    const key = chunkKey(cx, cz);
                    let chunk = chunkMap.get(key);
                    if (!chunk) {
                        chunk = {
                            key,
                            cx,
                            cz,
                            voxels: generateChunkVoxels(cx, cz),
                            mesh: null,
                            dirty: true,
                            lastUsed: performance.now(),
                        };
                        chunkMap.set(key, chunk);
                    }
                    return chunk;
                }

                function getBlockTypeAt(x, y, z) {
                    // Collision "bedrock" below world
                    if (y < 0) return BLOCK.STONE;
                    if (y >= CHUNK_HEIGHT) return BLOCK.AIR;

                    const cx = Math.floor(x / CHUNK_SIZE);
                    const cz = Math.floor(z / CHUNK_SIZE);
                    const key = chunkKey(cx, cz);
                    let chunk = chunkMap.get(key);
                    if (!chunk) chunk = ensureChunkData(cx, cz);

                    const lx = x - cx * CHUNK_SIZE;
                    const lz = z - cz * CHUNK_SIZE;

                    return chunk.voxels[lx + lz * CHUNK_SIZE + y * SIZE_XZ];
                }

                function setBlock(x, y, z, type) {
                    if (y < 0 || y >= CHUNK_HEIGHT) return false;

                    const cx = Math.floor(x / CHUNK_SIZE);
                    const cz = Math.floor(z / CHUNK_SIZE);
                    const key = chunkKey(cx, cz);
                    let chunk = chunkMap.get(key);
                    if (!chunk) chunk = ensureChunkData(cx, cz);

                    const lx = x - cx * CHUNK_SIZE;
                    const lz = z - cz * CHUNK_SIZE;
                    const idx = lx + lz * CHUNK_SIZE + y * SIZE_XZ;

                    const old = chunk.voxels[idx];
                    if (old === type) return false;

                    chunk.voxels[idx] = type;
                    chunk.dirty = true;
                    chunk.lastUsed = performance.now();

                    // Mark affected chunks for re-meshing (neighbor faces across chunk edges)
                    const affected = new Set();
                    const add = (ax, az) => affected.add(chunkKey(ax, az));

                    add(cx, cz);
                    if (lx === 0) add(cx - 1, cz);
                    if (lx === CHUNK_SIZE - 1) add(cx + 1, cz);
                    if (lz === 0) add(cx, cz - 1);
                    if (lz === CHUNK_SIZE - 1) add(cx, cz + 1);

                    for (const k of affected) {
                        const [ncx, ncz] = k.split(",").map(Number);
                        const ch = ensureChunkData(ncx, ncz);
                        ch.dirty = true;
                        ch.lastUsed = performance.now();
                        if (ch.mesh) rebuildChunk(ch);
                    }
                    return true;
                }

                function isSolid(x, y, z) {
                    return getBlockTypeAt(x, y, z) !== BLOCK.AIR;
                }

                // -------------------- Rendering / Meshing --------------------
                const canvas = document.getElementById("c");

                const renderer = new THREE.WebGLRenderer({
                    canvas,
                    antialias: true,
                });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight, false);

                const scene = new THREE.Scene();
                scene.fog = new THREE.Fog(0xa0d8ff, 30, 160);

                const camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    200,
                );
                camera.rotation.order = "YXZ";

                const blockMaterial = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    roughness: 0.95,
                    metalness: 0.0,
                });

                // Lights
                scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a55, 0.6));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
                dirLight.position.set(40, 100, 20);
                scene.add(dirLight);

                // Target highlight
                const targetBox = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1, 1),
                    new THREE.MeshBasicMaterial({
                        color: 0xffcc33,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.9,
                    }),
                );
                targetBox.visible = false;
                scene.add(targetBox);

                function buildChunkGeometry(chunk) {
                    const positions = [];
                    const normals = [];
                    const colors = [];

                    const voxels = chunk.voxels;
                    const baseX = chunk.cx * CHUNK_SIZE;
                    const baseZ = chunk.cz * CHUNK_SIZE;

                    const addTri = (
                        ax,
                        ay,
                        az,
                        bx,
                        by,
                        bz,
                        cx,
                        cy,
                        cz,
                        nx,
                        ny,
                        nz,
                        type,
                    ) => {
                        const [r, g, b] = BLOCK_RGB[type];
                        let shade = 0.95;
                        if (ny === 1) shade = 1.12;
                        else if (ny === -1) shade = 0.78;
                        else shade = 0.93;

                        positions.push(ax, ay, az, bx, by, bz, cx, cy, cz);
                        normals.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);

                        const rr = r * shade,
                            gg = g * shade,
                            bb = b * shade;
                        colors.push(rr, gg, bb, rr, gg, bb, rr, gg, bb);
                    };

                    for (let y = 0; y < CHUNK_HEIGHT; y++) {
                        const y0 = y;
                        for (let z = 0; z < CHUNK_SIZE; z++) {
                            const z0 = baseZ + z;
                            for (let x = 0; x < CHUNK_SIZE; x++) {
                                const idx = x + z * CHUNK_SIZE + y * SIZE_XZ;
                                const type = voxels[idx];
                                if (type === BLOCK.AIR) continue;

                                const x0 = baseX + x;

                                // +X
                                let nType;
                                if (x === CHUNK_SIZE - 1)
                                    nType = getBlockTypeAt(x0 + 1, y0, z0);
                                else nType = voxels[idx + 1];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p100, p111, p101
                                    addTri(
                                        x0 + 1,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        x0 + 1,
                                        y0,
                                        z0 + 1,
                                        1,
                                        0,
                                        0,
                                        type,
                                    );
                                    // Tri2: p100, p110, p111
                                    addTri(
                                        x0 + 1,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        1,
                                        0,
                                        0,
                                        type,
                                    );
                                }

                                // -X
                                if (x === 0)
                                    nType = getBlockTypeAt(x0 - 1, y0, z0);
                                else nType = voxels[idx - 1];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p000, p011, p010
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0,
                                        y0 + 1,
                                        z0 + 1,
                                        x0,
                                        y0 + 1,
                                        z0,
                                        -1,
                                        0,
                                        0,
                                        type,
                                    );
                                    // Tri2: p000, p001, p011
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0,
                                        y0,
                                        z0 + 1,
                                        x0,
                                        y0 + 1,
                                        z0 + 1,
                                        -1,
                                        0,
                                        0,
                                        type,
                                    );
                                }

                                // +Z
                                if (z === CHUNK_SIZE - 1)
                                    nType = getBlockTypeAt(x0, y0, z0 + 1);
                                else nType = voxels[idx + CHUNK_SIZE];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p001, p111, p011
                                    addTri(
                                        x0,
                                        y0,
                                        z0 + 1,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        x0,
                                        y0 + 1,
                                        z0 + 1,
                                        0,
                                        0,
                                        1,
                                        type,
                                    );
                                    // Tri2: p001, p101, p111
                                    addTri(
                                        x0,
                                        y0,
                                        z0 + 1,
                                        x0 + 1,
                                        y0,
                                        z0 + 1,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        0,
                                        0,
                                        1,
                                        type,
                                    );
                                }

                                // -Z
                                if (z === 0)
                                    nType = getBlockTypeAt(x0, y0, z0 - 1);
                                else nType = voxels[idx - CHUNK_SIZE];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p000, p110, p100
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0,
                                        x0 + 1,
                                        y0,
                                        z0,
                                        0,
                                        0,
                                        -1,
                                        type,
                                    );
                                    // Tri2: p000, p010, p110
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0,
                                        y0 + 1,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0,
                                        0,
                                        0,
                                        -1,
                                        type,
                                    );
                                }

                                // +Y (top)
                                if (y === CHUNK_HEIGHT - 1) nType = BLOCK.AIR;
                                else nType = voxels[idx + SIZE_XZ];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p010, p111, p110
                                    addTri(
                                        x0,
                                        y0 + 1,
                                        z0,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        x0 + 1,
                                        y0 + 1,
                                        z0,
                                        0,
                                        1,
                                        0,
                                        type,
                                    );
                                    // Tri2: p010, p011, p111
                                    addTri(
                                        x0,
                                        y0 + 1,
                                        z0,
                                        x0,
                                        y0 + 1,
                                        z0 + 1,
                                        x0 + 1,
                                        y0 + 1,
                                        z0 + 1,
                                        0,
                                        1,
                                        0,
                                        type,
                                    );
                                }

                                // -Y (bottom) - treat below world as solid bedrock so we don't render the underside.
                                if (y === 0) nType = BLOCK.STONE;
                                else nType = voxels[idx - SIZE_XZ];
                                if (nType === BLOCK.AIR) {
                                    // Tri1: p000, p100, p101
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0,
                                        z0 + 1,
                                        0,
                                        -1,
                                        0,
                                        type,
                                    );
                                    // Tri2: p000, p101, p001
                                    addTri(
                                        x0,
                                        y0,
                                        z0,
                                        x0 + 1,
                                        y0,
                                        z0 + 1,
                                        x0,
                                        y0,
                                        z0 + 1,
                                        0,
                                        -1,
                                        0,
                                        type,
                                    );
                                }
                            }
                        }
                    }

                    if (positions.length === 0) return null;

                    const geom = new THREE.BufferGeometry();
                    geom.setAttribute(
                        "position",
                        new THREE.Float32BufferAttribute(positions, 3),
                    );
                    geom.setAttribute(
                        "normal",
                        new THREE.Float32BufferAttribute(normals, 3),
                    );
                    geom.setAttribute(
                        "color",
                        new THREE.Float32BufferAttribute(colors, 3),
                    );
                    geom.computeBoundingSphere();
                    return geom;
                }

                function rebuildChunk(chunk) {
                    const geom = buildChunkGeometry(chunk);
                    if (!geom) {
                        if (chunk.mesh) {
                            scene.remove(chunk.mesh);
                            chunk.mesh.geometry.dispose();
                            chunk.mesh = null;
                        }
                        chunk.dirty = false;
                        return;
                    }
                    if (chunk.mesh) {
                        chunk.mesh.geometry.dispose();
                        chunk.mesh.geometry = geom;
                    } else {
                        chunk.mesh = new THREE.Mesh(geom, blockMaterial);
                        scene.add(chunk.mesh);
                    }
                    chunk.dirty = false;
                }

                function updateWorldChunks(playerChunkX, playerChunkZ) {
                    // Ensure meshes in range
                    for (
                        let cx = playerChunkX - RENDER_DISTANCE;
                        cx <= playerChunkX + RENDER_DISTANCE;
                        cx++
                    ) {
                        for (
                            let cz = playerChunkZ - RENDER_DISTANCE;
                            cz <= playerChunkZ + RENDER_DISTANCE;
                            cz++
                        ) {
                            const dist = Math.max(
                                Math.abs(cx - playerChunkX),
                                Math.abs(cz - playerChunkZ),
                            );
                            if (dist > RENDER_DISTANCE) continue;

                            const ch = ensureChunkData(cx, cz);
                            ch.lastUsed = performance.now();
                            if (ch.mesh === null) {
                                const geom = buildChunkGeometry(ch);
                                if (geom) {
                                    ch.mesh = new THREE.Mesh(
                                        geom,
                                        blockMaterial,
                                    );
                                    scene.add(ch.mesh);
                                }
                                ch.dirty = false;
                            } else if (ch.dirty) {
                                rebuildChunk(ch);
                            }
                        }
                    }

                    // Unload meshes out of range (keep voxel data)
                    for (const ch of chunkMap.values()) {
                        const dist = Math.max(
                            Math.abs(ch.cx - playerChunkX),
                            Math.abs(ch.cz - playerChunkZ),
                        );
                        if (dist > MESH_UNLOAD_DISTANCE && ch.mesh) {
                            scene.remove(ch.mesh);
                            ch.mesh.geometry.dispose();
                            ch.mesh = null;
                        }
                    }

                    // LRU cache cap (drop far, old chunks; modifications may be lost after eviction)
                    if (chunkMap.size > MAX_CACHED_CHUNKS) {
                        const candidates = [];
                        for (const ch of chunkMap.values()) {
                            const dist = Math.max(
                                Math.abs(ch.cx - playerChunkX),
                                Math.abs(ch.cz - playerChunkZ),
                            );
                            if (dist > RENDER_DISTANCE) candidates.push(ch);
                        }
                        candidates.sort((a, b) => a.lastUsed - b.lastUsed);

                        while (
                            chunkMap.size > MAX_CACHED_CHUNKS &&
                            candidates.length
                        ) {
                            const ch = candidates.shift();
                            if (ch.mesh) {
                                scene.remove(ch.mesh);
                                ch.mesh.geometry.dispose();
                                ch.mesh = null;
                            }
                            chunkMap.delete(ch.key);
                        }
                    }
                }

                // -------------------- Player / Physics --------------------
                const PLAYER_HALF_W = 0.3;
                const PLAYER_HALF_H = 0.9; // player height = 1.8 (center-based)
                const PLAYER_EYE_FROM_BOTTOM = 1.62; // typical FPS
                const PLAYER_EYE_OFFSET =
                    PLAYER_EYE_FROM_BOTTOM - PLAYER_HALF_H;

                const STEP_HEIGHT = 1.0;

                const GRAVITY = 28.0;
                const JUMP_VELOCITY = 9.0;

                const WALK_SPEED = 7.0;
                const AIR_SPEED = 5.0;

                const ACCEL_GROUND = 28.0;
                const ACCEL_AIR = 16.0;

                const FRICTION_GROUND = 12.0;
                const FRICTION_AIR = 3.0;

                const COLL_EPS = 1e-4;

                const player = {
                    pos: { x: 0, y: 0, z: 0 }, // center-based
                    vel: { x: 0, y: 0, z: 0 },
                    onGround: false,
                };

                function aabbIntersectsSolid(
                    minX,
                    maxX,
                    minY,
                    maxY,
                    minZ,
                    maxZ,
                ) {
                    const vx0 = Math.floor(minX),
                        vx1 = Math.floor(maxX);
                    const vy0 = Math.floor(minY),
                        vy1 = Math.floor(maxY);
                    const vz0 = Math.floor(minZ),
                        vz1 = Math.floor(maxZ);

                    for (let x = vx0; x <= vx1; x++) {
                        for (let y = vy0; y <= vy1; y++) {
                            for (let z = vz0; z <= vz1; z++) {
                                if (isSolid(x, y, z)) return true;
                            }
                        }
                    }
                    return false;
                }

                function playerCollidesAt(px, py, pz) {
                    const minX = px - PLAYER_HALF_W + COLL_EPS;
                    const maxX = px + PLAYER_HALF_W - COLL_EPS;
                    const minY = py - PLAYER_HALF_H + COLL_EPS;
                    const maxY = py + PLAYER_HALF_H - COLL_EPS;
                    const minZ = pz - PLAYER_HALF_W + COLL_EPS;
                    const maxZ = pz + PLAYER_HALF_W - COLL_EPS;

                    return aabbIntersectsSolid(
                        minX,
                        maxX,
                        minY,
                        maxY,
                        minZ,
                        maxZ,
                    );
                }

                function isGrounded() {
                    const bottom = player.pos.y - PLAYER_HALF_H;
                    const checkY = Math.floor(bottom - 0.02);
                    if (checkY < 0) return true;

                    const minX = player.pos.x - PLAYER_HALF_W + COLL_EPS;
                    const maxX = player.pos.x + PLAYER_HALF_W - COLL_EPS;
                    const minZ = player.pos.z - PLAYER_HALF_W + COLL_EPS;
                    const maxZ = player.pos.z + PLAYER_HALF_W - COLL_EPS;

                    const vx0 = Math.floor(minX),
                        vx1 = Math.floor(maxX);
                    const vz0 = Math.floor(minZ),
                        vz1 = Math.floor(maxZ);

                    for (let x = vx0; x <= vx1; x++) {
                        for (let z = vz0; z <= vz1; z++) {
                            if (isSolid(x, checkY, z)) return true;
                        }
                    }
                    return false;
                }

                function blockIntersectsPlayer(bx, by, bz) {
                    const pMinX = player.pos.x - PLAYER_HALF_W;
                    const pMaxX = player.pos.x + PLAYER_HALF_W;
                    const pMinY = player.pos.y - PLAYER_HALF_H;
                    const pMaxY = player.pos.y + PLAYER_HALF_H;
                    const pMinZ = player.pos.z - PLAYER_HALF_W;
                    const pMaxZ = player.pos.z + PLAYER_HALF_W;

                    const bMinX = bx,
                        bMaxX = bx + 1;
                    const bMinY = by,
                        bMaxY = by + 1;
                    const bMinZ = bz,
                        bMaxZ = bz + 1;

                    return (
                        pMinX < bMaxX - COLL_EPS &&
                        pMaxX > bMinX + COLL_EPS &&
                        pMinY < bMaxY - COLL_EPS &&
                        pMaxY > bMinY + COLL_EPS &&
                        pMinZ < bMaxZ - COLL_EPS &&
                        pMaxZ > bMinZ + COLL_EPS
                    );
                }

                // Generic AABB axis resolution for cube-like object (center-based)
                function resolveAABBMoveAxis(
                    pos,
                    vel,
                    axis,
                    delta,
                    halfX,
                    halfY,
                    halfZ,
                ) {
                    if (delta === 0) return false;

                    let collided = false;

                    if (axis === "x") {
                        const target = pos.x + delta;

                        const minY = pos.y - halfY;
                        const maxY = pos.y + halfY;
                        const minZ = pos.z - halfZ;
                        const maxZ = pos.z + halfZ;

                        const vy0 = Math.floor(minY + COLL_EPS);
                        const vy1 = Math.floor(maxY - COLL_EPS);
                        const vz0 = Math.floor(minZ + COLL_EPS);
                        const vz1 = Math.floor(maxZ - COLL_EPS);

                        const aMinX = target - halfX;
                        const aMaxX = target + halfX;

                        if (delta > 0) {
                            const vx0 = Math.floor(pos.x + halfX);
                            const vx1 = Math.floor(target + halfX);
                            let best = target;

                            for (let x = vx0; x <= vx1; x++) {
                                for (let y = vy0; y <= vy1; y++) {
                                    for (let z = vz0; z <= vz1; z++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinX < x + 1 - COLL_EPS &&
                                            aMaxX > x + COLL_EPS &&
                                            minY < y + 1 - COLL_EPS &&
                                            maxY > y + COLL_EPS &&
                                            minZ < z + 1 - COLL_EPS &&
                                            maxZ > z + COLL_EPS
                                        ) {
                                            const cand = x - COLL_EPS - halfX;
                                            if (cand < best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.x = best;
                        } else {
                            const vx0 = Math.floor(pos.x - halfX);
                            const vx1 = Math.floor(target - halfX);
                            let best = target;

                            for (let x = vx1; x <= vx0; x++) {
                                for (let y = vy0; y <= vy1; y++) {
                                    for (let z = vz0; z <= vz1; z++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinX < x + 1 - COLL_EPS &&
                                            aMaxX > x + COLL_EPS &&
                                            minY < y + 1 - COLL_EPS &&
                                            maxY > y + COLL_EPS &&
                                            minZ < z + 1 - COLL_EPS &&
                                            maxZ > z + COLL_EPS
                                        ) {
                                            const cand =
                                                x + 1 + COLL_EPS + halfX;
                                            if (cand > best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.x = best;
                        }

                        if (collided) vel.x = 0;
                        return collided;
                    }

                    if (axis === "y") {
                        const target = pos.y + delta;

                        const minX = pos.x - halfX;
                        const maxX = pos.x + halfX;
                        const minZ = pos.z - halfZ;
                        const maxZ = pos.z + halfZ;

                        const vx0 = Math.floor(minX + COLL_EPS);
                        const vx1 = Math.floor(maxX - COLL_EPS);
                        const vz0 = Math.floor(minZ + COLL_EPS);
                        const vz1 = Math.floor(maxZ - COLL_EPS);

                        const aMinY = target - halfY;
                        const aMaxY = target + halfY;

                        if (delta > 0) {
                            const vy0 = Math.floor(pos.y + halfY);
                            const vy1 = Math.floor(target + halfY);
                            let best = target;

                            for (let y = vy0; y <= vy1; y++) {
                                for (let x = vx0; x <= vx1; x++) {
                                    for (let z = vz0; z <= vz1; z++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinY < y + 1 - COLL_EPS &&
                                            aMaxY > y + COLL_EPS &&
                                            minX < x + 1 - COLL_EPS &&
                                            maxX > x + COLL_EPS &&
                                            minZ < z + 1 - COLL_EPS &&
                                            maxZ > z + COLL_EPS
                                        ) {
                                            const cand = y - COLL_EPS - halfY;
                                            if (cand < best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.y = best;
                        } else {
                            const vy0 = Math.floor(pos.y - halfY);
                            const vy1 = Math.floor(target - halfY);
                            let best = target;

                            for (let y = vy1; y <= vy0; y++) {
                                for (let x = vx0; x <= vx1; x++) {
                                    for (let z = vz0; z <= vz1; z++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinY < y + 1 - COLL_EPS &&
                                            aMaxY > y + COLL_EPS &&
                                            minX < x + 1 - COLL_EPS &&
                                            maxX > x + COLL_EPS &&
                                            minZ < z + 1 - COLL_EPS &&
                                            maxZ > z + COLL_EPS
                                        ) {
                                            const cand =
                                                y + 1 + COLL_EPS + halfY;
                                            if (cand > best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.y = best;
                        }

                        if (collided) vel.y = 0;
                        return collided;
                    }

                    if (axis === "z") {
                        const target = pos.z + delta;

                        const minX = pos.x - halfX;
                        const maxX = pos.x + halfX;
                        const minY = pos.y - halfY;
                        const maxY = pos.y + halfY;

                        const vx0 = Math.floor(minX + COLL_EPS);
                        const vx1 = Math.floor(maxX - COLL_EPS);
                        const vy0 = Math.floor(minY + COLL_EPS);
                        const vy1 = Math.floor(maxY - COLL_EPS);

                        const aMinZ = target - halfZ;
                        const aMaxZ = target + halfZ;

                        if (delta > 0) {
                            const vz0 = Math.floor(pos.z + halfZ);
                            const vz1 = Math.floor(target + halfZ);
                            let best = target;

                            for (let z = vz0; z <= vz1; z++) {
                                for (let y = vy0; y <= vy1; y++) {
                                    for (let x = vx0; x <= vx1; x++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinZ < z + 1 - COLL_EPS &&
                                            aMaxZ > z + COLL_EPS &&
                                            minX < x + 1 - COLL_EPS &&
                                            maxX > x + COLL_EPS &&
                                            minY < y + 1 - COLL_EPS &&
                                            maxY > y + COLL_EPS
                                        ) {
                                            const cand = z - COLL_EPS - halfZ;
                                            if (cand < best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.z = best;
                        } else {
                            const vz0 = Math.floor(pos.z - halfZ);
                            const vz1 = Math.floor(target - halfZ);
                            let best = target;

                            for (let z = vz1; z <= vz0; z++) {
                                for (let y = vy0; y <= vy1; y++) {
                                    for (let x = vx0; x <= vx1; x++) {
                                        if (!isSolid(x, y, z)) continue;

                                        if (
                                            aMinZ < z + 1 - COLL_EPS &&
                                            aMaxZ > z + COLL_EPS &&
                                            minX < x + 1 - COLL_EPS &&
                                            maxX > x + COLL_EPS &&
                                            minY < y + 1 - COLL_EPS &&
                                            maxY > y + COLL_EPS
                                        ) {
                                            const cand =
                                                z + 1 + COLL_EPS + halfZ;
                                            if (cand > best) {
                                                best = cand;
                                                collided = true;
                                            }
                                        }
                                    }
                                }
                            }
                            pos.z = best;
                        }

                        if (collided) vel.z = 0;
                        return collided;
                    }

                    return false;
                }

                function updatePlayerPhysics(dt) {
                    const wasOnGround = player.onGround;

                    // Horizontal input
                    let fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
                    let str = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

                    let dirX = 0,
                        dirZ = 0;
                    if (fwd !== 0 || str !== 0) {
                        const len = Math.hypot(fwd, str);
                        fwd /= len;
                        str /= len;

                        const sinYaw = Math.sin(yaw);
                        const cosYaw = Math.cos(yaw);

                        // forward = (sin(yaw), cos(yaw))
                        // right   = (cos(yaw), -sin(yaw))
                        dirX = sinYaw * fwd + cosYaw * str;
                        dirZ = cosYaw * fwd - sinYaw * str;
                    }

                    const speed = wasOnGround ? WALK_SPEED : AIR_SPEED;

                    const desiredVx = dirX * speed;
                    const desiredVz = dirZ * speed;

                    if (dirX !== 0 || dirZ !== 0) {
                        const accel = wasOnGround ? ACCEL_GROUND : ACCEL_AIR;
                        const k = Math.min(1, accel * dt);
                        player.vel.x += (desiredVx - player.vel.x) * k;
                        player.vel.z += (desiredVz - player.vel.z) * k;
                    } else {
                        const damping = Math.exp(
                            -(wasOnGround ? FRICTION_GROUND : FRICTION_AIR) *
                                dt,
                        );
                        player.vel.x *= damping;
                        player.vel.z *= damping;
                    }

                    // Jump
                    let jumped = false;
                    if (wasOnGround && keys.jumpPressed) {
                        jumped = true;
                        player.vel.y = JUMP_VELOCITY;
                        keys.jumpPressed = false;
                        player.onGround = false;
                    }

                    // Horizontal move with collision + step
                    const x0 = player.pos.x,
                        y0 = player.pos.y,
                        z0 = player.pos.z;
                    const vxTry = player.vel.x,
                        vzTry = player.vel.z;
                    const dxMove = vxTry * dt;
                    const dzMove = vzTry * dt;

                    const colX1 = resolveAABBMoveAxis(
                        player.pos,
                        player.vel,
                        "x",
                        dxMove,
                        PLAYER_HALF_W,
                        PLAYER_HALF_H,
                        PLAYER_HALF_W,
                    );
                    const colZ1 = resolveAABBMoveAxis(
                        player.pos,
                        player.vel,
                        "z",
                        dzMove,
                        PLAYER_HALF_W,
                        PLAYER_HALF_H,
                        PLAYER_HALF_W,
                    );

                    if (
                        wasOnGround &&
                        !jumped &&
                        (colX1 || colZ1) &&
                        STEP_HEIGHT > 0
                    ) {
                        // Save state after the failed horizontal move
                        const state = {
                            x: player.pos.x,
                            y: player.pos.y,
                            z: player.pos.z,
                            vx: player.vel.x,
                            vy: player.vel.y,
                            vz: player.vel.z,
                        };

                        const raisedY = y0 + STEP_HEIGHT;

                        // Head clearance check
                        if (!playerCollidesAt(x0, raisedY, z0)) {
                            // Try at raised position
                            player.pos.x = x0;
                            player.pos.y = raisedY;
                            player.pos.z = z0;

                            player.vel.x = vxTry;
                            player.vel.y = 0;
                            player.vel.z = vzTry;

                            const colX2 = resolveAABBMoveAxis(
                                player.pos,
                                player.vel,
                                "x",
                                dxMove,
                                PLAYER_HALF_W,
                                PLAYER_HALF_H,
                                PLAYER_HALF_W,
                            );
                            const colZ2 = resolveAABBMoveAxis(
                                player.pos,
                                player.vel,
                                "z",
                                dzMove,
                                PLAYER_HALF_W,
                                PLAYER_HALF_H,
                                PLAYER_HALF_W,
                            );

                            if (!colX2 && !colZ2) {
                                // Drop back down onto the new ground
                                const dyDown = -(STEP_HEIGHT + 0.05);
                                const colDown = resolveAABBMoveAxis(
                                    player.pos,
                                    player.vel,
                                    "y",
                                    dyDown,
                                    PLAYER_HALF_W,
                                    PLAYER_HALF_H,
                                    PLAYER_HALF_W,
                                );

                                if (colDown && isGrounded()) {
                                    player.onGround = true;
                                } else {
                                    // Revert
                                    player.pos.x = state.x;
                                    player.pos.y = state.y;
                                    player.pos.z = state.z;
                                    player.vel.x = state.vx;
                                    player.vel.y = state.vy;
                                    player.vel.z = state.vz;
                                }
                            } else {
                                // Revert
                                player.pos.x = state.x;
                                player.pos.y = state.y;
                                player.pos.z = state.z;
                                player.vel.x = state.vx;
                                player.vel.y = state.vy;
                                player.vel.z = state.vz;
                            }
                        } else {
                            // Revert
                            player.pos.x = state.x;
                            player.pos.y = state.y;
                            player.pos.z = state.z;
                            player.vel.x = state.vx;
                            player.vel.y = state.vy;
                            player.vel.z = state.vz;
                        }
                    }

                    // Grounding after horizontal/step
                    player.onGround = isGrounded();

                    // Vertical physics
                    if (player.onGround) {
                        player.vel.y = 0;
                    } else {
                        player.vel.y -= GRAVITY * dt;
                    }

                    const dy = player.vel.y * dt;
                    resolveAABBMoveAxis(
                        player.pos,
                        player.vel,
                        "y",
                        dy,
                        PLAYER_HALF_W,
                        PLAYER_HALF_H,
                        PLAYER_HALF_W,
                    );

                    // Final grounded check
                    player.onGround = isGrounded();
                }

                // -------------------- Drops (gravity + pick-up) --------------------
                const DROP_SIZE = 0.18;
                const DROP_HALF = DROP_SIZE / 2;

                const DROP_GRAV_DRAG = 2.2;
                const MAX_DROPS = 200;

                const dropGeo = new THREE.BoxGeometry(
                    DROP_SIZE,
                    DROP_SIZE,
                    DROP_SIZE,
                );

                const dropMaterials = {};
                for (const type of [
                    BLOCK.GRASS,
                    BLOCK.DIRT,
                    BLOCK.STONE,
                    BLOCK.SAND,
                ]) {
                    const [r, g, b] = BLOCK_RGB[type];
                    dropMaterials[type] = new THREE.MeshStandardMaterial({
                        color: new THREE.Color(r, g, b),
                        roughness: 0.75,
                        metalness: 0.0,
                    });
                }

                const drops = [];

                function spawnDrop(type, bx, by, bz) {
                    if (type === BLOCK.AIR) return;
                    if (drops.length >= MAX_DROPS) {
                        // Remove oldest
                        const old = drops.shift();
                        scene.remove(old.mesh);
                    }

                    const d = {
                        type,
                        pos: { x: bx + 0.5, y: by + 0.5, z: bz + 0.5 },
                        vel: {
                            x: (Math.random() - 0.5) * 1.4,
                            y: 2.8 + Math.random() * 2.0,
                            z: (Math.random() - 0.5) * 1.4,
                        },
                        spin: {
                            x: (Math.random() * 2 - 1) * 10,
                            y: (Math.random() * 2 - 1) * 10,
                            z: (Math.random() * 2 - 1) * 10,
                        },
                        mesh: new THREE.Mesh(dropGeo, dropMaterials[type]),
                    };

                    d.mesh.position.set(d.pos.x, d.pos.y, d.pos.z);
                    d.mesh.rotation.set(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                    );

                    scene.add(d.mesh);
                    drops.push(d);
                }

                const inventoryCounts = new Uint32Array(5); // index by block id

                function updateInventoryUI() {
                    for (let i = 0; i < SLOT_TYPES.length; i++) {
                        const type = SLOT_TYPES[i];
                        const slot = slotEls[i];
                        slot.div.classList.toggle("active", i === activeSlot);
                        slot.swatch.style.backgroundColor = BLOCK_CSS[type];
                        slot.count.textContent = String(inventoryCounts[type]);
                    }

                    const activeType = SLOT_TYPES[activeSlot];
                    selectedNameEl.textContent = activeType
                        ? `Selected: ${BLOCK_NAME[activeType]} (${inventoryCounts[activeType]})`
                        : "Selected: —";
                }

                function updateDropsPhysics(dt) {
                    let inventoryChanged = false;

                    const px = player.pos.x,
                        py = player.pos.y,
                        pz = player.pos.z;
                    const pickupR = 1.35;
                    const pickupR2 = pickupR * pickupR;

                    for (let i = drops.length - 1; i >= 0; i--) {
                        const d = drops[i];

                        // gravity
                        d.vel.y -= GRAVITY * dt;

                        // air drag
                        const drag = Math.exp(-DROP_GRAV_DRAG * dt);
                        d.vel.x *= drag;
                        d.vel.z *= drag;

                        const dx = d.vel.x * dt;
                        const dy = d.vel.y * dt;
                        const dz = d.vel.z * dt;

                        resolveAABBMoveAxis(
                            d.pos,
                            d.vel,
                            "x",
                            dx,
                            DROP_HALF,
                            DROP_HALF,
                            DROP_HALF,
                        );
                        const collidedY = resolveAABBMoveAxis(
                            d.pos,
                            d.vel,
                            "y",
                            dy,
                            DROP_HALF,
                            DROP_HALF,
                            DROP_HALF,
                        );
                        resolveAABBMoveAxis(
                            d.pos,
                            d.vel,
                            "z",
                            dz,
                            DROP_HALF,
                            DROP_HALF,
                            DROP_HALF,
                        );

                        // extra damping when on ground
                        if (collidedY && dy < 0) {
                            d.vel.x *= 0.6;
                            d.vel.z *= 0.6;
                        }

                        d.mesh.position.set(d.pos.x, d.pos.y, d.pos.z);
                        d.mesh.rotation.x += d.spin.x * dt;
                        d.mesh.rotation.y += d.spin.y * dt;
                        d.mesh.rotation.z += d.spin.z * dt;

                        // pickup check (auto)
                        const ddx = d.pos.x - px;
                        const ddy = d.pos.y - py;
                        const ddz = d.pos.z - pz;
                        if (ddx * ddx + ddy * ddy + ddz * ddz <= pickupR2) {
                            inventoryCounts[d.type] += 1;
                            inventoryChanged = true;

                            scene.remove(d.mesh);
                            drops.splice(i, 1);
                        }
                    }

                    if (inventoryChanged) updateInventoryUI();
                }

                // -------------------- Voxel Raycast (DDA) --------------------
                const MAX_INTERACT_DIST = 7.2;

                function raycastVoxels(origin, dir, maxDistance) {
                    // Offset slightly to reduce self-hit
                    const ox = origin.x + dir.x * 0.02;
                    const oy = origin.y + dir.y * 0.02;
                    const oz = origin.z + dir.z * 0.02;

                    let x = Math.floor(ox);
                    let y = Math.floor(oy);
                    let z = Math.floor(oz);

                    const stepX = dir.x > 0 ? 1 : dir.x < 0 ? -1 : 0;
                    const stepY = dir.y > 0 ? 1 : dir.y < 0 ? -1 : 0;
                    const stepZ = dir.z > 0 ? 1 : dir.z < 0 ? -1 : 0;

                    let tMaxX, tMaxY, tMaxZ;
                    let tDeltaX, tDeltaY, tDeltaZ;

                    if (stepX !== 0) {
                        const nextBoundaryX = stepX > 0 ? x + 1 : x;
                        tMaxX = (nextBoundaryX - ox) / dir.x;
                        tDeltaX = 1 / Math.abs(dir.x);
                    } else {
                        tMaxX = Infinity;
                        tDeltaX = Infinity;
                    }

                    if (stepY !== 0) {
                        const nextBoundaryY = stepY > 0 ? y + 1 : y;
                        tMaxY = (nextBoundaryY - oy) / dir.y;
                        tDeltaY = 1 / Math.abs(dir.y);
                    } else {
                        tMaxY = Infinity;
                        tDeltaY = Infinity;
                    }

                    if (stepZ !== 0) {
                        const nextBoundaryZ = stepZ > 0 ? z + 1 : z;
                        tMaxZ = (nextBoundaryZ - oz) / dir.z;
                        tDeltaZ = 1 / Math.abs(dir.z);
                    } else {
                        tMaxZ = Infinity;
                        tDeltaZ = Infinity;
                    }

                    let normalX = 0,
                        normalY = 0,
                        normalZ = 0;
                    let t = 0;

                    const maxSteps = Math.ceil(maxDistance * 3) + 20;

                    for (let i = 0; i < maxSteps; i++) {
                        if (t > maxDistance) break;

                        if (isSolid(x, y, z)) {
                            return {
                                x,
                                y,
                                z,
                                normal: { x: normalX, y: normalY, z: normalZ },
                                distance: t,
                            };
                        }

                        if (tMaxX < tMaxY) {
                            if (tMaxX < tMaxZ) {
                                x += stepX;
                                t = tMaxX;
                                tMaxX += tDeltaX;
                                normalX = -stepX;
                                normalY = 0;
                                normalZ = 0;
                            } else {
                                z += stepZ;
                                t = tMaxZ;
                                tMaxZ += tDeltaZ;
                                normalX = 0;
                                normalY = 0;
                                normalZ = -stepZ;
                            }
                        } else {
                            if (tMaxY < tMaxZ) {
                                y += stepY;
                                t = tMaxY;
                                tMaxY += tDeltaY;
                                normalX = 0;
                                normalY = -stepY;
                                normalZ = 0;
                            } else {
                                z += stepZ;
                                t = tMaxZ;
                                tMaxZ += tDeltaZ;
                                normalX = 0;
                                normalY = 0;
                                normalZ = -stepZ;
                            }
                        }
                    }
                    return null;
                }

                // -------------------- Controls / UI / Loop --------------------
                const helpEl = document.getElementById("help");
                const selectedNameEl = document.getElementById("selectedName");
                const inventoryEl = document.getElementById("inventory");

                // Build inventory UI
                const slotEls = [];
                for (let i = 0; i < SLOT_TYPES.length; i++) {
                    const type = SLOT_TYPES[i];
                    const div = document.createElement("div");
                    div.className = "slot";

                    const swatch = document.createElement("div");
                    swatch.className = "swatch";
                    swatch.style.backgroundColor = BLOCK_CSS[type];

                    const count = document.createElement("div");
                    count.className = "count";
                    count.textContent = "0";

                    div.appendChild(swatch);
                    div.appendChild(count);

                    inventoryEl.appendChild(div);
                    slotEls.push({ div, swatch, count });
                }

                let activeSlot = 0;

                function setActiveSlot(i) {
                    activeSlot = (i + SLOT_TYPES.length) % SLOT_TYPES.length;
                    updateInventoryUI();
                }

                updateInventoryUI();

                const keys = {
                    KeyW: false,
                    KeyA: false,
                    KeyS: false,
                    KeyD: false,
                    jumpPressed: false,
                };

                let locked = false;

                let leftDown = false;
                let rightDown = false;

                const yawPitch = { yaw: 0, pitch: 0 };
                let yaw = 0;
                let pitch = 0.1;

                const camDir = new THREE.Vector3();

                canvas.addEventListener("click", () => {
                    if (!locked) canvas.requestPointerLock();
                });

                document.addEventListener("pointerlockchange", () => {
                    locked = document.pointerLockElement === canvas;
                    helpEl.style.display = locked ? "none" : "block";
                });

                window.addEventListener("mousemove", (e) => {
                    if (!locked) return;
                    const sens = 0.0025;
                    yaw -= e.movementX * sens;
                    pitch -= e.movementY * sens;
                    pitch = clamp(
                        pitch,
                        -Math.PI / 2 + 0.02,
                        Math.PI / 2 - 0.02,
                    );
                });

                window.addEventListener("keydown", (e) => {
                    if (e.code === "KeyW") keys.KeyW = true;
                    if (e.code === "KeyS") keys.KeyS = true;
                    if (e.code === "KeyA") keys.KeyA = true;
                    if (e.code === "KeyD") keys.KeyD = true;

                    if (e.code === "Space") {
                        if (!keys.spaceHeld) {
                            keys.spaceHeld = true;
                            keys.jumpPressed = true;
                        }
                        e.preventDefault();
                    }

                    if (e.code && e.code.startsWith("Digit")) {
                        const n = parseInt(e.code.slice(5), 10);
                        if (n >= 1 && n <= SLOT_TYPES.length) {
                            setActiveSlot(n - 1);
                            e.preventDefault();
                        }
                    }
                });

                window.addEventListener("keyup", (e) => {
                    if (e.code === "KeyW") keys.KeyW = false;
                    if (e.code === "KeyS") keys.KeyS = false;
                    if (e.code === "KeyA") keys.KeyA = false;
                    if (e.code === "KeyD") keys.KeyD = false;

                    if (e.code === "Space") keys.spaceHeld = false;
                });

                window.addEventListener("mousedown", (e) => {
                    if (!locked) return;
                    if (e.button === 0) {
                        leftDown = true;
                        e.preventDefault();
                    }
                    if (e.button === 2) {
                        rightDown = true;
                        e.preventDefault();
                    }
                });

                window.addEventListener("mouseup", (e) => {
                    if (e.button === 0) leftDown = false;
                    if (e.button === 2) rightDown = false;
                });

                window.addEventListener("contextmenu", (e) =>
                    e.preventDefault(),
                );

                window.addEventListener(
                    "wheel",
                    (e) => {
                        if (!locked) return;
                        e.preventDefault();
                        const dir = e.deltaY > 0 ? 1 : -1;
                        setActiveSlot(activeSlot + dir);
                    },
                    { passive: false },
                );

                // Spawn position
                function setSpawn() {
                    const h = terrainHeight(0, 0);
                    const groundTop = h + 1;

                    player.pos.x = 0.5;
                    player.pos.z = 0.5;
                    // Start slightly above ground so gravity settles and collision sets ground
                    player.pos.y = groundTop + PLAYER_HALF_H + 0.25;
                    player.vel.x = 0;
                    player.vel.y = 0;
                    player.vel.z = 0;
                    player.onGround = false;
                }
                setSpawn();

                // Interaction cooldown
                let lastMineTime = -1e9;
                let lastPlaceTime = -1e9;
                const MINE_COOLDOWN = 0.12;
                const PLACE_COOLDOWN = 0.1;

                function getCameraDirection() {
                    const cp = Math.cos(pitch);
                    const sp = Math.sin(pitch);
                    camDir.set(Math.sin(yaw) * cp, sp, Math.cos(yaw) * cp);
                    return camDir.normalize();
                }

                function updateCamera() {
                    camera.position.set(
                        player.pos.x,
                        player.pos.y + PLAYER_EYE_OFFSET,
                        player.pos.z,
                    );
                    camera.rotation.x = pitch;
                    camera.rotation.y = yaw;
                }

                function canPlaceAt(px, py, pz) {
                    const type = SLOT_TYPES[activeSlot];
                    if (inventoryCounts[type] <= 0) return false;
                    if (py < 0 || py >= CHUNK_HEIGHT) return false;
                    if (getBlockTypeAt(px, py, pz) !== BLOCK.AIR) return false;
                    if (blockIntersectsPlayer(px, py, pz)) return false;
                    return true;
                }

                function applyMineOrPlace(rayHit, nowSec) {
                    if (!rayHit) return;

                    const hitX = rayHit.x,
                        hitY = rayHit.y,
                        hitZ = rayHit.z;

                    // Mine
                    if (leftDown && nowSec - lastMineTime >= MINE_COOLDOWN) {
                        if (hitY >= 0 && hitY < CHUNK_HEIGHT) {
                            const t = getBlockTypeAt(hitX, hitY, hitZ);
                            if (t !== BLOCK.AIR) {
                                setBlock(hitX, hitY, hitZ, BLOCK.AIR);
                                spawnDrop(t, hitX, hitY, hitZ);
                                lastMineTime = nowSec;
                            }
                        }
                    }

                    // Place
                    if (rightDown && nowSec - lastPlaceTime >= PLACE_COOLDOWN) {
                        const selectedType = SLOT_TYPES[activeSlot];
                        if (inventoryCounts[selectedType] <= 0) return;

                        const nx = rayHit.normal.x,
                            ny = rayHit.normal.y,
                            nz = rayHit.normal.z;
                        const px = hitX + nx,
                            py = hitY + ny,
                            pz = hitZ + nz;

                        if (canPlaceAt(px, py, pz)) {
                            setBlock(px, py, pz, selectedType);
                            inventoryCounts[selectedType] -= 1;
                            updateInventoryUI();
                            lastPlaceTime = nowSec;
                        }
                    }
                }

                // Highlight target box
                function updateTargetHighlight(rayHit) {
                    if (!rayHit || rayHit.y < 0 || rayHit.y >= CHUNK_HEIGHT) {
                        targetBox.visible = false;
                        return null;
                    }

                    if (rightDown) {
                        const nx = rayHit.normal.x,
                            ny = rayHit.normal.y,
                            nz = rayHit.normal.z;
                        const px = rayHit.x + nx,
                            py = rayHit.y + ny,
                            pz = rayHit.z + nz;
                        const ok = canPlaceAt(px, py, pz);

                        if (py < 0 || py >= CHUNK_HEIGHT) {
                            targetBox.visible = false;
                            return rayHit;
                        }

                        targetBox.material.color.set(ok ? 0x33ff66 : 0xff3355);
                        targetBox.position.set(px + 0.5, py + 0.5, pz + 0.5);
                        targetBox.visible = true;
                        return rayHit;
                    } else {
                        targetBox.material.color.set(0xffcc33);
                        targetBox.position.set(
                            rayHit.x + 0.5,
                            rayHit.y + 0.5,
                            rayHit.z + 0.5,
                        );
                        targetBox.visible = true;
                        return rayHit;
                    }
                }

                // Resize
                window.addEventListener("resize", () => {
                    renderer.setSize(
                        window.innerWidth,
                        window.innerHeight,
                        false,
                    );
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                });

                // Preload chunks near spawn for visuals
                let lastChunkX = null,
                    lastChunkZ = null;
                function maybeUpdateChunks() {
                    const pcx = Math.floor(player.pos.x / CHUNK_SIZE);
                    const pcz = Math.floor(player.pos.z / CHUNK_SIZE);
                    if (pcx !== lastChunkX || pcz !== lastChunkZ) {
                        lastChunkX = pcx;
                        lastChunkZ = pcz;
                        updateWorldChunks(pcx, pcz);
                    }
                }
                maybeUpdateChunks();

                // Main loop
                const fixedStep = 1 / 120;
                let accumulator = 0;
                let prev = performance.now() * 0.001;

                function frame() {
                    const now = performance.now() * 0.001;
                    let dt = now - prev;
                    prev = now;
                    dt = Math.min(dt, 0.05);
                    accumulator += dt;

                    while (accumulator >= fixedStep) {
                        if (locked) {
                            updatePlayerPhysics(fixedStep);
                            if (drops.length) updateDropsPhysics(fixedStep);
                        }
                        accumulator -= fixedStep;
                    }

                    // camera + visuals
                    updateCamera();
                    maybeUpdateChunks();

                    let rayHit = null;
                    if (locked) {
                        const dir = getCameraDirection();
                        rayHit = raycastVoxels(
                            camera.position,
                            dir,
                            MAX_INTERACT_DIST,
                        );
                        updateTargetHighlight(rayHit);

                        applyMineOrPlace(rayHit, now);
                    } else {
                        targetBox.visible = false;
                    }

                    renderer.render(scene, camera);
                    requestAnimationFrame(frame);
                }

                requestAnimationFrame(frame);
            })();
        </script>
    </body>
</html>
