<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Voxel Sandbox</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                user-select: none;
                font-family: system-ui, sans-serif;
            }
            canvas {
                display: block;
            }

            #crosshair {
                position: fixed;
                left: 50%;
                top: 50%;
                width: 8px;
                height: 8px;
                background: rgba(255, 255, 255, 0.85);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                z-index: 10;
            }

            #bar {
                position: fixed;
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 6px;
                padding: 6px 10px;
                background: rgba(0, 0, 0, 0.45);
                border-radius: 10px;
                pointer-events: none;
                z-index: 10;
            }

            .slot {
                width: 62px;
                height: 62px;
                border: 3px solid rgba(255, 255, 255, 0.35);
                border-radius: 6px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: #fff;
                font-weight: 500;
                transition: border-color 0.1s;
            }
            .slot .name {
                font-size: 10px;
                opacity: 0.9;
            }
            .slot .count {
                font-size: 18px;
                font-weight: 700;
            }
            .slot.active {
                border-color: #fff;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            }

            #overlay {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                text-align: center;
                pointer-events: auto;
                z-index: 20;
            }
            #overlay h1 {
                margin: 0 0 0.2em;
                font-size: 48px;
            }
            #overlay p {
                margin: 0.2em 0;
                opacity: 0.85;
            }
            #overlay ul {
                text-align: left;
                opacity: 0.8;
                line-height: 1.8;
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/controls/PointerLockControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js"
                }
            }
        </script>
    </head>
    <body>
        <div id="overlay">
            <h1>Voxel Sandbox</h1>
            <p>Click anywhere to play / unpause</p>
            <ul>
                <li><b>LMB</b> — mine a block</li>
                <li><b>RMB</b> — place the selected block</li>
                <li><b>WASD</b> — move</li>
                <li><b>Space</b> — jump</li>
                <li><b>1-4</b> — select inventory slot</li>
            </ul>
        </div>
        <div id="crosshair"></div>
        <div id="bar"></div>

        <script type="module">
            import * as THREE from "three";
            import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

            // ------------------------------------------------------------------
            // Constants
            // ------------------------------------------------------------------
            const CW = 16; // chunk width/depth in blocks
            const CH = 40; // chunk height in blocks
            const REACH = 5; // block placing/breaking range
            const RENDER_R = 5; // chunk load radius around player
            const MAX_INSTANCES = CW * CW * CH;
            const EYE_HEIGHT = 1.65;
            const PLAYER_HEIGHT = 1.85;
            const PLAYER_WIDTH = 0.6; // total width, half = 0.3

            const TYPE_IDS = [1, 2, 3, 4];
            const TYPE_NAMES = { 1: "Grass", 2: "Dirt", 3: "Stone", 4: "Sand" };
            const COLORS = [
                new THREE.Color(0x888888), // unused / air base
                new THREE.Color(0x6ca550), // grass
                new THREE.Color(0x8a5a3a), // dirt
                new THREE.Color(0x808080), // stone
                new THREE.Color(0xe3c868), // sand
            ];

            // ------------------------------------------------------------------
            // Scene setup
            // ------------------------------------------------------------------
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(
                0x87ceeb,
                RENDER_R * CW * 0.7,
                RENDER_R * CW * 1.2,
            );

            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                300,
            );
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 0.55);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.85);
            sun.position.set(60, 120, 40);
            scene.add(sun);

            const controls = new PointerLockControls(camera, document.body);

            // ------------------------------------------------------------------
            // Materials
            // ------------------------------------------------------------------
            const chunkGeo = new THREE.BoxGeometry(1, 1, 1);
            const chunkMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const dropGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);

            // ------------------------------------------------------------------
            // World state
            // ------------------------------------------------------------------
            const worldChunks = new Map(); // key -> chunk object
            const chunkQueue = [];
            const drops = [];
            const key = (cx, cz) => `${cx},${cz}`;

            const playerPos = new THREE.Vector3();
            const velocity = new THREE.Vector3();
            let onGround = false;

            const inventory = { 1: 0, 2: 0, 3: 0, 4: 0 };
            let selectedSlot = 0;

            // ------------------------------------------------------------------
            // Noise
            // ------------------------------------------------------------------
            function hash2(a, b) {
                let h = (a * 374761 + b * 668265) | 0;
                h = (h ^ (h >>> 13)) * 1274127313;
                return ((h ^ (h >>> 16)) & 0x7fffffff) / 0x7fffffff;
            }

            function smooth(t) {
                return t * t * (3 - 2 * t);
            }

            function terrainHeight(x, z) {
                const biome = hash2(Math.floor(x / 220), Math.floor(z / 220)); // 0..1
                const shape =
                    hash2(Math.floor(x / 70), Math.floor(z / 70)) * 0.5 +
                    hash2(Math.floor(x / 35), Math.floor(z / 35)) * 0.25 +
                    hash2(Math.floor(x / 17), Math.floor(z / 17)) * 0.125 +
                    hash2(Math.floor(x / 8), Math.floor(z / 8)) * 0.0625;
                const bottom = biome < 0.32 ? 8 : 15;
                const amp = biome < 0.32 ? 5 : 17;
                return Math.max(2, Math.min(CH - 2, bottom + shape * amp));
            }

            // ------------------------------------------------------------------
            // Voxel helpers
            // ------------------------------------------------------------------
            function getChunk(cx, cz) {
                return worldChunks.get(key(cx, cz));
            }

            function worldToLocalX(wx, cx) {
                return wx - cx * CW;
            }
            function worldToLocalZ(wz, cz) {
                return wz - cz * CW;
            }

            function chunkIndex(lx, lz, y) {
                return (lz * CW + lx) * CH + y;
            }

            function getBlock(x, y, z) {
                if (y < 0 || y >= CH) return 0;
                const cx = Math.floor(x / CW);
                const cz = Math.floor(z / CW);
                const c = getChunk(cx, cz);
                if (!c) return 0;
                const lx = worldToLocalX(x, cx);
                const lz = worldToLocalZ(z, cz);
                return c.data[chunkIndex(lx, lz, y)];
            }

            function setBlock(x, y, z, id) {
                if (y < 0 || y >= CH) return;
                const cx = Math.floor(x / CW);
                const cz = Math.floor(z / CW);
                const c = getChunk(cx, cz);
                if (!c) return;

                const lx = worldToLocalX(x, cx);
                const lz = worldToLocalZ(z, cz);

                if (c.data[chunkIndex(lx, lz, y)] === id) return;
                c.data[chunkIndex(lx, lz, y)] = id;

                rebuildChunk(c);

                // if we touched a chunk edge, rebuild the neighbor too
                const neighbors = [];
                if (lx === 0) neighbors.push(key(cx - 1, cz));
                if (lx === CW - 1) neighbors.push(key(cx + 1, cz));
                if (lz === 0) neighbors.push(key(cx, cz - 1));
                if (lz === CW - 1) neighbors.push(key(cx, cz + 1));

                for (const nk of neighbors) {
                    const nc = worldChunks.get(nk);
                    if (nc) rebuildChunk(nc);
                }
            }

            function chunkGetLocal(c, lx, y, lz) {
                if (
                    lx >= 0 &&
                    lx < CW &&
                    y >= 0 &&
                    y < CH &&
                    lz >= 0 &&
                    lz < CW
                ) {
                    return c.data[chunkIndex(lx, lz, y)];
                }
                const wx = c.cx * CW + lx;
                const wz = c.cz * CW + lz;
                return getBlock(wx, y, wz);
            }

            // ------------------------------------------------------------------
            // Chunk meshing
            // ------------------------------------------------------------------
            const tmpObj = new THREE.Object3D();
            function rebuildChunk(c) {
                if (!c.mesh) {
                    c.mesh = new THREE.InstancedMesh(
                        chunkGeo,
                        chunkMat,
                        MAX_INSTANCES,
                    );
                    c.mesh.count = 0;
                    c.mesh.position.set(c.cx * CW, 0, c.cz * CW);
                    scene.add(c.mesh);
                }
                let i = 0;
                for (let z = 0; z < CW; z++) {
                    for (let x = 0; x < CW; x++) {
                        for (let y = 0; y < CH; y++) {
                            const id = c.data[chunkIndex(x, z, y)]; // (x,z,y) layout
                            if (!id) continue;

                            // cull faces buried on all sides
                            if (
                                chunkGetLocal(c, x, y + 1, z) &&
                                chunkGetLocal(c, x, y - 1, z) &&
                                chunkGetLocal(c, x + 1, y, z) &&
                                chunkGetLocal(c, x - 1, y, z) &&
                                chunkGetLocal(c, x, y, z + 1) &&
                                chunkGetLocal(c, x, y, z - 1)
                            )
                                continue;

                            tmpObj.position.set(x + 0.5, y + 0.5, z + 0.5);
                            tmpObj.updateMatrix();
                            c.mesh.setMatrixAt(i, tmpObj.matrix);
                            c.mesh.setColorAt(i, COLORS[id]);
                            i++;
                        }
                    }
                }
                c.mesh.count = i;
                c.mesh.instanceMatrix.needsUpdate = true;
                if (c.mesh.instanceColor)
                    c.mesh.instanceColor.needsUpdate = true;
            }

            function createChunk(cx, cz) {
                const data = new Uint8Array(CW * CW * CH);
                const ox = cx * CW,
                    oz = cz * CW;

                for (let x = 0; x < CW; x++) {
                    for (let z = 0; z < CW; z++) {
                        const wx = ox + x;
                        const wz = oz + z;
                        const h = Math.floor(terrainHeight(wx, wz));

                        for (let y = 0; y <= h; y++) {
                            let id = 3;
                            if (y === h) {
                                id = h <= 7 ? 4 : 1;
                            } else if (y >= h - 3) {
                                id = 2;
                            }
                            data[chunkIndex(x, z, y)] = id;
                        }
                    }
                }

                const c = { cx, cz, data, mesh: null };
                worldChunks.set(key(cx, cz), c);
                rebuildChunk(c);
                return c;
            }

            // ------------------------------------------------------------------
            // Terrain streaming
            // ------------------------------------------------------------------
            function updateChunks() {
                const pcx = Math.floor(playerPos.x / CW);
                const pcz = Math.floor(playerPos.z / CW);

                chunkQueue.length = 0;

                const active = new Set();
                for (let dx = -RENDER_R; dx <= RENDER_R; dx++) {
                    for (let dz = -RENDER_R; dz <= RENDER_R; dz++) {
                        const cx = pcx + dx;
                        const cz = pcz + dz;
                        const k = key(cx, cz);
                        active.add(k);
                        if (!worldChunks.has(k)) {
                            chunkQueue.push({ cx, cz, d: dx * dx + dz * dz });
                        }
                    }
                }

                // unload distant chunks
                for (const [k, c] of worldChunks) {
                    if (!active.has(k)) {
                        const dx = c.cx - pcx,
                            dz = c.cz - pcz;
                        if (
                            dx * dx + dz * dz >
                            (RENDER_R + 1) * (RENDER_R + 1)
                        ) {
                            scene.remove(c.mesh);
                            c.mesh = null;
                            worldChunks.delete(k);
                        }
                    }
                }
            }

            function processChunks(perFrame) {
                if (!chunkQueue.length) return;
                chunkQueue.sort((a, b) => a.d - b.d);
                for (
                    let i = 0;
                    i < Math.min(perFrame, chunkQueue.length);
                    i++
                ) {
                    const job = chunkQueue.shift();
                    createChunk(job.cx, job.cz);
                }
            }

            // ------------------------------------------------------------------
            // Player physics
            // ------------------------------------------------------------------
            function testPosition(pos) {
                const x0 = Math.floor(pos.x - PLAYER_WIDTH * 0.5);
                const x1 = Math.floor(pos.x + PLAYER_WIDTH * 0.5 - 0.001);
                const z0 = Math.floor(pos.z - PLAYER_WIDTH * 0.5);
                const z1 = Math.floor(pos.z + PLAYER_WIDTH * 0.5 - 0.001);
                const y0 = Math.floor(pos.y);
                const y1 = Math.floor(pos.y + PLAYER_HEIGHT - 0.001);

                for (let y = y0; y <= y1; y++) {
                    for (let x = x0; x <= x1; x++) {
                        for (let z = z0; z <= z1; z++) {
                            if (getBlock(x, y, z) !== 0) return false;
                        }
                    }
                }
                return true;
            }

            function moveAxis(pos, axis, target, velocity) {
                const current = pos[axis];
                pos[axis] = target;
                if (testPosition(pos)) return true;

                let low = current,
                    high = target;
                for (let k = 0; k < 8; k++) {
                    const mid = (low + high) * 0.5;
                    pos[axis] = mid;
                    if (testPosition(pos)) low = mid;
                    else high = mid;
                }
                pos[axis] = low;
                velocity[axis] = 0;
                return false;
            }

            function updatePlayer(dt) {
                dt = Math.min(dt, 0.05);

                const yaw = camera.rotation.y;
                const forward = new THREE.Vector3(
                    Math.sin(yaw),
                    0,
                    -Math.cos(yaw),
                );
                const right = new THREE.Vector3(
                    Math.cos(yaw),
                    0,
                    Math.sin(yaw),
                );

                const fwd =
                    (keyState["KeyW"] ? 1 : 0) - (keyState["KeyS"] ? 1 : 0);
                const str =
                    (keyState["KeyD"] ? 1 : 0) - (keyState["KeyA"] ? 1 : 0);

                const desired = new THREE.Vector3()
                    .addScaledVector(forward, fwd)
                    .addScaledVector(right, str);

                if (desired.lengthSq() > 0) desired.normalize();
                let speed = 5.0;
                if (keyState["ShiftLeft"] || keyState["ShiftRight"])
                    speed = 8.0;

                if (onGround) {
                    velocity.x = desired.x * speed;
                    velocity.z = desired.z * speed;
                } else {
                    velocity.x += desired.x * speed * 0.4 * dt;
                    velocity.z += desired.z * speed * 0.4 * dt;
                }

                velocity.y -= 24.0 * dt; // gravity

                const vyBefore = velocity.y;
                const next = playerPos.clone();

                const xTarget = playerPos.x + velocity.x * dt;
                const zTarget = playerPos.z + velocity.z * dt;
                const yTarget = playerPos.y + velocity.y * dt;

                moveAxis(next, "x", xTarget, velocity);
                moveAxis(next, "z", zTarget, velocity);
                moveAxis(next, "y", yTarget, velocity);

                onGround = false;
                if (vyBefore <= 0 && yTarget - next.y > 0.001) onGround = true;

                playerPos.copy(next);
                camera.position.set(
                    playerPos.x,
                    playerPos.y + EYE_HEIGHT,
                    playerPos.z,
                );
            }

            // ------------------------------------------------------------------
            // Interaction
            // ------------------------------------------------------------------
            function raycastVoxel(origin, dir, maxDist = REACH) {
                let ix = Math.floor(origin.x);
                let iy = Math.floor(origin.y);
                let iz = Math.floor(origin.z);

                const sx = dir.x > 0 ? 1 : -1;
                const sy = dir.y > 0 ? 1 : -1;
                const sz = dir.z > 0 ? 1 : -1;

                const dx = dir.x === 0 ? Infinity : Math.abs(1 / dir.x);
                const dy = dir.y === 0 ? Infinity : Math.abs(1 / dir.y);
                const dz = dir.z === 0 ? Infinity : Math.abs(1 / dir.z);

                let tx =
                    dir.x === 0
                        ? Infinity
                        : sx > 0
                          ? (ix + 1 - origin.x) / dir.x
                          : (origin.x - ix) / -dir.x;
                let ty =
                    dir.y === 0
                        ? Infinity
                        : sy > 0
                          ? (iy + 1 - origin.y) / dir.y
                          : (origin.y - iy) / -dir.y;
                let tz =
                    dir.z === 0
                        ? Infinity
                        : sz > 0
                          ? (iz + 1 - origin.z) / dir.z
                          : (origin.z - iz) / -dir.z;

                const normal = new THREE.Vector3();
                while (tx < maxDist || ty < maxDist || tz < maxDist) {
                    // skip if starting inside a block
                    if (getBlock(ix, iy, iz) !== 0) {
                        return { x: ix, y: iy, z: iz, normal: normal.clone() };
                    }

                    if (tx <= ty && tx <= tz) {
                        ix += sx;
                        tx += dx;
                        normal.set(-sx, 0, 0);
                    } else if (ty <= tz) {
                        iy += sy;
                        ty += dy;
                        normal.set(0, -sy, 0);
                    } else {
                        iz += sz;
                        tz += dz;
                        normal.set(0, 0, -sz);
                    }
                }
                return null;
            }

            function blockCollidesPlayer(tx, ty, tz) {
                const bx1 = tx,
                    bx2 = tx + 1;
                const by1 = ty,
                    by2 = ty + 1;
                const bz1 = tz,
                    bz2 = tz + 1;

                const px1 = playerPos.x - PLAYER_WIDTH * 0.5;
                const px2 = playerPos.x + PLAYER_WIDTH * 0.5;
                const py1 = playerPos.y;
                const py2 = playerPos.y + PLAYER_HEIGHT;
                const pz1 = playerPos.z - PLAYER_WIDTH * 0.5;
                const pz2 = playerPos.z + PLAYER_WIDTH * 0.5;

                return !(
                    bx2 <= px1 ||
                    bx1 >= px2 ||
                    by2 <= py1 ||
                    by1 >= py2 ||
                    bz2 <= pz1 ||
                    bz1 >= pz2
                );
            }

            function handleMine() {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                const hit = raycastVoxel(camera.position, dir);
                if (!hit) return;

                const id = getBlock(hit.x, hit.y, hit.z);
                if (!id) return;

                setBlock(hit.x, hit.y, hit.z, 0);

                const dropMat = new THREE.MeshLambertMaterial({
                    color: COLORS[id],
                });
                const mesh = new THREE.Mesh(dropGeo, dropMat);
                mesh.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);
                scene.add(mesh);

                drops.push({
                    mesh,
                    id,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        3.5,
                        (Math.random() - 0.5) * 2,
                    ),
                    active: true,
                });
            }

            function handlePlace() {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                const hit = raycastVoxel(camera.position, dir);
                if (!hit) return;

                const tx = hit.x + hit.normal.x;
                const ty = hit.y + hit.normal.y;
                const tz = hit.z + hit.normal.z;

                if (getBlock(tx, ty, tz) !== 0) return;
                if (blockCollidesPlayer(tx, ty, tz)) return;

                const itemType = TYPE_IDS[selectedSlot];
                if (inventory[itemType] <= 0) return;

                setBlock(tx, ty, tz, itemType);
                inventory[itemType]--;
                updateUI();
            }

            // ------------------------------------------------------------------
            // Drops
            // ------------------------------------------------------------------
            function updateDrops(dt) {
                const center = new THREE.Vector3(
                    playerPos.x,
                    playerPos.y + PLAYER_HEIGHT * 0.5,
                    playerPos.z,
                );
                for (const d of drops) {
                    if (!d.active) continue;

                    d.mesh.rotation.x += dt * 4;
                    d.mesh.rotation.y += dt * 6;

                    d.vel.y -= 28.0 * dt;
                    d.mesh.position.y += d.vel.y * dt;

                    // floor collision
                    const gy = Math.floor(d.mesh.position.y - 0.14);
                    if (
                        gy >= 0 &&
                        gy < CH &&
                        getBlock(
                            Math.floor(d.mesh.position.x),
                            gy,
                            Math.floor(d.mesh.position.z),
                        ) !== 0
                    ) {
                        d.mesh.position.y = gy + 1 + 0.14;
                        d.vel.y = 0;
                    }
                    if (d.mesh.position.y < -50) d.active = false;

                    // pick-up
                    if (d.mesh.position.distanceTo(center) < 1.7) {
                        inventory[d.id]++;
                        scene.remove(d.mesh);
                        d.mesh.geometry.dispose();
                        d.mesh.material.dispose();
                        d.active = false;
                        updateUI();
                    }
                }
                for (let i = drops.length - 1; i >= 0; i--) {
                    if (!drops[i].active) drops.splice(i, 1);
                }
            }

            // ------------------------------------------------------------------
            // Input
            // ------------------------------------------------------------------
            const keyState = {};

            window.addEventListener("keydown", (e) => {
                keyState[e.code] = true;

                if (controls.isLocked) {
                    if (e.code === "Space" && onGround) {
                        velocity.y = 8.8;
                        onGround = false;
                    }
                    if (e.code === "Digit1") selectSlot(0);
                    if (e.code === "Digit2") selectSlot(1);
                    if (e.code === "Digit3") selectSlot(2);
                    if (e.code === "Digit4") selectSlot(3);
                }

                if (e.code === "Space") e.preventDefault();
            });

            window.addEventListener("keyup", (e) => {
                keyState[e.code] = false;
            });

            window.addEventListener("mousedown", (e) => {
                if (!controls.isLocked) return;
                if (e.button === 0) handleMine();
                if (e.button === 2) handlePlace();
            });

            window.addEventListener("contextmenu", (e) => e.preventDefault());
            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.body.addEventListener("click", () => {
                if (!controls.isLocked) controls.lock();
            });

            controls.addEventListener("lock", () => {
                document.getElementById("overlay").style.display = "none";
            });
            controls.addEventListener("unlock", () => {
                const ov = document.getElementById("overlay");
                ov.style.display = "flex";
                ov.querySelector("p").textContent = "Click anywhere to resume";
            });

            // ------------------------------------------------------------------
            // UI
            // ------------------------------------------------------------------
            const slotElems = [];
            const bar = document.getElementById("bar");

            for (let i = 0; i < TYPE_IDS.length; i++) {
                const type = TYPE_IDS[i];
                const col = `rgb(${Math.round(COLORS[type].r * 255)}, ${Math.round(COLORS[type].g * 255)}, ${Math.round(COLORS[type].b * 255)})`;

                const el = document.createElement("div");
                el.className = "slot";
                el.style.background = col;
                el.style.boxShadow = "inset 0 0 18px rgba(0,0,0,0.3)";
                el.innerHTML = `<span class="name">${TYPE_NAMES[type]}</span><span class="count">${inventory[type]}</span>`;
                bar.appendChild(el);
                slotElems.push(el);
            }

            function selectSlot(i) {
                selectedSlot = i;
                updateUI();
            }

            function updateUI() {
                for (let i = 0; i < TYPE_IDS.length; i++) {
                    const type = TYPE_IDS[i];
                    const el = slotElems[i];
                    el.className =
                        "slot" + (i === selectedSlot ? " active" : "");
                    el.querySelector(".count").textContent = inventory[type];
                }
            }

            // ------------------------------------------------------------------
            // Initial spawn
            // ------------------------------------------------------------------
            createChunk(0, 0); // immediate spawn chunk

            for (let cx = -3; cx <= 3; cx++) {
                for (let cz = -3; cz <= 3; cz++) {
                    if (cx === 0 && cz === 0) continue;
                    createChunk(cx, cz);
                }
            }

            const h0 = Math.floor(terrainHeight(0, 0));
            playerPos.set(0.5, h0 + 1.05, 0.5);
            velocity.set(0, 0, 0);
            camera.position.set(0.5, playerPos.y + EYE_HEIGHT, 0.5);
            updateUI();

            // ------------------------------------------------------------------
            // Main loop
            // ------------------------------------------------------------------
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const dt = clock.getDelta();

                updateChunks();
                processChunks(8);

                if (controls.isLocked) updatePlayer(dt);

                updateDrops(dt);

                renderer.render(scene, camera);
            }

            animate();
        </script>
    </body>
</html>
